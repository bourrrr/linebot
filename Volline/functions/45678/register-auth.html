<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>註冊 - 使用 LINE 建立帳號</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --bg:#efede9; --bg-2:#dad7cd;
      --text:#363636; --muted:#6e746e;
      --primary:#588157; --primary-weak:#659963de;
      --surface:#ffffff; --chip:#f4f3ef; --border:#e7e5dc;
    }
    body{ background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%); color:var(--text); }
    .card{ background:var(--surface); border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,.06); }
    .btn{ width:100%; border-radius:1.25rem; padding:1.05rem 1rem; font-weight:800; letter-spacing:.02em; transition:.15s transform,.15s filter; }
    .btn:hover{ transform:translateY(-1px); }
    .btn-line{ background:#06C755; color:#fff; }
    .feature{ background:var(--chip); border:1px solid var(--border); }
    .feature .badge{
      width:28px; height:28px; border-radius:9999px; display:inline-flex; align-items:center; justify-content:center;
      background:var(--primary); color:#fff; font-size:14px; box-shadow:0 2px 8px rgba(88,129,87,.25);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-xl card rounded-3xl overflow-hidden p-7 sm:p-10">
    <div class="w-48 sm:w-56 mx-auto">
      <img src="MakeWell.jpg" alt="MakeWell Logo" class="block w-full h-auto object-contain">
    </div>

    <div class="mt-5 text-center">
      <h1 class="text-3xl sm:text-4xl font-extrabold leading-snug" style="color:var(--primary)">建立你的 MakeWell 帳號</h1>
      <p class="mt-2 text-[15px]" style="color:var(--muted)">第 1 步：使用 LINE 驗證身份；第 2 步：填寫基本資料。</p>
    </div>

    <div class="mt-5 grid gap-2">
      <div class="feature rounded-xl px-3 py-2.5 flex items-center gap-3">
        <span class="badge">🧭</span>
        <div class="text-sm font-medium">兩步驟更清楚</div>
        <span class="ml-auto text-xs" style="color:var(--muted)">LINE 登入 → 基本資料</span>
      </div>
      <div class="feature rounded-xl px-3 py-2.5 flex items-center gap-3">
        <span class="badge">🔒</span>
        <div class="text-sm font-medium">以 LINE 身分註冊</div>
        <span class="ml-auto text-xs" style="color:var(--muted)">更直覺、更安全</span>
      </div>
    </div>

    <button id="lineSignupBtn" class="mt-6 btn btn-line">使用 LINE 建立帳號</button>
    <div id="providerHint" class="text-xs text-center hidden mt-2" style="color:var(--muted)"></div>

    <div class="mt-6 text-center text-sm">
      已經有帳號？<a href="login.html" class="font-semibold underline" style="color:var(--primary)">返回登入</a>
    </div>
  </div>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- App logic（只保留 LINE） -->
  <script type="module" src="./register-auth.js"></script>
</body>
</html>
