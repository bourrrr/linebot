<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>志工任務中心 - MakeWell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{ --bg:#efede9; --bg-2:#dad7cd; --text:#363636; --muted:#6e746e; --primary:#588157; --primary-weak:#659963de; --surface:#ffffff; --chip:#f4f3ef; --border:#e7e5dc; }
    body{ background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%); color:var(--text); }
    .card{ background:var(--surface); border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,.06); }
    .feature{ background:var(--chip); border:1px solid var(--border); transition:.15s transform,.15s filter; }
    .feature:hover{ transform:translateY(-2px); filter:brightness(.985); }
    .feature-badge{ width:44px; height:44px; border-radius:9999px; display:inline-flex; align-items:center; justify-content:center; background:var(--primary); color:#fff; font-size:20px; box-shadow:0 2px 10px rgba(88,129,87,.25); }
    .btn-logout{ border:1px solid var(--border); background:#fff; padding:.7rem 1rem; border-radius:9999px; font-weight:700; transition:.15s transform,.15s filter; }
    .btn-logout:hover{ transform:translateY(-1px); filter:brightness(.98); }
    .h-divider{ height:1px; width:100%; background:linear-gradient(to right, transparent, var(--border), transparent); }
  </style>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- LIFF + Firestore 守門（僅志工可進） -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from './firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    const LIFF_ID = "2007877199-Y5R2LenL";

    function roleKey(s){
      const m = String(s||'').trim().toLowerCase();
      if (m === '患者' || m === 'patient') return 'patient';
      if (m === '志工' || m === 'volunteer') return 'volunteer';
      return '';
    }
    function getUserRoles(data){
      const raw = (data && (data.roles ?? data.role)) ?? [];
      const arr = Array.isArray(raw) ? raw : (raw ? [raw] : []);
      const set = new Set(arr.map(roleKey).filter(Boolean));
      return { isPatient: set.has('patient'), isVolunteer: set.has('volunteer') };
    }

    // ====== 彈窗顯示/關閉（含「不再顯示」記憶） ======
    const modal     = document.getElementById('loginHintModal');
    const backdrop  = document.getElementById('modalBackdrop');
    const closeBtn  = document.getElementById('modalClose');
    const ackBtn    = document.getElementById('ackBtn');
    const dontShow  = document.getElementById('dontShowChk');

    function openModal(){ backdrop.classList.remove('hidden'); modal.classList.remove('hidden'); }
    function closeModal(){ modal.classList.add('hidden'); backdrop.classList.add('hidden'); }

    function wireModalHandlers(uid){
      const key = `mw_hide_volunteer_hint:${uid}`;
      const shouldHide = localStorage.getItem(key) === '1';
      if (!shouldHide) openModal();

      function handleClose(){
        if (dontShow?.checked) localStorage.setItem(key, '1');
        closeModal();
      }
      ackBtn?.addEventListener('click', handleClose);
      closeBtn?.addEventListener('click', handleClose);
      backdrop?.addEventListener('click', e => { if (e.target === backdrop) handleClose(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') handleClose(); });
    }

    // ====== 身分守門 ======
    async function guard() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { location.href = "login.html"; return; }

        const p   = await liff.getProfile();
        const uid = `line:${p.userId}`;

        const snap = await getDoc(doc(db, "users", uid));
        if (!snap.exists()) { location.href = "register-profile.html"; return; }

        const { isPatient, isVolunteer } = getUserRoles(snap.data());
        if (!isVolunteer) {
          if (isPatient) { location.href = "home.html"; return; }
          location.href = "register-profile.html"; return;
        }

        // ✅ 已確認志工 → 視使用者設定決定是否顯示彈窗
        wireModalHandlers(uid);
      } catch (e) {
        console.error('[VOLUNTEER] guard error:', e);
        location.href = "login.html";
      }
    }
    guard();

    // 登出（僅 LIFF）
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('logoutBtn')?.addEventListener('click', () => {
        try { liff.logout(); } catch(e) {}
        location.href = "login.html";
      });
    });
  </script>
</head>

<body class="min-h-screen px-4 py-6 md:px-6 md:py-8">
  <div class="mx-auto max-w-[1120px]">
    <div class="card rounded-3xl p-8 md:p-12 min-h-[82vh] md:min-h-[86vh] flex flex-col">
      <!-- Header -->
      <div class="flex justify-between items-center mb-4 md:mb-10">
          <h3 class="text-3xl md:text-4xl font-extrabold leading-tight" style="color:var(--primary)">
            👤 志工任務中心
          </h3>
          <button id="logoutBtn" class="btn-logout text-xs md:text-sm">登出</button>
        </div>
      <div class="h-divider"></div>
      <!-- 功能入口 -->
      <main class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6 mt-8 md:mt-12">
        <a href="task-list.html" class="feature rounded-2xl px-4 py-4 md:px-5 md:py-5 flex items-center gap-5 min-h-[120px]">
          <span class="feature-badge">📋</span>
          <div class="min-w-0">
            <div class="text-lg md:text-xl font-semibold">任務待接區</div>
            <div class="text-sm md:text-base mt-1 truncate" style="color:var(--muted)">查看等待支援的請求，挑選協助對象</div>
          </div>
          <span class="ml-auto text-2xl">›</span>
        </a>

        <a href="my-tasks.html" class="feature rounded-2xl px-4 py-4 md:px-5 md:py-5 flex items-center gap-5 min-h-[120px]">
          <span class="feature-badge">✅</span>
          <div class="min-w-0">
            <div class="text-lg md:text-xl font-semibold">我的任務</div>
            <div class="text-sm md:text-base mt-1 truncate" style="color:var(--muted)">追蹤已接受的任務與處理狀態</div>
          </div>
          <span class="ml-auto text-2xl">›</span>
        </a>

        <a href="task-history.html" class="feature rounded-2xl px-4 py-4 md:px-5 md:py-5 flex items-center gap-5 min-h-[120px]">
          <span class="feature-badge">📸</span>
          <div class="min-w-0">
            <div class="text-lg md:text-xl font-semibold">任務回報記錄</div>
            <div class="text-sm md:text-base mt-1 truncate" style="color:var(--muted)">查看已上傳的完成照片與回報內容</div>
          </div>
          <span class="ml-auto text-2xl">›</span>
        </a>

        <a href="volunteer-profile.html" class="feature rounded-2xl px-4 py-4 md:px-5 md:py-5 flex items-center gap-5 min-h-[120px]">
          <span class="feature-badge">👤</span>
          <div class="min-w-0">
            <div class="text-lg md:text-xl font-semibold">個人資料</div>
            <div class="text-sm md:text-base mt-1 truncate" style="color:var(--muted)">檢視與更新志工資訊與聯絡方式</div>
          </div>
          <span class="ml-auto text-2xl">›</span>
        </a>
      </main>
    </div>
  </div>

  <!-- 登入提示彈窗（含不再顯示 + 我已了解） -->
  <div id="modalBackdrop" class="hidden fixed inset-0 z-50 bg-black/50">
    <div id="loginHintModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
      <div class="relative bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
        <!-- 關閉（右上角 ×） -->
        <button id="modalClose" aria-label="關閉"
                class="absolute top-3 right-3 rounded-full w-8 h-8 flex items-center justify-center border border-[var(--border)] hover:bg-gray-50">
          ✕
        </button>

        <h3 class="text-xl font-extrabold mb-3" style="color:var(--primary)">歡迎來到志工任務中心</h3>
        <ul class="list-disc pl-5 space-y-2 text-[15px]" style="color:var(--muted)">
          <li>查看患者的需求清單📋</li>
          <li>接受請求後會建立臨時聊天室💬</li>
          <li>前往指定地點協助（支援地圖導航）🗺️</li>
          <li>完成後上傳照片回報，任務即完成✅</li>
        </ul>

        <div class="mt-5">
          <label class="inline-flex items-center gap-2 text-sm text-gray-600 select-none">
            <input id="dontShowChk" type="checkbox" class="w-4 h-4">
            不再顯示此則訊息
          </label>

          <div class="mt-4 flex items-center justify-end gap-2">
            <button id="ackBtn" class="px-4 py-2 rounded-full font-bold text-white" style="background:var(--primary)">我已了解</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
