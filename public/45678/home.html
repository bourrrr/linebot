<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>患者首頁 - MakeWell</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg:#efede9; /* 背景顏色 */
      --text:#363636; 
      --muted:#6e746e; 
      --primary:#588157; 
      --primary-weak:#659963de; 
      --surface:#ffffff; 
      --chip:#f4f3ef; 
      --border:#e7e5dc; 
    }
    body { 
      background:var(--bg); 
      color:var(--text);
      min-height: 100vh;
    }
    .card { 
      background:var(--surface); 
      border:1px solid var(--border); 
      box-shadow:0 10px 30px rgba(0,0,0,.06); 
    }
    .feature { 
      background:var(--chip); 
      border:1px solid var(--border); 
      transition:.15s transform,.15s filter; 
    }
    .feature:hover { 
      transform:translateY(-2px); 
      filter:brightness(.985); 
    }
    .feature-badge {
      width:44px; 
      height:44px; 
      border-radius:9999px; 
      display:inline-flex; 
      align-items:center; 
      justify-content:center;
      background:var(--primary); 
      color:#fff; 
      font-size:20px; 
      box-shadow:0 2px 10px rgba(88,129,87,.25);
    }
    .btn-logout {
      border:1px solid var(--border);
      background:#fff; 
      padding:.7rem 1rem; 
      border-radius:9999px; 
      font-weight:700;
      transition:.15s transform,.15s filter;
    }
    .btn-logout:hover { 
      transform:translateY(-1px); 
      filter:brightness(.98); 
    }
    .h-divider { 
      height:1px; 
      width:100%; 
      background:linear-gradient(to right, transparent, var(--border), transparent); 
    }
  </style>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from './firebase-config.js';

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const LIFF_ID = "2007877199-Y5R2LenL";

    // 角色判斷
    function roleKey(s){
      const m = String(s||'').trim().toLowerCase();
      if (m === '患者' || m === 'patient') return 'patient';
      if (m === '志工' || m === 'volunteer') return 'volunteer';
      return '';
    }
    function getUserRoles(data){
      const raw = (data && (data.roles ?? data.role)) ?? [];
      const arr = Array.isArray(raw) ? raw : (raw ? [raw] : []);
      const set = new Set(arr.map(roleKey).filter(Boolean));
      return { isPatient: set.has('patient'), isVolunteer: set.has('volunteer') };
    }

    // ===== 首次登入提示彈窗 =====
    const modal = document.getElementById('onboardModal');
    const backdrop = document.getElementById('modalBackdrop');
    const closeBtn = document.getElementById('modalClose');
    const ackBtn = document.getElementById('ackBtn');
    const dontShow = document.getElementById('dontShowChk');

    function openModal(){ backdrop.classList.remove('hidden'); modal.classList.remove('hidden'); }
    function closeModal(){ modal.classList.add('hidden'); backdrop.classList.add('hidden'); }

    function wireModalHandlers(uid){
      const key = `mw_hide_patient_hint:${uid}`;
      const shouldHide = localStorage.getItem(key) === '1';
      if (!shouldHide) openModal();

      function handleClose(){
        if (dontShow?.checked) localStorage.setItem(key, '1');
        closeModal();
      }
      ackBtn?.addEventListener('click', handleClose);
      closeBtn?.addEventListener('click', handleClose);
      backdrop?.addEventListener('click', e => { if (e.target === backdrop) handleClose(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') handleClose(); });
    }

    // ===== 守門（限患者） =====
    async function guard() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          location.href = "login.html";
          return;
        }
        const profile = await liff.getProfile();
        const uid = `line:${profile.userId}`;

        const snap = await getDoc(doc(db, "users", uid));
        if (!snap.exists()) { 
          location.href = "register-profile.html"; 
          return; 
        }

        const { isPatient, isVolunteer } = getUserRoles(snap.data());
        if (!isPatient) {
          if (isVolunteer) { 
            location.href = "volunteer.html"; 
            return; 
          }
          location.href = "register-profile.html"; 
          return;
        }

        // ✅ 是患者 → 綁定彈窗
        wireModalHandlers(uid);
      } catch (e) {
        console.error('[HOME] Guard error:', e);
        //alert('登入狀態檢查失敗，將返回登入頁。');
        location.href = "login.html";
      }
    }

    guard();

    // ===== 登出（Firebase + LIFF）=====
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('logoutBtn')?.addEventListener('click', async () => {
        try { await signOut(auth); } catch(e) {}
        try { liff.logout(); } catch(e) {}
        location.href = "login.html";
      });
    });
  </script>
</head>

<body class="px-4 md:px-6 py-10">
  <div class="mx-auto max-w-[1120px]">
    <main class="w-full">
      <div class="card rounded-3xl px-6 py-10 md:py-24 md:px-14 w-full flex flex-col">
        <div class="flex justify-between items-center mb-4 md:mb-10">
          <h3 class="text-3xl md:text-4xl font-extrabold leading-tight" style="color:var(--primary)">
            👤 個人健康首頁
          </h3>
          <button id="logoutBtn" class="btn-logout text-xs md:text-sm">登出</button>
        </div>
        <div class="flex-grow flex flex-col justify-center py-8 md:py-12">
          <section class="grid grid-cols-1 sm:grid-cols-2 gap-5 md:gap-8">
            <a href="publish.html" class="feature rounded-2xl px-3 py-3 md:px-4 md:py-4 flex items-center gap-5 min-h-[120px]">
              <span class="feature-badge">📝</span>
              <div class="min-w-0 flex flex-col justify-center">
                <div class="text-lg md:text-xl font-semibold">協助請求</div>
                <div class="text-sm md:text-base mt-1 truncate" style="color:var(--muted)">發布用藥或陪診等協助需求</div>
              </div>
              <span class="ml-auto text-2xl">›</span>
            </a>

            <a href="history.html" class="feature rounded-2xl px-3 py-3 md:px-4 md:py-4 flex items-center gap-5 min-h-[120px]">
              <span class="feature-badge">📜</span>
              <div class="min-w-0 flex flex-col justify-center">
                <div class="text-lg md:text-xl font-semibold">歷史記錄</div>
                <div class="text-sm md:text-base mt-1 truncate" style="color:var(--muted)">查看我過去的協助申請紀錄</div>
              </div>
              <span class="ml-auto text-2xl">›</span>
            </a>

            <a href="feedback.html" class="feature rounded-2xl px-3 py-3 md:px-4 md:py-4 flex items-center gap-5 min-h-[120px]">
              <span class="feature-badge">💬</span>
              <div class="min-w-0 flex flex-col justify-center">
                <div class="text-lg md:text-xl font-semibold">回饋專區</div>
                <div class="text-sm md:text-base mt-1 truncate" style="color:var(--muted)">查看志工服務的回饋與評價</div>
              </div>
              <span class="ml-auto text-2xl">›</span>
            </a>

            <a href="profile.html" class="feature rounded-2xl px-3 py-3 md:px-4 md:py-4 flex items-center gap-5 min-h-[120px]">
              <span class="feature-badge">🙍‍♀️</span>
              <div class="min-w-0 flex flex-col justify-center">
                <div class="text-lg md:text-xl font-semibold">個人資料</div>
                <div class="text-sm md:text-base mt-1 truncate" style="color:var(--muted)">檢視與更新個人基本資料</div>
              </div>
              <span class="ml-auto text-2xl">›</span>
            </a>
          </section>
        </div>
      </div>
    </main>
  </div>

  <!-- 首次提示彈窗 -->
  <div id="modalBackdrop" class="hidden fixed inset-0 z-50 bg-black/50">
    <div id="onboardModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
      <div class="relative bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
        <button id="modalClose" aria-label="關閉"
          class="absolute top-3 right-3 rounded-full w-8 h-8 flex items-center justify-center border border-[var(--border)] hover:bg-gray-50">✕</button>

        <h3 class="text-xl font-extrabold mb-3" style="color:var(--primary)">歡迎使用 MakeWell</h3>
        <ul class="list-disc pl-5 space-y-2 text-[15px]" style="color:var(--muted)">
          <li>選擇請求類型（陪診/領藥）🗂️</li>
          <li>填寫時間與地點，提交請求📍</li>
          <li>志工接受後，系統會建立臨時聊天室🤝</li>
          <li>任務結束後，志工端上傳回報照片，聊天室會自動關閉✅</li>
        </ul>
        <p class="mt-3 text-sm text-gray-500">
          💡 小提醒：身心障礙者，系統會自動配對有證照的志工。
        </p>

        <div class="mt-5">
          <label class="inline-flex items-center gap-2 text-sm text-gray-600 select-none">
            <input id="dontShowChk" type="checkbox" class="w-4 h-4">
            不再顯示此則訊息
          </label>
          <div class="mt-4 flex items-center justify-end gap-2">
            <button id="ackBtn" class="px-4 py-2 rounded-full font-bold text-white" style="background:var(--primary)">我已了解</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
