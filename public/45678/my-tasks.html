<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>我的任務 - MakeWell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --bg:#efede9; --bg-2:#dad7cd;
      --text:#363636; --muted:#6e746e;
      --primary:#588157; --primary-weak:#659963de;
      --surface:#ffffff; --chip:#f4f3ef; --border:#e7e5dc;
    }
    body{ background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%); color:var(--text); }
    .card{ background:var(--surface); border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,.06); }
    .btn-ghost{ border:1px solid var(--border); background:#fff; border-radius:9999px; padding:.6rem .9rem; font-weight:800; transition:.15s transform,.15s filter; }
    .btn-ghost:hover{ transform:translateY(-1px); filter:brightness(.98); }
    .h-divider{ height:1px; width:100%; background:linear-gradient(to right, transparent, var(--border), transparent); }
    .pill{
      display:inline-flex; align-items:center; justify-content:center;
      padding:.5rem .9rem; border-radius:9999px; font-weight:800;
      border:1px solid var(--border); background:#fff;
      white-space:nowrap; line-height:1; min-height:2.5rem;
    }
    .pill.active{ background:var(--primary); color:#fff; border-color:transparent; box-shadow:0 4px 12px rgba(88,129,87,.25); }
    .modal{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.35); z-index:50; }
    .modal.show{ display:flex; }
  </style>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- 守門（僅志工可進）→ 只初始化一次 Firebase -->
  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from './firebase-config.js';

    const app  = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    const LIFF_ID = "2007877199-Y5R2LenL";
    const CUSTOM_TOKEN_URL = "https://asia-east1-medwell-test1.cloudfunctions.net/authApi/getFirebaseCustomToken";

    (async () => {
      try{
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { location.href = "login.html"; return; }

        const idToken = liff.getIDToken();
        if (!idToken) { location.href = "login.html"; return; }
        const resp = await fetch(CUSTOM_TOKEN_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idToken })
        });
        if (!resp.ok) { alert("驗證失敗（HTTP "+resp.status+"）"); location.href="login.html"; return; }
        const { customToken } = await resp.json();
        if (!customToken) { alert("驗證失敗（no customToken）"); location.href="login.html"; return; }
        await signInWithCustomToken(auth, customToken);
        const uid = auth.currentUser?.uid;
        if (!uid) { location.href="login.html"; return; }
        const snap = await getDoc(doc(db, "users", uid));
        if (!snap.exists()) { location.href = "register-profile.html"; return; }

        const raw = snap.data()?.roles;
        const rolesArr = Array.isArray(raw) ? raw : [];
        const roles = rolesArr.map(r => String(r).trim().toLowerCase());
        const isVolunteer = roles.includes('志工') || roles.includes('volunteer');
        if (!isVolunteer) { location.href = "home.html"; return; }
      }catch(e){
        console.error(e);
        location.href="login.html";
      }
    })();
  </script>
</head>

<body class="min-h-screen p-4 flex items-center justify-center">
  <!-- 置中卡片，整張卡片固定高度，只有 main 捲動；底部工具列固定可見 -->
  <div class="w-full max-w-[1120px] card rounded-3xl overflow-hidden h-[90vh] md:h-[94vh] flex flex-col">

    <!-- Header（固定區，簡化：移除「回首頁」「任務歷史」） -->
    <div class="p-6 md:p-8 border-b border-[var(--border)] flex-shrink-0">
      <div class="flex items-start justify-between">
        <div>
          <h1 class="text-3xl sm:text-4xl font-extrabold mb-3 tracking-tight">✅ 我的任務</h1>
        </div>
      </div>

      <!-- 狀態列（固定區內） -->
      <section class="mt-2">
        <div class="flex flex-wrap items-center gap-2 md:gap-3">
          <span class="text-sm md:text-base font-bold">狀態：</span>
          <div class="flex flex-wrap gap-2 md:gap-3" role="group" aria-label="狀態篩選">
            <button id="filterAll" class="pill active text-sm md:text-base" type="button">全部</button>
            <button id="filterActive" class="pill text-sm md:text-base" type="button">進行中</button>
            <button id="filterDone" class="pill text-sm md:text-base" type="button">已完成</button>
          </div>
        </div>
      </section>
    </div>


    <!-- 內容（唯一可滾動區塊） -->
    <main class="flex-1 overflow-y-auto overscroll-contain">
      <div class="p-6 md:p-8">
        <div id="myTaskContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6"></div>
        <p id="emptyStateHint" class="hidden text-center text-sm md:text-base mt-8" style="color:var(--muted)">
          目前沒有任務。
        </p>
      </div>
    </main>

    <!-- 底部工具列（固定可見） -->
    <footer class="p-4 md:p-6 border-t border-[var(--border)] flex-shrink-0">
      <div class="flex flex-col-reverse md:flex-row items-stretch md:items-center gap-3 md:gap-4 md:justify-between">
        <a href="volunteer.html"
           class="btn-ghost text-center">
          ← 回首頁
        </a>
        <a href="task-history.html"
           class="px-5 py-2 rounded-full font-extrabold text-center"
           style="background:var(--primary);color:#fff;border:1px solid var(--primary);">
          📜 任務歷史
        </a>
      </div>
    </footer>
  </div>

  <!-- 取消配對 Modal -->
  <div id="cancelModal" class="modal" aria-hidden="true">
    <div class="card rounded-2xl p-6 w-[92vw] max-w-xl" role="dialog" aria-modal="true" aria-labelledby="cancelTitle">
      <h3 id="cancelTitle" class="text-xl font-extrabold">取消配對</h3>
      <p class="text-sm mt-1" style="color:var(--muted)">請勾選取消原因，確認後此任務將回到待接清單。</p>
      <div id="cancelTaskInfo" class="mt-2 text-sm font-bold"></div>
      <fieldset class="mt-4 space-y-2" id="cancelReasonGroup">
        <label class="flex items-center gap-2"><input type="checkbox" value="臨時有事" class="cr" /> 臨時有事</label>
        <label class="flex items-center gap-2"><input type="checkbox" value="交通問題" class="cr" /> 交通問題</label>
        <label class="flex items-center gap-2"><input type="checkbox" value="健康不適" class="cr" /> 健康不適</label>
        <label class="flex items-center gap-2"><input type="checkbox" value="任務資訊不足" class="cr" /> 任務資訊不足</label>
        <div class="mt-2">
          <label class="block text-sm mb-1">其他原因（可填）</label>
          <textarea id="cancelOther" class="w-full border border-[var(--border)] rounded-xl p-2.5" rows="3" placeholder="例如：時間無法配合…"></textarea>
        </div>
      </fieldset>
      <div class="mt-6 flex items-center justify-end gap-3">
        <button id="cancelCancelBtn" class="btn-ghost" type="button">返回</button>
        <button id="cancelConfirmBtn" class="btn-ghost" type="button">確認取消</button>
      </div>
    </div>
  </div>

  <!-- 列表/上傳/導航邏輯 -->
  <script type="module" src="my-tasks.js"></script>
</body>
</html>
