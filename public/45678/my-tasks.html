<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>我的任務 - MakeWell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{ --bg:#efede9; --bg-2:#dad7cd; --text:#363636; --muted:#6e746e; --primary:#588157; --primary-weak:#659963de; --surface:#ffffff; --chip:#f4f3ef; --border:#e7e5dc; }
    body{ background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%); color:var(--text); }
    .card{ background:var(--surface); border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,.06); }
    .btn-ghost{ border:1px solid var(--border); background:#fff; border-radius:9999px; padding:.6rem .9rem; font-weight:800; transition:.15s transform,.15s filter; }
    .btn-ghost:hover{ transform:translateY(-1px); filter:brightness(.98); }
    .h-divider{ height:1px; width:100%; background:linear-gradient(to right, transparent, var(--border), transparent); }
    .pill{ padding:.45rem .9rem; border-radius:9999px; font-weight:800; border:1px solid var(--border); background:#fff; }
    .pill.active{ background:var(--primary); color:#fff; border-color:transparent; box-shadow:0 4px 12px rgba(88,129,87,.25); }
    .modal{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.35); z-index:50; }
    .modal.show{ display:flex; }
  </style>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- LIFF 守門（僅志工） -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from './firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    const LIFF_ID = "2007877199-Y5R2LenL";

    (async () => {
      try{
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { location.href = "login.html"; return; }
        const p = await liff.getProfile();
        const uid = `liff:${p.userId}`;
        const snap = await getDoc(doc(db, "users", uid));
        if (!snap.exists()) { location.href = "register-profile.html"; return; }
        const role = (snap.data().role||'').trim();
        if (!(role === '志工' || role === 'volunteer')) { location.href = "home.html"; return; }
      }catch(e){ console.error(e); location.href="login.html"; }
    })();
  </script>
</head>
<body class="min-h-screen px-4 py-6 md:px-6 md:py-8">
  <div class="mx-auto max-w-[1120px]">
    <div class="card rounded-3xl p-8 md:p-12 min-h-[82vh] md:min-h-[86vh] flex flex-col">
      <div class="flex items-center justify-between gap-6">
        <div class="flex items-center gap-5">
          <img src="MakeWell.jpg" alt="MakeWell Logo" class="w-16 h-16 md:w-20 md:h-20 object-contain rounded-xl border border-[var(--border)] bg-white">
          <div>
            <h1 class="text-3xl md:text-4xl font-extrabold leading-tight">✅ 我的任務</h1>
            <p class="text-base md:text-lg" style="color:var(--muted)">追蹤已接受的「領藥／陪診」任務進度，完成後上傳回報。</p>
          </div>
        </div>
        <a href="volunteer.html" class="btn-ghost text-sm md:text-base">← 回志工中心</a>
      </div>

      <div class="mt-8 md:mt-10 h-divider"></div>

      <section class="mt-8 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div class="flex items-center gap-2">
          <span class="text-sm md:text-base font-bold mr-1">狀態：</span>
          <button id="filterAll"    class="pill active">全部</button>
          <button id="filterActive" class="pill">進行中</button>
          <button id="filterDone"   class="pill">已完成</button>
        </div>
        <div class="flex items-center gap-3">
          <button id="quickUploadBtn" class="btn-ghost">📸 快速上傳回報</button>
        </div>
      </section>

      <main class="mt-8 md:mt-10 flex-1">
        <div id="myTaskContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6"></div>
        <p id="emptyStateHint" class="hidden text-center text-sm md:text-base mt-8" style="color:var(--muted)">目前沒有任務。</p>
      </main>
    </div>
  </div>

  <!-- 快速回報對話框 -->
  <div id="quickModal" class="modal">
    <div class="card rounded-2xl p-6 w-[92vw] max-w-xl">
      <h3 class="text-xl font-extrabold">上傳回報</h3>
      <p class="text-sm mt-1" style="color:var(--muted)">選擇要附加回報的任務，然後確認上傳。</p>
      <div class="mt-4 space-y-3">
        <div>
          <label class="block text-sm font-bold mb-1">任務</label>
          <select id="quickTaskSelect" class="w-full border border-[var(--border)] rounded-xl p-2.5"></select>
        </div>
        <div id="quickFilesInfo" class="text-sm" style="color:var(--muted)"></div>
      </div>
      <div class="mt-6 flex items-center justify-end gap-3">
        <button id="cancelQuickUpload" class="btn-ghost">取消</button>
        <button id="confirmQuickUpload" class="btn-ghost">確認上傳</button>
      </div>
    </div>
  </div>
  <input id="quickFileInput" type="file" accept="image/*" multiple class="hidden" />

  <!-- 列表/上傳邏輯（改為 LIFF 版本） -->
  <script type="module" src="my-tasks.js"></script>

  <!-- UI 小互動（保留） -->
  <script>
    const container = document.getElementById('myTaskContainer');
    const emptyHint = document.getElementById('emptyStateHint');
    const pills = { all:filterAll, active:filterActive, done:filterDone };
    let currentFilter='all';
    const getCards=()=>Array.from(container.querySelectorAll('.task-card'));
    function apply(){ const cards=getCards(); let v=0; cards.forEach(c=>{ const s=(c.dataset.status||''); const show=(currentFilter==='all')||(currentFilter==='active'&&s==='active')||(currentFilter==='done'&&s==='done'); c.style.display=show?'':'none'; if(show) v++; }); emptyHint.classList.toggle('hidden', v!==0); }
    function setPill(k){ Object.entries(pills).forEach(([key,btn])=>btn.classList.toggle('active', key===k)); currentFilter=k; apply(); }
    filterAll.onclick = ()=>setPill('all');
    filterActive.onclick = ()=>setPill('active');
    filterDone.onclick = ()=>setPill('done');
    const mo = new MutationObserver(()=>{ apply(); rebuild(); }); mo.observe(container,{childList:true,subtree:true});
    const quickBtn = document.getElementById('quickUploadBtn'), fileInput = document.getElementById('quickFileInput'), modal = document.getElementById('quickModal');
    const taskSelect = document.getElementById('quickTaskSelect'), filesInfo=document.getElementById('quickFilesInfo'), confirmBtn=document.getElementById('confirmQuickUpload'), cancelBtn=document.getElementById('cancelQuickUpload');
    let files=[]; function open(){ modal.classList.add('show'); } function close(){ modal.classList.remove('show'); files=[]; filesInfo.textContent=''; fileInput.value=''; }
    function rebuild(){ taskSelect.innerHTML=''; const cards=getCards(); if(cards.length===0){ taskSelect.appendChild(new Option('（目前沒有任務）','',true,true)); taskSelect.disabled=true; }else{ taskSelect.disabled=false; cards.forEach(c=>{ const id=c.dataset.taskId||''; const t=c.querySelector('.task-title')?.textContent||`任務 ${id}`; taskSelect.appendChild(new Option(t,id)); }); } }
    quickBtn.onclick=()=>{ if(getCards().length===0) return alert('目前沒有任務可回報。'); fileInput.click(); };
    fileInput.onchange=()=>{ if(!fileInput.files?.length) return; files=Array.from(fileInput.files); filesInfo.textContent=`已選擇 ${files.length} 個檔案`; rebuild(); open(); };
    confirmBtn.onclick=()=>{ const taskId=taskSelect.value; if(!files.length) return alert('請先選擇檔案'); if(!taskId) return alert('請選擇任務'); if(typeof window.handleQuickReportUpload==='function'){ Promise.resolve(window.handleQuickReportUpload(taskId, files)).then(close).catch(()=>alert('上傳失敗，請稍後再試')); } else { close(); alert('已送出回報事件（quickReport）。請在程式中監聽並處理上傳。'); } };
    cancelBtn.onclick=close; modal.addEventListener('click',e=>{ if(e.target===modal) close(); });
  </script>
</body>
</html>
