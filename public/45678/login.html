<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>登入 - MakeWell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --bg:#efede9; --bg-2:#dad7cd;
      --text:#363636; --muted:#6e746e;
      --primary:#588157; --primary-weak:#659963de;
      --surface:#ffffff; --chip:#f4f3ef; --border:#e7e5dc;
    }
    body{ background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%); color:var(--text); }
    .card{ background:var(--surface); border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,.06); }

    .input{ border:1px solid var(--border); background:#fff; transition:.2s; }
    .input::placeholder{ color:#a0a6a0; }
    .input:focus{ outline:none; border-color:var(--primary-weak); box-shadow:0 0 0 4px rgba(101,153,99,.18); }

    .seg{ background:var(--chip); border:1px solid var(--border); }
    .seg-btn{ color:var(--text); }
    .seg-btn.active{ background:var(--primary); color:#fff; box-shadow:0 6px 14px rgba(88,129,87,.25); }

    .btn-block{ width:100%; border-radius:1.25rem; padding:0.95rem 1rem; font-weight:800; letter-spacing:.02em; transition:.15s transform,.15s filter; }
    .btn-block:hover{ transform:translateY(-1px); }
    .btn-primary{ background:var(--primary); color:#fff; }
    .btn-primary:hover{ background:var(--primary-weak); }
    .btn-line{ background:#06C755; color:#fff; }
    .btn-line:hover{ filter:brightness(.96); }
    .btn-fb{ background:#1877F2; color:#fff; }
    .btn-fb:hover{ filter:brightness(.96); }

    /* 舒適版尺寸（右側） */
    .seg-lg{ padding:6px; }
    .seg-lg .seg-btn{ padding:12px 0; font-size:1rem; }
    .input-lg{ padding-top:14px; padding-bottom:14px; }
    .btn-block{ padding:1.05rem 1rem; }

    /* 素雅分隔線（細、兩端漸隱） */
    .divider{
      position:absolute; inset-block:28px; left:50%; transform:translateX(-50%);
      width:1px; background:linear-gradient(to bottom, transparent, var(--border) 8%, var(--border) 92%, transparent);
    }
    .h-divider{ height:1px; width:100%; background:linear-gradient(to right, transparent, var(--border), transparent); }

    /* 左側特色卡片 */
    .feature{ background:var(--chip); border:1px solid var(--border); }
    .feature-badge{
      width:28px; height:28px; border-radius:9999px; display:inline-flex; align-items:center; justify-content:center;
      background:var(--primary); color:#fff; font-size:14px; box-shadow:0 2px 8px rgba(88,129,87,.25);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="relative w-full max-w-6xl card rounded-3xl overflow-hidden">
    <div class="divider hidden md:block"></div>

    <div class="grid md:grid-cols-2">
      <!-- 左：靠分隔線、整體置中；說明文字保持靠左 -->
      <div class="p-7 sm:p-10">
        <div class="w-full max-w-[460px] md:ml-auto mx-auto flex flex-col items-center justify-center gap-5">
          <div class="w-72 sm:w-80 md:w-96">
            <img src="MakeWell.jpg" alt="MakeWell Logo" class="block w-full h-auto object-contain">
          </div>

          <h1 class="text-center text-2xl sm:text-3xl font-extrabold leading-snug" style="color:var(--primary)">
            MakeWell 把照護變得更貼心
          </h1>

          <p class="w-full max-w-[46ch] text-left text-[15px]" style="color:var(--muted)">
            在這裡，患者與志工都能安心管理行程與任務。輕鬆登入，繼續你重要的一天。
          </p>

          <!-- 更貼合系統的三項特色 -->
          <div class="w-full grid gap-2">
            <div class="feature rounded-xl px-3 py-2.5 flex items-center gap-3">
              <span class="feature-badge">⚡</span>
              <div class="text-sm font-medium">即時媒合與 LINE 通知</div>
              <span class="ml-auto text-xs" style="color:var(--muted)">一鍵發佈、秒接案</span>
            </div>
            <div class="feature rounded-xl px-3 py-2.5 flex items-center gap-3">
              <span class="feature-badge">📍</span>
              <div class="text-sm font-medium">導航到場＋任務回報</div>
              <span class="ml-auto text-xs" style="color:var(--muted)">照片/簽到/完成</span>
            </div>
          </div>

          <div class="md:hidden mt-4 h-divider"></div>
        </div>
      </div>

      <!-- 右：靠分隔線、舒適行距 -->
      <div class="p-6 sm:p-10">
        <div class="w-full max-w-[460px] md:mr-auto mx-auto">
          <h2 class="text-3xl sm:text-4xl font-extrabold mb-3 text-center tracking-tight">登入你的帳號</h2>
          <p class="text-center text-base sm:text-[17px] leading-relaxed mb-6" style="color:var(--muted)">
            請選擇身分並以 Email、LINE 或 Facebook 登入
          </p>

          <div class="seg seg-lg rounded-full flex mb-6">
            <button id="patientBtn" class="seg-btn active flex-1 rounded-full text-base font-semibold transition">患者</button>
            <button id="volunteerBtn" class="seg-btn flex-1 rounded-full text-base font-semibold transition">志工</button>
          </div>
          <input id="role" type="hidden" value="患者"/>

          <div class="space-y-5">
            <input id="email" type="email" class="input input-lg w-full rounded-xl px-3" placeholder="Email"/>
            <input id="password" type="password" class="input input-lg w-full rounded-xl px-3" placeholder="密碼"/>

            <button id="loginBtn" class="btn-block btn-primary">登入</button>
            <button id="lineLoginBtn" class="btn-block btn-line flex items-center justify-center gap-2">
              <span>使用 LINE 帳號登入</span>
            </button>
            <button id="fbLoginBtn" class="btn-block btn-fb">使用 Facebook 登入</button>
          </div>

          <!-- 驗證提示 -->
          <div id="verifyNotice" class="mt-4 p-4 rounded-xl border border-yellow-300 bg-yellow-100 text-yellow-800 text-sm hidden">
            ⚠️ 您尚未完成 Email 驗證，請先至信箱點擊驗證連結。
            <button id="resendBtn" class="ml-2 underline">重新寄送驗證信</button>
          </div>
          <!-- 忘記密碼（左） + 註冊（右） with RWD -->
          <div class="mt-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 sm:gap-0 text-sm">
            <button id="forgotLink" type="button" class="underline text-[15px] sm:text-sm" style="color:var(--muted)">
              忘記密碼？
            </button>

            <span class="text-center sm:text-right text-[15px] sm:text-sm">
              還沒有帳號？
              <a href="register.html" class="font-semibold underline" style="color:var(--primary)">立即註冊</a>
            </span>
          </div>
      </div>
    </div>
  </div>

  <!-- 角色切換（一般腳本） -->
  <script>
    function setActiveRole(role){
      const patientBtn = document.getElementById('patientBtn');
      const volunteerBtn = document.getElementById('volunteerBtn');
      const roleInput   = document.getElementById('role');
      if(role === '志工'){
        volunteerBtn.classList.add('active'); patientBtn.classList.remove('active'); roleInput.value = '志工';
      }else{
        patientBtn.classList.add('active'); volunteerBtn.classList.remove('active'); roleInput.value = '患者';
      }
    }
    window.addEventListener('DOMContentLoaded', () => {
      const url = new URLSearchParams(location.search);
      setActiveRole(url.get('role') || '患者');
      document.getElementById('patientBtn').addEventListener('click', ()=> setActiveRole('患者'));
      document.getElementById('volunteerBtn').addEventListener('click', ()=> setActiveRole('志工'));
    });
  </script>

  <!-- Firebase（Email/密碼 + 忘記密碼 + 驗證信） -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      sendEmailVerification,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from './firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const roleInput    = document.getElementById('role');
    const loginBtn     = document.getElementById('loginBtn');
    const verifyNotice = document.getElementById('verifyNotice');
    const resendBtn    = document.getElementById('resendBtn');
    const forgotLink   = document.getElementById('forgotLink');

    loginBtn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if(!email || !password){ alert('請完整輸入 Email 與密碼'); return; }
      try{
        const { user } = await signInWithEmailAndPassword(auth, email, password);
        if(!user.emailVerified){ verifyNotice.classList.remove('hidden'); return; }
        const role = roleInput.value;
        if(role === '患者'){ window.location.href = 'home.html'; }
        else { window.location.href = 'volunteer.html'; }
      }catch(err){ alert('❌ 登入失敗：' + err.message); }
    });

    resendBtn?.addEventListener('click', async () => {
      const user = auth.currentUser;
      try{
        await sendEmailVerification(user);
        alert('✅ 驗證信已重新寄出，請至信箱查看。');
      }catch(err){
        alert('❌ 無法寄送驗證信：' + err.message);
      }
    });

    // 忘記密碼：用輸入框的 Email；若沒填，請使用者輸入
    forgotLink.addEventListener('click', async () => {
      const fieldEmail = document.getElementById('email').value.trim();
      const email = fieldEmail || (prompt('請輸入用於登入的 Email：') || '').trim();
      if(!email){ alert('請先輸入 Email。'); return; }
      try{
        await sendPasswordResetEmail(auth, email);
        alert('✅ 已寄出重設密碼連結至：' + email);
      }catch(err){
        alert('❌ 無法寄送重設信：' + err.message);
      }
    });
  </script>

  <!-- 先放提示，之後接上你的 OAuth/LIFF -->
  <script>
    document.getElementById('lineLoginBtn').addEventListener('click', () => {
      alert('LINE 登入：請接上你的 LIFF / OAuth 流程');
    });
    document.getElementById('fbLoginBtn').addEventListener('click', () => {
      alert('Facebook 登入：請接上你的 OAuth 流程');
    });
  </script>
</body>
</html>
