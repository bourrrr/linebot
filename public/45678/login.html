<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>登入 - MakeWell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
  /* 淡入向上滑動 */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-in-up {
    animation: fadeInUp 0.8s ease-out;
  }

  /* Logo 放大動畫 */
  @keyframes scaleIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .scale-in {
    animation: scaleIn 0.6s ease-out;
  }

  /* 按鈕點擊效果 */
  .button-pulse:active {
    transform: scale(0.95);
    transition: transform 0.1s ease;
  }

  /* 錯誤訊息抖動 */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  .shake {
    animation: shake 0.4s ease-in-out;
  }
 
  #slider {
    transition: left 0.3s ease;
  }

</style>

</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 fade-in-up">
  <div class="bg-white shadow-lg rounded-2xl flex flex-col md:flex-row flex-wrap w-full max-w-5xl overflow-hidden">
    <!-- 左側 Logo 區 -->
    <div class="md:w-1/3 w-full flex items-center justify-center p-6">
      <img src="MakeWell.jpg" alt="MakeWell Logo" class="max-h-72 w-full max-w-[400px] object-contain scale-in" />
    </div>

    <!-- 右側 登入表單 -->
    <div class="md:w-2/3 w-full p-8">
      <h2 class="text-2xl font-bold mb-4 text-center">🔐 登入系統</h2>

	<!-- 🔄 滑動切換按鈕 -->
	<div class="relative w-full max-w-xs mx-auto mb-6">
	  <div class="bg-gray-200 rounded-full flex items-center px-1 py-1 relative overflow-hidden">
		<!-- 滑動底層 -->
		<div id="slider" class="absolute top-1 left-0 h-9 w-1/2 bg-green-500 rounded-full transition-transform duration-300 ease-out z-0"></div>
		<!-- 患者 -->
		<button id="patientBtn" class="w-1/2 z-10 relative text-center text-sm font-medium py-2 rounded-full focus:outline-none text-white">患者</button>
		<!-- 志工 -->
		<button id="volunteerBtn" class="w-1/2 z-10 relative text-center text-sm font-medium py-2 rounded-full focus:outline-none text-gray-700">志工</button>
	  </div>
	</div>
	<input id="role" type="hidden" value="患者" />



      <input class="w-full mb-3 p-2 border rounded" id="email" placeholder="Email" type="email"/>
      <input class="w-full mb-4 p-2 border rounded" id="password" placeholder="密碼" type="password"/>
      <button class="bg-blue-500 text-white w-full py-2 rounded" id="loginBtn">登入</button>

      <div class="mt-4 p-4 bg-yellow-100 border border-yellow-300 rounded hidden" id="verifyNotice">
        <p class="text-yellow-800 text-sm mb-2">⚠️ 您尚未完成 Email 驗證，請先至信箱點擊驗證連結。</p>
        <button class="text-sm text-blue-600 hover:underline" id="resendBtn">重新寄送驗證信</button>
      </div>

      <p class="mt-4 text-center text-sm">還沒有帳號？
        <a class="text-blue-600 hover:underline" href="register.html">註冊</a>
      </p>
    </div>
  </div>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role') || '患者';

    const patientBtn = document.getElementById('patientBtn');
    const volunteerBtn = document.getElementById('volunteerBtn');
    const roleInput = document.getElementById('role');

    if (role === '志工') {
      volunteerBtn.classList.add('bg-green-500', 'text-white');
      patientBtn.classList.remove('bg-green-500', 'text-white');
      roleInput.value = '志工';
    } else {
      patientBtn.classList.add('bg-green-500', 'text-white');
      volunteerBtn.classList.remove('bg-green-500', 'text-white');
      roleInput.value = '患者';
    }
  });
</script>

  <script type="module">
    const patientBtn = document.getElementById('patientBtn');
    const volunteerBtn = document.getElementById('volunteerBtn');
    const roleInput = document.getElementById('role');

    patientBtn.addEventListener('click', () => {
      roleInput.value = '患者';
      patientBtn.classList.add('bg-green-500', 'text-white');
      volunteerBtn.classList.remove('bg-green-500', 'text-white');
    });

    volunteerBtn.addEventListener('click', () => {
      roleInput.value = '志工';
      volunteerBtn.classList.add('bg-green-500', 'text-white');
      patientBtn.classList.remove('bg-green-500', 'text-white');
    });

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      sendEmailVerification
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from './firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginBtn = document.getElementById('loginBtn');
    const verifyNotice = document.getElementById('verifyNotice');
    const resendBtn = document.getElementById('resendBtn');

    loginBtn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        if (!user.emailVerified) {
          verifyNotice.classList.remove('hidden');
        } else {
          const role = roleInput.value;
          if (role === "患者") {
            window.location.href = "home.html";
          } else {
            window.location.href = "volunteer.html";
          }
        }
      } catch (err) {
        alert("❌ 登入失敗：" + err.message);
      }
    });

    resendBtn.addEventListener('click', async () => {
      const user = auth.currentUser;
      try {
        await sendEmailVerification(user);
        alert("✅ 驗證信已重新寄出，請至信箱查看。");
      } catch (err) {
        alert("❌ 無法寄送驗證信：" + err.message);
      }
    });
  </script>
</body>
</html>
