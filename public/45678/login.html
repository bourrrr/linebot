<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>登入 - MakeWell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --bg:#efede9; --bg-2:#dad7cd;
      --text:#363636; --muted:#6e746e;
      --primary:#588157; --primary-weak:#659963de;
      --surface:#ffffff; --chip:#f4f3ef; --border:#e7e5dc;
    }
    body{ background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%); color:var(--text); }
    .card{ background:var(--surface); border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,.06); }
    .pill{ background:var(--chip); border:1px solid var(--border); }
    .seg-btn{ color:var(--text); }
    .seg-btn.active{ background:var(--primary); color:#fff; box-shadow:0 6px 14px rgba(88,129,87,.25); }
    .btn{ width:100%; border-radius:1.25rem; padding:1.05rem 1rem; font-weight:800; letter-spacing:.02em; transition:.15s transform,.15s filter; }
    .btn:hover{ transform:translateY(-1px); }
    .btn-line{ background:#06C755; color:#fff; }
    .feature{ background:var(--chip); border:1px solid var(--border); }
    .feature .badge{
      width:28px; height:28px; border-radius:9999px; display:inline-flex; align-items:center; justify-content:center;
      background:var(--primary); color:#fff; font-size:14px; box-shadow:0 2px 8px rgba(88,129,87,.25);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <!-- 單欄卡片 -->
  <div class="w-full max-w-xl card rounded-3xl overflow-hidden p-7 sm:p-10">
    <!-- Logo -->
    <div class="w-48 sm:w-56 mx-auto">
      <img src="MakeWell.jpg" alt="MakeWell Logo" class="block w-full h-auto object-contain">
    </div>

    <!-- 標題 -->
    <div class="mt-5 text-center">
      <h1 class="text-3xl sm:text-4xl font-extrabold leading-snug" style="color:var(--primary)">MakeWell 把照護變得更貼心</h1>
      <p class="mt-2 text-[15px]" style="color:var(--muted)">患者與志工安心管理行程與任務。輕鬆登入，繼續你重要的一天。</p>
    </div>


    <!-- 角色切換 -->
    <div class="mt-6 pill rounded-full p-1 flex">
      <button id="patientBtn" class="seg-btn active flex-1 rounded-full text-base font-semibold py-2">患者</button>
      <button id="volunteerBtn" class="seg-btn flex-1 rounded-full text-base font-semibold py-2">志工</button>
    </div>
    <input id="role" type="hidden" value="患者"/>

    <!-- LINE 登入 -->
    <button id="lineLoginBtn" class="mt-4 btn btn-line flex items-center justify-center gap-2">
      <span>使用 LINE 帳號登入</span>
    </button>
    <div id="lineStatus" class="text-xs text-center hidden mt-2" style="color:var(--muted)"></div>

    <div class="mt-6 text-center text-sm">
      還沒有帳號？
      <a href="register-auth.html" class="font-semibold underline" style="color:var(--primary)">使用 LINE 建立帳號</a>
    </div>

    <div id="guardMsg" class="hidden mt-4 text-center text-sm rounded-xl px-3 py-2" style="background:#fef9c3; color:#854d0e; border:1px dashed #eab308;">
      尚未完成註冊，已為你導向基本資料頁。
    </div>
  </div>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- Firebase（用來檢查 users 是否已建立） -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    const LIFF_ID = "2007877199-Y5R2LenL";

    function setActiveRole(role){
      const patientBtn = document.getElementById('patientBtn');
      const volunteerBtn = document.getElementById('volunteerBtn');
      const roleInput   = document.getElementById('role');
      if(role === '志工'){
        volunteerBtn.classList.add('active'); patientBtn.classList.remove('active'); roleInput.value = '志工';
      }else{
        patientBtn.classList.add('active'); volunteerBtn.classList.remove('active'); roleInput.value = '患者';
      }
    }

    async function ensureLIFF(){
      try{
        if(!window.liff) throw new Error("LIFF SDK 未載入");
        if(!window.MW_LIFF_READY){
          await liff.init({ liffId: LIFF_ID });
          window.MW_LIFF_READY = true;
        }
        return true;
      }catch(e){
        console.warn("LIFF 初始化失敗：", e);
        alert("無法初始化 LINE LIFF，請稍後再試或確認 LIFF 設定。");
        return false;
      }
    }

    async function updateLineStatusUI(){
      const el = document.getElementById('lineStatus');
      if(!window.liff || !window.MW_LIFF_READY){ el.classList.add('hidden'); return; }
      if(!liff.isLoggedIn()){ el.classList.add('hidden'); return; }
      try{
        const p = await liff.getProfile();
        el.textContent = `已登入 LINE：${p.displayName}`;
        el.classList.remove('hidden');
      }catch{ el.classList.add('hidden'); }
    }

    // 初始化 UI（單欄不需 grid）
    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('patientBtn').addEventListener('click', ()=> setActiveRole('患者'));
      document.getElementById('volunteerBtn').addEventListener('click', ()=> setActiveRole('志工'));
      if (window.liff) {
        const ok = await ensureLIFF();
        if (ok) updateLineStatusUI();
      }
    });

    // 只允許已註冊者登入
    document.getElementById('lineLoginBtn').addEventListener('click', async () => {
      if (!(await ensureLIFF())) return;

      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: location.href });
        return;
      }

      try{
        const profile = await liff.getProfile();
        const idToken = liff.getIDToken();
        const liffUid = profile.userId || "";
        const uid = `liff:${liffUid}`;

        // 1) 檢查 Firestore 是否已有 users/{uid}
        const snap = await getDoc(doc(db, "users", uid));
        if (!snap.exists()) {
          alert("尚未註冊，請先完成基本資料。");
          document.getElementById('guardMsg').classList.remove('hidden');
          window.location.href = "register-profile.html";
          return;
        }

        // 2) 已註冊 → 儲存快取（可省略）
        localStorage.setItem('MW_LIFF_UID', liffUid);
        localStorage.setItem('MW_LIFF_NAME', profile.displayName || '');
        localStorage.setItem('MW_LIFF_PIC', profile.pictureUrl || '');
        if (idToken) localStorage.setItem('MW_LIFF_ID_TOKEN', idToken);

        // 3) 角色決定：DB 優先，沒有才用切換值
        const data = snap.data() || {};
        const roleInDB = (data.role || '').trim();
        const role = roleInDB || document.getElementById('role').value;

        // 4) 進入對應首頁
        if (role === '志工') window.location.href = "volunteer.html";
        else window.location.href = "home.html";
      }catch(e){
        console.error(e);
        alert('登入流程發生錯誤，請再試一次。');
      }
    });
  </script>
</body>
</html>
