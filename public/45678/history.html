<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>歷史紀錄</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from './firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const listContainer = document.getElementById('recordList');

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      const snapshot = await getDocs(collection(db, 'users', user.uid, 'records'));
      if (snapshot.empty) {
        listContainer.innerHTML = `<p class="text-gray-500 text-center mt-4">目前沒有紀錄</p>`;
        return;
      }

      snapshot.forEach(doc => {
        const data = doc.data();
        const timeStr = data.time ? new Date(data.time).toLocaleString() : '無時間';
        const address = `${data.city || ''}${data.district || ''}${data.road || ''}`;
        const note = data.note || '無';
        const hospital = data.hospital || '無';
        const accompany = data.accompany || '';
        const prescriptionURL = data.prescriptionURL || '';

        const card = document.createElement('div');
        card.className = 'bg-white p-4 rounded-xl shadow space-y-1 mb-4';

        card.innerHTML = `
          <div class="text-sm text-gray-500">⏰ ${timeStr}</div>
          <div class="font-bold text-lg">📌 類型：${data.type || '未分類'}</div>
          <div class="text-sm">📍 地址：${address}</div>
          <div class="text-sm">🏥 醫院：${hospital}</div>
          ${accompany ? `<div class="text-sm">🙋‍♂️ 陪同進診間：${accompany}</div>` : ''}
          <div class="text-sm">📝 備註：${note}</div>
          ${prescriptionURL ? `<div><img src="${prescriptionURL}" alt="處方簽" class="w-32 mt-2 rounded border" /></div>` : ''}
        `;
        listContainer.appendChild(card);
      });
    });
  </script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
  <div class="max-w-2xl mx-auto">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4">
      <h1 class="text-xl font-bold">📜 歷史紀錄</h1>
      <a href="home.html" class="text-blue-500 hover:underline">← 回首頁</a>
    </div>
    <div id="recordList"></div>
  </div>
</body>
</html>
