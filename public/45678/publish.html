<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<title>發布協助請求</title>
<script src="https://cdn.tailwindcss.com"></script>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/></head>
<body class="p-4 flex justify-center min-h-screen items-center bg-gray-100">
<div class="bg-white p-6 rounded-2xl shadow-md max-w-md w-full">
<h2 class="text-xl font-bold mb-4 text-center">📢 發布協助請求</h2>
<form class="space-y-4" id="publishForm">
<select class="w-full p-2 border rounded" id="type" required="">
<option value="">請選擇請求類型</option>
<option value="領藥">💊領藥</option>
<option value="陪診">🧑‍⚕️陪診</option>
</select>
<label class="block font-semibold text-gray-700 mb-1" for="city">會合地點</label>
<select class="w-full p-2 border rounded" id="city" required="">
<option value="">請選擇縣市</option>
<option value="基隆市">基隆市</option>
<option value="臺北市">臺北市</option>
<option value="新北市">新北市</option>
<option value="桃園市">桃園市</option>
<option value="新竹市">新竹市</option>
<option value="新竹縣">新竹縣</option>
<option value="苗栗縣">苗栗縣</option>
<option value="臺中市">臺中市</option>
<option value="彰化縣">彰化縣</option>
<option value="南投縣">南投縣</option>
<option value="雲林縣">雲林縣</option>
<option value="嘉義市">嘉義市</option>
<option value="嘉義縣">嘉義縣</option>
<option value="臺南市">臺南市</option>
<option value="高雄市">高雄市</option>
<option value="屏東縣">屏東縣</option>
<option value="宜蘭縣">宜蘭縣</option>
<option value="花蓮縣">花蓮縣</option>
<option value="臺東縣">臺東縣</option>
<option value="澎湖縣">澎湖縣</option>
<option value="金門縣">金門縣</option>
<option value="連江縣">連江縣</option>
</select>
<select class="w-full p-2 border rounded" disabled="" id="district" required="">
<option value="">請選擇行政區</option>
</select>
<input class="w-full p-2 border rounded" id="road" placeholder="請輸入街道地址 (如 XX路100號)" required="" type="text"/>
<p class="text-sm text-gray-500 mt-1">
        🔒 為保護個人安全，建議填寫醫療院所或公共場所地址，避免揭露住家位置。
      </p>
<input class="w-full p-2 border rounded" id="hospital" placeholder="🏥 醫院名稱" required="" type="text"/>
<input class="w-full p-2 border rounded" id="time" required="" type="datetime-local"/>
<!-- 領藥專用欄位 -->
<div class="hidden" id="prescriptionField">
<label class="block text-sm font-semibold text-gray-700">📄 上傳處方簽（選填）</label>
<input accept="image/*,application/pdf" class="w-full border p-2 rounded" id="prescription" type="file"/>
</div>
<!-- 陪診專用欄位 -->
<div class="hidden" id="accompanyField">
<label class="block text-sm font-semibold text-gray-700">🙋‍♂️ 是否陪同進診間</label>
<select class="w-full border p-2 rounded" id="accompany">
<option value="">請選擇</option>
<option value="是">是</option>
<option value="否">否</option>
</select>
</div>
<textarea class="w-full p-2 border rounded" id="note" placeholder="📝 備註（選填）"></textarea>
<button class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600" type="submit">發布</button>
</form>
<div class="text-center mt-4">
<a class="text-blue-500 hover:underline" href="home.html">← 回首頁</a>
</div>
</div>
<script type="module">
    import { cityDistricts } from './district-data.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, Timestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from './firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const typeSelect = document.getElementById("type");
    const prescriptionField = document.getElementById("prescriptionField");
    const accompanyField = document.getElementById("accompanyField");

    typeSelect.addEventListener("change", () => {
      const value = typeSelect.value;
      prescriptionField.classList.toggle("hidden", value !== "領藥");
      accompanyField.classList.toggle("hidden", value !== "陪診");
    });

    const citySelect = document.getElementById("city");
    const districtSelect = document.getElementById("district");
    citySelect.addEventListener("change", () => {
      const selected = citySelect.value;
      districtSelect.innerHTML = '<option value="">請選擇行政區</option>';
      if (cityDistricts[selected]) {
        cityDistricts[selected].forEach(d => {
          const opt = document.createElement("option");
          opt.value = d;
          opt.textContent = d;
          districtSelect.appendChild(opt);
        });
        districtSelect.disabled = false;
      } else {
        districtSelect.disabled = true;
      }
    });

    document.getElementById("publishForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const type = typeSelect.value;
      const city = citySelect.value;
      const district = districtSelect.value;
      const road = document.getElementById("road").value;
      const hospital = document.getElementById("hospital").value;
      const time = document.getElementById("time").value;
      const note = document.getElementById("note").value;
      const accompany = document.getElementById("accompany")?.value || "";
      const prescriptionFile = document.getElementById("prescription")?.files[0] || null;

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          alert("請先登入");
          return;
        }

        try {
          const userDocSnap = await getDoc(doc(db, "users", user.uid));
          const userName = userDocSnap.exists() ? userDocSnap.data().name || "匿名" : "匿名";

          const requestData = {
            userId: user.uid,
            userName,
            type,
            city,
            district,
            road,
            hospital,
            time,
            note,
            accompany,
            status: "pending",
            createdAt: Timestamp.now()
          };

          await addDoc(collection(db, "requests"), requestData);
          await addDoc(collection(db, "users", user.uid, "records"), requestData);

          alert("✅ 發布成功！");
          window.location.href = "home.html";
        } catch (err) {
          console.error("發布失敗：", err);
          alert("❌ 發布失敗，請稍後再試");
        }
      });
    });
  </script>
</body>
</html>
