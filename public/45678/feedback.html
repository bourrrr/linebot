<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>回饋專區 - MakeWell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --bg:#efede9; --bg-2:#dad7cd;
      --text:#363636; --muted:#6e746e;
      --primary:#588157; --primary-weak:#659963de;
      --surface:#ffffff; --chip:#f4f3ef; --border:#e7e5dc;
      --star-empty:#d7d7d7; --star-fill:#f6c744; --star-stroke:#e0b72a;
    }
    body{ background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%); color:var(--text); }
    .card{ background:var(--surface); border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,.06); }
    .h-divider{ height:1px; width:100%; background:linear-gradient(to right, transparent, var(--border), transparent); }
    .btn-primary{
      background:var(--primary); color:#fff; font-weight:800;
      padding:.9rem 1.1rem; border-radius:9999px; transition:.15s transform,.15s filter;
    }
    .btn-primary:hover{ transform:translateY(-1px); filter:brightness(.98); }
    .btn-primary[disabled]{ opacity:.55; cursor:not-allowed; transform:none; filter:none; }

    /* 星星評分（左→右） */
    .rating-row{ display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; }
    .sradio{ position:absolute; opacity:0; width:1px; height:1px; overflow:hidden; }
    .star{
      display:inline-flex; align-items:center; justify-content:center;
      width:46px; height:46px; cursor:pointer; border-radius:10px; transition:transform .12s ease, background .12s ease;
      user-select:none;
    }
    .star svg{ width:40px; height:40px; display:block; }
    .star .fill{ fill:var(--star-empty); transition:fill .12s ease, filter .12s ease; }
    .star .stroke{ stroke:var(--star-empty); }
    .star.filled .fill{ fill:var(--star-fill); filter:drop-shadow(0 3px 10px rgba(246,199,68,.35)); }
    .star:focus-within, .star:focus{ outline:2px solid var(--primary-weak); outline-offset:2px; }
    .star:hover{ transform:scale(1.05); background:rgba(0,0,0,.02); }

    /* 表單細節 */
    .field-label{ font-weight:800; }
    .textarea{
      width:100%; border:1px solid var(--border); background:#fff; border-radius:16px;
      padding:14px 16px; font-size:15px; line-height:1.8; outline:none;
    }
    .textarea:focus{ box-shadow:0 0 0 3px rgba(101,153,99,.25); }
  </style>
</head>
<body class="min-h-screen px-4 py-6 md:px-6 md:py-8">
  <div class="mx-auto max-w-[960px]">
    <div class="card rounded-3xl p-8 md:p-12 min-h-[78vh] md:min-h-[86vh]">
      <!-- Header -->
      <header class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div class="flex items-center gap-4">
          <img src="MakeWell.jpg" alt="MakeWell Logo" class="w-14 h-14 md:w-16 md:h-16 object-contain rounded-xl border border-[var(--border)] bg-white">
          <div>
            <h1 class="text-3xl md:text-4xl font-extrabold leading-tight">📝 回饋專區</h1>
            <p class="text-sm md:text-base mt-1" style="color:var(--muted)">分享你的感受，讓服務更貼近需求。</p>
          </div>
        </div>
        <a href="home.html" class="self-start md:self-auto text-sm md:text-base font-bold underline" style="color:var(--primary)">← 回首頁</a>
      </header>

      <div class="mt-8 h-divider"></div>

      <!-- Form -->
      <main class="mt-8 md:mt-10">
        <form id="feedbackForm" class="space-y-8 max-w-3xl">
          <!-- 評分：左→右 -->
          <div class="flex flex-col gap-3 md:flex-row md:items-center md:gap-6">
            <label class="field-label text-lg md:text-xl shrink-0">評分</label>
            <div id="ratingGroup" class="rating-row" role="radiogroup" aria-label="星等評分（1 到 5）">
              <!-- value 1 ~ 5，左到右 -->
              <input class="sradio" type="radio" id="rate1" name="rating" value="1">
              <label class="star" for="rate1" data-value="1" aria-label="1 星">
                <!-- SVG star -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path class="fill" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.62L12 2 9.19 8.62 2 9.24l5.46 4.73L5.82 21z"/>
                  <path class="stroke" d="M12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.7 4.03 4.38.38-3.32 2.88 1 4.28z" fill="none" stroke-width="0.6"/>
                </svg>
              </label>

              <input class="sradio" type="radio" id="rate2" name="rating" value="2">
              <label class="star" for="rate2" data-value="2" aria-label="2 星">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path class="fill" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.62L12 2 9.19 8.62 2 9.24l5.46 4.73L5.82 21z"/>
                  <path class="stroke" d="M12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.7 4.03 4.38.38-3.32 2.88 1 4.28z" fill="none" stroke-width="0.6"/>
                </svg>
              </label>

              <input class="sradio" type="radio" id="rate3" name="rating" value="3" required>
              <label class="star" for="rate3" data-value="3" aria-label="3 星">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path class="fill" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.62L12 2 9.19 8.62 2 9.24l5.46 4.73L5.82 21z"/>
                  <path class="stroke" d="M12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.7 4.03 4.38.38-3.32 2.88 1 4.28z" fill="none" stroke-width="0.6"/>
                </svg>
              </label>

              <input class="sradio" type="radio" id="rate4" name="rating" value="4">
              <label class="star" for="rate4" data-value="4" aria-label="4 星">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path class="fill" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.62L12 2 9.19 8.62 2 9.24l5.46 4.73L5.82 21z"/>
                  <path class="stroke" d="M12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.7 4.03 4.38.38-3.32 2.88 1 4.28z" fill="none" stroke-width="0.6"/>
                </svg>
              </label>

              <input class="sradio" type="radio" id="rate5" name="rating" value="5">
              <label class="star" for="rate5" data-value="5" aria-label="5 星">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path class="fill" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.62L12 2 9.19 8.62 2 9.24l5.46 4.73L5.82 21z"/>
                  <path class="stroke" d="M12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.7 4.03 4.38.38-3.32 2.88 1 4.28z" fill="none" stroke-width="0.6"/>
                </svg>
              </label>
            </div>
          </div>

          <!-- 評論 -->
          <div>
            <label for="comment" class="field-label text-lg md:text-xl mb-3 block">您的評論</label>
            <div class="relative">
              <textarea id="comment" maxlength="300" rows="5" required
                class="textarea"
                placeholder="可描述志工服務、溝通態度、準時性、整體感受…"></textarea>
              <div class="absolute bottom-3 right-4 text-xs" style="color:var(--muted)">
                <span id="counter">0</span>/300
              </div>
            </div>
          </div>

          <!-- 提交 -->
         <!-- 提交 -->
          <div class="pt-2 text-center">
            <button id="submitBtn" type="submit"
              class="btn-primary inline-flex items-center justify-center px-8">提交回饋</button>
            <div id="result" class="mt-4 text-green-700 font-semibold hidden text-center">
              ✅ 感謝你的回饋！
            </div>
          </div>
        </form>
      </main>
    </div>
  </div>

  <!-- Firebase & 互動邏輯 -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, collection, addDoc, Timestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { firebaseConfig } from './firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const form = document.getElementById('feedbackForm');
    const resultMsg = document.getElementById('result');
    const counter = document.getElementById('counter');
    const submitBtn = document.getElementById('submitBtn');
    const commentEl = /** @type {HTMLTextAreaElement} */(document.getElementById('comment'));

    // 左→右星星互動
    const group = document.getElementById('ratingGroup');
    const stars = Array.from(group.querySelectorAll('.star'));
    const radios = stars.map(s => document.getElementById('rate' + s.dataset.value));

    function highlight(val){
      stars.forEach(s => {
        const v = Number(s.dataset.value||0);
        s.classList.toggle('filled', v <= val);
      });
    }
    function currentValue(){
      const checked = radios.find(r => r && r.checked);
      return checked ? Number(checked.value) : 0;
    }

    // 滑過即時高亮、離開回到目前選取
    stars.forEach(s => {
      s.addEventListener('mouseenter', () => highlight(Number(s.dataset.value||0)));
    });
    group.addEventListener('mouseleave', () => highlight(currentValue()));

    // 點擊選取
    stars.forEach(s => {
      s.addEventListener('click', () => {
        const v = Number(s.dataset.value||0);
        const r = document.getElementById('rate'+v);
        if (r) r.checked = true;
        highlight(v);
      });
    });

    // 鍵盤左右鍵
    group.addEventListener('keydown', (e) => {
      const key = e.key;
      if (key !== 'ArrowRight' && key !== 'ArrowLeft') return;
      e.preventDefault();
      let v = currentValue() || 0;
      if (key === 'ArrowRight') v = Math.min(5, v + 1);
      if (key === 'ArrowLeft')  v = Math.max(1, v - 1);
      const r = document.getElementById('rate'+v);
      if (r){ r.checked = true; highlight(v); }
    });

    // 初始高亮
    highlight(currentValue());

    // 文字計數
    const syncCounter = () => { counter.textContent = String(commentEl.value.length); };
    commentEl.addEventListener('input', syncCounter); syncCounter();

    // 送出
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (submitBtn.hasAttribute('disabled')) return;

      const rating = currentValue();
      const comment = commentEl.value.trim();
      if (rating === 0 || comment.length === 0) return;

      submitBtn.setAttribute('disabled','true');
      const origText = submitBtn.textContent;
      submitBtn.textContent = '提交中…';

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          alert('⚠️ 請先登入後再提供回饋！');
          window.location.href = 'login.html';
          return;
        }
        try{
          await addDoc(collection(db, 'feedbacks'), {
            userId: user.uid, rating, comment, createdAt: Timestamp.now()
          });
          resultMsg.classList.remove('hidden');
          form.reset();
          highlight(0);
          syncCounter();
        }catch(err){
          console.error('回饋提交失敗', err);
          alert('❌ 提交失敗，請稍後再試。');
        }finally{
          submitBtn.removeAttribute('disabled');
          submitBtn.textContent = origText;
        }
      });
    });
  </script>
</body>
</html>
