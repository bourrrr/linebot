<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>回饋專區 - MakeWell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --bg:#efede9; --bg-2:#dad7cd;
      --text:#363636; --muted:#6e746e;
      --primary:#588157; --primary-weak:#659963de;
      --surface:#ffffff; --border:#e7e5dc;
      --star-empty:#d7d7d7; --star-fill:#f6c744;
    }
    body{
      background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
      color:var(--text);
      font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;
    }
    .card{
      background:var(--surface);
      border:1px solid var(--border);
      box-shadow:0 10px 25px rgba(0,0,0,.06);
    }
    .btn-block{
      border-radius:1rem;
      padding:0.6rem 0.5rem;
      font-weight:700;
      letter-spacing:.02em;
      transition:.15s transform,.15s filter;
      box-shadow:0 4px 10px rgba(0,0,0,.05);
    }
    .btn-block:hover{ transform:translateY(-1px); filter:brightness(1.05); }
    .btn-primary{ background:var(--primary); color:#fff; }
    .btn-primary:hover{ background:var(--primary-weak); }
    .btn-secondary{
      background:transparent;
      color:var(--primary);
      border:2px solid var(--primary);
    }
    .btn-secondary:hover{
      background:var(--primary-weak);
      color:#fff;
      border-color:var(--primary-weak);
    }

    /* 星星樣式 */
    .rating-row{ display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; }
    .sradio{ position:absolute; opacity:0; width:1px; height:1px; overflow:hidden; }
    .star{
      display:inline-flex; align-items:center; justify-content:center;
      width:46px; height:46px; cursor:pointer; border-radius:10px;
      transition:transform .12s ease, background .12s ease;
      user-select:none;
    }
    .star svg{ width:40px; height:40px; display:block; }
    .star .fill{ fill:var(--star-empty); transition:fill .12s ease, filter .12s ease; }
    .star.filled .fill{ fill:var(--star-fill); filter:drop-shadow(0 3px 10px rgba(246,199,68,.35)); }
    .star:hover{ transform:scale(1.05); background:rgba(0,0,0,.02); }

    .textarea{
      width:100%; border:1px solid var(--border); background:#fff;
      border-radius:16px; padding:14px 16px; font-size:15px; line-height:1.8;
      outline:none;
    }
    .textarea:focus{ box-shadow:0 0 0 4px rgba(101,153,99,.18); }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
  <div class="relative w-full max-w-[900px] card rounded-3xl overflow-hidden">
    <div class="p-6 sm:p-10">
      <div class="w-full max-w-[800px] mx-auto">
        <h2 class="text-3xl sm:text-4xl font-medium mb-3  tracking-tight">📝 回饋專區</h2>
        <p class=" text-sm sm:text-base mb-6" style="color:var(--muted)">
          分享你的感受，讓服務更貼近需求。
        </p>

        <form id="feedbackForm" class="space-y-8 max-w-3xl mx-auto">
          <!-- 評分 -->
          <div>
            <label class="block text-lg md:text-xl mb-3">評分</label>
            <div id="ratingGroup" class="rating-row" role="radiogroup" aria-label="星等評分（1 到 5）">
              <!-- 五顆星 -->
              <input class="sradio" type="radio" id="rate1" name="rating" value="1">
              <label class="star" for="rate1" data-value="1">
                <svg viewBox="0 0 24 24"><path class="fill" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.62L12 2 9.19 8.62 2 9.24l5.46 4.73L5.82 21z"/></svg>
              </label>

              <input class="sradio" type="radio" id="rate2" name="rating" value="2">
              <label class="star" for="rate2" data-value="2">
                <svg viewBox="0 0 24 24"><path class="fill" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.62L12 2 9.19 8.62 2 9.24l5.46 4.73L5.82 21z"/></svg>
              </label>

              <input class="sradio" type="radio" id="rate3" name="rating" value="3">
              <label class="star" for="rate3" data-value="3">
                <svg viewBox="0 0 24 24"><path class="fill" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.62L12 2 9.19 8.62 2 9.24l5.46 4.73L5.82 21z"/></svg>
              </label>

              <input class="sradio" type="radio" id="rate4" name="rating" value="4">
              <label class="star" for="rate4" data-value="4">
                <svg viewBox="0 0 24 24"><path class="fill" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.62L12 2 9.19 8.62 2 9.24l5.46 4.73L5.82 21z"/></svg>
              </label>

              <input class="sradio" type="radio" id="rate5" name="rating" value="5">
              <label class="star" for="rate5" data-value="5">
                <svg viewBox="0 0 24 24"><path class="fill" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.62L12 2 9.19 8.62 2 9.24l5.46 4.73L5.82 21z"/></svg>
              </label>
            </div>
          </div>

          <!-- 評論 -->
          <div>
            <label for="comment" class="block text-lg md:text-xl mb-3">您的評論</label>
            <div class="relative">
              <textarea id="comment" maxlength="300" rows="5" required
                class="textarea"
                placeholder="可描述志工服務、溝通態度、準時性、整體感受…"></textarea>
              <div class="absolute bottom-3 right-4 text-xs" style="color:var(--muted)">
                <span id="counter">0</span>/300
              </div>
            </div>
          </div>

          <!-- 提交 + 回首頁 -->
          <div class="flex space-x-4 pt-2 text-center">
            <a href="home.html" class="btn-block btn-secondary w-1/2 text-center">回首頁</a>
            <button id="submitBtn" type="submit" class="btn-block btn-primary w-1/2">提交回饋</button>
          </div>

          <div id="result" class="mt-4 text-green-700 font-semibold hidden text-center">
            ✅ 感謝你的回饋！
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, collection, addDoc, Timestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { firebaseConfig } from './firebase-config.js';
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const LIFF_ID = "2007877199-Y5R2LenL";

    const form = document.getElementById('feedbackForm');
    const resultMsg = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');
    const group = document.getElementById('ratingGroup');
    const stars = Array.from(group.querySelectorAll('.star'));
    const commentEl = document.getElementById('comment');
    const counter = document.getElementById('counter');

    function highlight(val){ stars.forEach(s => s.classList.toggle('filled', Number(s.dataset.value||0) <= val)); }
    function currentValue(){ const r = group.querySelector('input:checked'); return r ? Number(r.value) : 0; }
    stars.forEach(s => {
      s.addEventListener('mouseenter', ()=>highlight(Number(s.dataset.value||0)));
      s.addEventListener('click', ()=>{ const v = Number(s.dataset.value||0); document.getElementById('rate'+v).checked=true; highlight(v); });
    });
    group.addEventListener('mouseleave', ()=>highlight(currentValue()));
    commentEl.addEventListener('input', ()=>counter.textContent = commentEl.value.length);

    async function ensureLIFF(){
      try{ await liff.init({ liffId: LIFF_ID }); return true; }
      catch(e){ console.error(e); alert('LIFF 初始化失敗'); return false; }
    }

    form.addEventListener('submit', async e=>{
      e.preventDefault();
      if (submitBtn.disabled) return;
      const rating = currentValue();
      const comment = commentEl.value.trim();
      if (!rating || !comment) return;

      submitBtn.disabled = true;
      const orig = submitBtn.textContent;
      submitBtn.textContent = '提交中…';

      try{
        if (!(await ensureLIFF()) || !liff.isLoggedIn()) { location.href='login.html'; return; }
        const p = await liff.getProfile();
        const uid = `line:${p.userId}`;
        await addDoc(collection(db, 'feedbacks'), { userId: uid, rating, comment, createdAt: Timestamp.now() });

        resultMsg.classList.remove('hidden');
        form.reset();
        highlight(0);
        counter.textContent = '0';
      }catch(err){
        console.error('回饋提交失敗', err);
        alert('❌ 提交失敗，請稍後再試。');
      }finally{
        submitBtn.disabled = false;
        submitBtn.textContent = orig;
      }
    });
  </script>
</body>
</html>
