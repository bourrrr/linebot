<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>任務待接區 - MakeWell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --bg:#efede9; --bg-2:#dad7cd;
      --text:#363636; --muted:#6e746e;
      --primary:#588157; --primary-weak:#659963de;
      --surface:#ffffff; --chip:#f4f3ef; --border:#e7e5dc;
    }
    body{ background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%); color:var(--text); }
    .card{ background:var(--surface); border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,.06); }
    .h-divider{ height:1px; width:100%; background:linear-gradient(to right, transparent, var(--border), transparent); }
    .btn-ghost{
      border:1px solid var(--border); background:#fff; border-radius:9999px;
      padding:.6rem .9rem; font-weight:800; transition:.15s transform,.15s filter;
    }
    .btn-ghost:hover{ transform:translateY(-1px); filter:brightness(.98); }
    .filter{ background:var(--chip); border:1px solid var(--border); }
    .select, .input{
      width:100%; border:1px solid var(--border); background:#fff; border-radius:12px;
      padding:.55rem .7rem; font-size:15px; outline:none;
    }
    .select:focus, .input:focus{ box-shadow:0 0 0 3px rgba(101,153,99,.25); }

    .chip {
      display:inline-flex; align-items:center; justify-content:center;
      padding:.44rem .8rem; border-radius:9999px;
      border:1px solid var(--border); background:#fff; cursor:pointer;
      font-weight:700; user-select:none; transition:.15s transform,.15s background,.15s border-color;
      white-space:nowrap; line-height:1; min-height:2.25rem;
    }
    .chip[aria-pressed="true"]{
      background:var(--primary-weak); border-color:var(--primary);
    }
    .chip:disabled{ opacity:.5; cursor:not-allowed; }
    .chips-wrap{ display:flex; flex-wrap:wrap; gap:.5rem; }
  </style>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from './firebase-config.js';

    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    const LIFF_ID = "2007877199-Y5R2LenL";
    const CUSTOM_TOKEN_URL = "https://asia-east1-medwell-test1.cloudfunctions.net/authApi/getFirebaseCustomToken";

    async function ensureLIFF() {
      try { await liff.init({ liffId: LIFF_ID }); return true; }
      catch (e) { console.error("[TASK-LIST] LIFF init failed:", e); return false; }
    }

    (async () => {
      try {
        const ok = await ensureLIFF();
        if (!ok) { alert("LIFF 初始化失敗，請稍後再試"); throw new Error("liff-init-fail"); }

        if (!liff.isLoggedIn()) {
          if (!sessionStorage.getItem("MW_LOGIN_ATTEMPTED")) {
            sessionStorage.setItem("MW_LOGIN_ATTEMPTED", "1");
            liff.login({ redirectUri: location.href });
          }
          throw new Error("redirect-login-once");
        }

        const idToken = liff.getIDToken();
        if (!idToken) { alert("取得 LINE idToken 失敗"); throw new Error("no-idtoken"); }

        const resp = await fetch(CUSTOM_TOKEN_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idToken })
        });
        if (!resp.ok) throw new Error("custom-token-http");
        const { customToken } = await resp.json();
        await signInWithCustomToken(auth, customToken);

        const uid = auth.currentUser?.uid;
        const snap = await getDoc(doc(db, "users", uid));
        if (!snap.exists()) { location.href = "register-profile.html"; return; }

        const rolesArr = Array.isArray(snap.data()?.roles) ? snap.data().roles : [];
        const roles = rolesArr.map(r => String(r).trim().toLowerCase());
        if (!(roles.includes("志工") || roles.includes("volunteer"))) location.href = "home.html";

        sessionStorage.removeItem("MW_LOGIN_ATTEMPTED");

        // ✅ 登入完成後再載入任務清單邏輯
        import("./task-list.js");
      } catch (e) {
        console.error("[TASK-LIST] fatal:", e);
      }
    })();
  </script>
</head>

<body class="min-h-screen p-4 flex items-center justify-center">
  <div class="w-full max-w-[1120px] card rounded-3xl overflow-hidden h-[90vh] md:h-[94vh] flex flex-col">

    <!-- Header -->
    <div class="p-6 md:p-8 border-b border-[var(--border)] flex-shrink-0">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">📋 任務待接區</h1>
        <a href="volunteer.html" class="text-xs md:text-sm px-3 py-2 border rounded-full font-semibold" style="color:#363636; border-color:#e7e5dc;"> 回首頁</a>
      </div>
    </div>

    <div class="h-divider flex-shrink-0"></div>

    <!-- 篩選列 -->
    <section class="filter rounded-none border-b border-[var(--border)] p-3 md:p-5 flex-shrink-0">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 md:gap-4 md:items-start">
        <div>
          <label for="citySelect" class="block text-sm font-bold mb-1">縣市</label>
          <select id="citySelect" class="select">
            <option value="">全部縣市</option>
          </select>
        </div>
        <div class="md:col-span-2">
          <div class="flex items-center justify-between mb-1">
            <span class="text-sm font-bold">行政區</span>
            <button id="toggleAllDistricts" class="btn-ghost text-xs md:text-sm">全選/全不選</button>
          </div>
          <div id="districtChips" class="chips-wrap" aria-label="行政區複選" role="group"></div>
          <p id="districtHint" class="text-xs mt-1" style="color:var(--muted)">先選縣市後即可選擇行政區；可多選。</p>
        </div>
        <div class="md:col-span-3 flex md:justify-end">
          <button id="resetFilters" class="btn-ghost w-full md:w-auto">取消</button>
        </div>
      </div>
    </section>

    <!-- 任務清單 -->
    <main class="flex-1 overflow-y-auto overscroll-contain">
      <div class="p-6 md:p-8">
        <div id="taskContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6"></div>
        <p id="emptyState" class="text-center text-sm md:text-base mt-8 hidden" style="color:var(--muted)">
          目前沒有符合條件的任務。
        </p>
      </div>
    </main>

    <!-- ✅ 任務卡片模板 -->
    <template id="taskCardTemplate">
      <div class="p-5 card rounded-2xl flex flex-col gap-3">
        <div class="text-4xl icon">🤝</div>
        <div class="font-bold text-lg task-type"></div>
        <div class="text-sm text-gray-500 task-time"></div>
        <div class="text-sm task-addr"></div>
        <p class="text-sm text-gray-700 task-note"></p>
        <div class="flex gap-2 mt-2">
          <button class="accept flex-1 py-2 rounded-full bg-[var(--primary)] text-white font-bold">✅ 接受</button>
          <button class="reject flex-1 py-2 rounded-full border border-[var(--primary)] text-[var(--primary)] font-bold">❌ 拒絕</button>
        </div>
      </div>
    </template>

    <!-- ✅ 配對成功彈窗 -->
    <div id="matchModal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
      <div class="bg-white rounded-2xl shadow-xl max-w-md w-[90%] p-6 text-center">
        <h2 class="text-xl font-bold mb-3 text-[var(--primary)]">✅ 任務配對成功</h2>
        <p class="text-sm text-gray-700 mb-5">請點擊以下網址加入配對聊天室即可聯絡你的患者：</p>
        <a id="matchChatLink"
           href="https://line.me/R/oaMessage/@676npmsr/?text=%E6%82%A8%E5%A5%BD%EF%BC%8C%E6%88%91%E8%A6%81%E8%81%AF%E7%B5%A1%E5%BF%97%E5%B7%A5%E6%9C%8D%E5%8B%99555"
           target="_blank"
           class="block w-full py-2 rounded-full bg-[var(--primary)] text-white font-bold mb-3">
          開啟聊天室
        </a>
        <button id="closeModal"
                class="w-full py-2 rounded-full border border-[var(--primary)] text-[var(--primary)] font-bold">
          關閉
        </button>
      </div>
    </div>
  </div>
</body>
</html>
