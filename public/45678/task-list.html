<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>任務待接區 - MakeWell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --bg:#efede9; --bg-2:#dad7cd;
      --text:#363636; --muted:#6e746e;
      --primary:#588157; --primary-weak:#659963de;
      --surface:#ffffff; --chip:#f4f3ef; --border:#e7e5dc;
    }
    body{ background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%); color:var(--text); }
    .card{ background:var(--surface); border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,.06); }
    .h-divider{ height:1px; width:100%; background:linear-gradient(to right, transparent, var(--border), transparent); }
    .btn-ghost{
      border:1px solid var(--border); background:#fff; border-radius:9999px;
      padding:.6rem .9rem; font-weight:800; transition:.15s transform,.15s filter;
    }
    .btn-ghost:hover{ transform:translateY(-1px); filter:brightness(.98); }
    .filter{ background:var(--chip); border:1px solid var(--border); }
    .select, .input{
      width:100%; border:1px solid var(--border); background:#fff; border-radius:12px;
      padding:.55rem .7rem; font-size:15px; outline:none;
    }
    .select:focus, .input:focus{ box-shadow:0 0 0 3px rgba(101,153,99,.25); }

    /* Chips */
    .chip {
      display:inline-flex; align-items:center; justify-content:center;
      padding:.44rem .8rem; border-radius:9999px;
      border:1px solid var(--border); background:#fff; cursor:pointer;
      font-weight:700; user-select:none; transition:.15s transform,.15s background,.15s border-color;
      white-space:nowrap; line-height:1; min-height:2.25rem;
    }
    .chip[aria-pressed="true"]{
      background:var(--primary-weak); border-color:var(--primary);
    }
    .chip:disabled{ opacity:.5; cursor:not-allowed; }
    .chips-wrap{ display:flex; flex-wrap:wrap; gap:.5rem; }
  </style>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Firebase Auth 守門（未登入導回 login） -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { firebaseConfig } from './firebase-config.js';

  const app  = initializeApp(firebaseConfig);
  const db   = getFirestore(app);
  const auth = getAuth(app);

  const LIFF_ID = "2007877199-Y5R2LenL";
  const CUSTOM_TOKEN_URL = "https://asia-east1-medwell-test1.cloudfunctions.net/authApi/getFirebaseCustomToken";

  async function ensureLIFF() {
    try { await liff.init({ liffId: LIFF_ID }); return true; }
    catch (e) { console.error("[TASK-LIST] LIFF init failed:", e); return false; }
  }

  (async () => {
    try {
      // 0) LIFF 初始化
      const ok = await ensureLIFF();
      if (!ok) { alert("LIFF 初始化失敗，請稍後再試"); throw new Error("liff-init-fail"); }

      // 1) 僅在「未登入」時觸發 login，並用旗標防止無限來回
      if (!liff.isLoggedIn()) {
        if (!sessionStorage.getItem("MW_LOGIN_ATTEMPTED")) {
          sessionStorage.setItem("MW_LOGIN_ATTEMPTED", "1");
          liff.login({ redirectUri: location.href });
        }
        throw new Error("redirect-login-once");
      }

      // 2) 取得 idToken；若失敗就停止（不要再 login 以免迴圈）
      const idToken = liff.getIDToken();
      if (!idToken) {
        alert("取得 LINE idToken 失敗，請關閉分頁重開或先登出再登入。");
        throw new Error("no-idtoken");
      }

      // 3) 向後端交換 Firebase Custom Token（務必檢查 resp.ok）
      const resp = await fetch(CUSTOM_TOKEN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idToken })
      });
      if (!resp.ok) {
        console.error("[TASK-LIST] CustomToken HTTP", resp.status, await resp.text().catch(()=> ""));
        alert("登入驗證失敗（HTTP " + resp.status + "），請登出後再登入。");
        throw new Error("custom-token-http-" + resp.status);
      }
      const { customToken } = await resp.json();
      if (!customToken) { alert("登入驗證失敗（no customToken）"); throw new Error("no-custom-token"); }

      // 4) 登入 Firebase，並用「實際登入的 UID」查使用者文件
      await signInWithCustomToken(auth, customToken);
      const uid = auth.currentUser?.uid;
      if (!uid) { alert("登入失敗（no auth uid）"); throw new Error("no-auth-uid"); }

      const snap = await getDoc(doc(db, "users", uid));
      if (!snap.exists()) { location.href = "register-profile.html"; return; }

      // 5) 角色判斷（僅志工可進）
      const raw = snap.data()?.roles;
      const rolesArr = Array.isArray(raw) ? raw : [];
      const roles = rolesArr.map(r => String(r).trim().toLowerCase());
      const isVolunteer = roles.includes("志工") || roles.includes("volunteer");
      if (!isVolunteer) { location.href = "home.html"; return; }

      // 6) 一切就緒，清旗標，交給 task-list.js 做畫面邏輯
      sessionStorage.removeItem("MW_LOGIN_ATTEMPTED");
      // （無需在這裡再做事，清單渲染與事件在 task-list.js）
    } catch (e) {
      console.error("[TASK-LIST] fatal:", e);
      // 這裡不要再次強制 liff.login()，避免無限跳轉
    }
  })();
</script>


</head>

<body class="min-h-[100dvh]">
  <div class="px-4 py-4 md:px-6 md:py-8 min-h-[100dvh]">
    <div class="mx-auto max-w-[1120px] min-h-[100dvh]">
      <div class="card rounded-3xl p-8 md:p-12 min-h-[100dvh] flex flex-col overflow-hidden">
        <!-- Header（固定不動） -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 shrink-0">
          <div class="flex items-center gap-5">
            <div>
              <h1 class="text-3xl md:text-4xl font-extrabold leading-tight">📋 任務待接區</h1>
              <p class="text-base md:text-lg" style="color:var(--muted)">依地區篩選可協助的「領藥／陪診」請求，挑選合適任務。</p>
            </div>
          </div>
          <div class="mt-3 md:mt-0 md:ml-auto">
            <a href="volunteer.html" class="text-sm md:text-base font-bold underline" style="color:var(--primary)">← 回首頁</a>
          </div>
        </div>

        <div class="mt-6 md:mt-8 h-divider shrink-0"></div>

        <!-- 篩選列（固定不動） -->
        <section class="mt-6 filter rounded-2xl p-4 md:p-5 shrink-0">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:items-start">
            <div>
              <label for="citySelect" class="block text-sm font-bold mb-1">縣市</label>
              <select id="citySelect" class="select">
                <option value="">全部縣市</option>
              </select>
            </div>
            <div class="md:col-span-2">
              <div class="flex items-center justify-between mb-1">
                <span class="text-sm font-bold">行政區</span>
                <button id="toggleAllDistricts" class="btn-ghost text-xs md:text-sm">全選/全不選</button>
              </div>
              <div id="districtChips" class="chips-wrap" aria-label="行政區複選" role="group"></div>
              <p id="districtHint" class="text-xs mt-2" style="color:var(--muted)">先選縣市後即可選擇行政區；可多選。</p>
            </div>
            <div class="md:col-span-3 flex md:justify-end">
              <button id="resetFilters" class="btn-ghost w-full md:w-auto">取消</button>
            </div>
          </div>
        </section>

        <!-- 清單（僅此區塊滾動） -->
        <main class="mt-6 md:mt-8 flex-1 overflow-y-auto overscroll-contain pr-1" style="-webkit-overflow-scrolling:touch;">
          <div id="taskContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6"></div>
          <p id="emptyState" class="text-center text-sm md:text-base mt-8 hidden" style="color:var(--muted)">目前沒有符合條件的任務。</p>

          <template id="taskCardTemplate">
            <div class="task-card card rounded-2xl p-6 border shadow">
              <div class="flex items-start gap-3">
                <div class="icon text-3xl">🤝</div>
                <div class="flex-1">
                  <div class="flex items-center justify-between">
                    <h3 class="task-type font-extrabold text-lg"></h3>
                    <span class="task-time text-sm text-slate-500"></span>
                  </div>
                  <p class="task-addr text-sm mt-1"></p>
                  <p class="task-note text-sm mt-2"></p>
                  <div class="mt-4 flex gap-3">
                    <button class="accept flex-1 px-4 py-2 rounded-full bg-[var(--primary)] text-white font-bold">接受</button>
                    <button class="reject flex-1 px-4 py-2 rounded-full border font-bold">拒絕</button>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </main>
      </div>
    </div>
  </div>

  <!-- ✅ 任務配對成功彈窗（新增） -->
  <div id="matchModal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-[90%] p-6 text-center">
      <h2 class="text-xl font-bold mb-3 text-[var(--primary)]">✅ 任務配對成功</h2>
      <p class="text-sm text-gray-700 mb-5">
        請點擊以下網址加入配對聊天室即可聯絡你的患者：
      </p>
      <a
        id="matchChatLink"
        href="https://line.me/R/oaMessage/@676npmsr/?text=%E6%82%A8%E5%A5%BD%EF%BC%8C%E6%88%91%E8%A6%81%E8%81%AF%E7%B5%A1%E5%BF%97%E5%B7%A5%E6%9C%8D%E5%8B%99555"
        target="_blank"
        class="block w-full py-2 rounded-full bg-[var(--primary)] text-white font-bold mb-3"
      >
        開啟聊天室
      </a>
      <button id="closeModal"
              class="w-full py-2 rounded-full border border-[var(--primary)] text-[var(--primary)] font-bold">
        關閉
      </button>
    </div>
  </div>

  <script type="module" src="task-list.js"></script>
</body>
</html>
