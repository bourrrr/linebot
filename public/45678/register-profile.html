<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>註冊 - 填寫基本資料</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- ✅ 先載入 LIFF SDK，避免 JS 找不到 window.liff -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- Firebase SDK（使用你專案的版本/設定即可） -->
  <script type="module">
    // 這段不做事，只是確保瀏覽器先預連線 CDN，主程式在 register-profile.js 載
    /* noop */
  </script>
</head>
<body class="bg-gray-50">
  <main class="max-w-xl mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">註冊 - 填寫基本資料</h1>

    <!-- 登入警示 -->
    <div id="authWarn" class="mb-4 hidden text-red-600">
      需要先用 LINE 登入才能完成註冊，請從官方帳號選單進入。
    </div>

    <!-- 角色切換 -->
    <div class="mb-4 flex gap-2">
      <button id="patientBtn" type="button" class="tab-btn active">患者</button>
      <button id="volunteerBtn" type="button" class="tab-btn">志工</button>
      <input id="role" type="hidden" value="患者" />
    </div>

    <!-- 共用欄位 -->
    <section class="card mb-6">
      <div class="field">
        <label for="name">姓名</label>
        <input id="name" type="text" placeholder="姓名" />
      </div>
      <div class="field">
        <label for="phone">聯絡電話</label>
        <input id="phone" type="tel" placeholder="09xx-xxx-xxx" />
      </div>
      <div class="field">
        <label for="emergencyName">緊急聯絡人</label>
        <input id="emergencyName" type="text" placeholder="家屬 / 朋友" />
      </div>
      <div class="field">
        <label for="emergencyPhone">緊急聯絡人電話</label>
        <input id="emergencyPhone" type="tel" placeholder="市話或手機" />
      </div>
    </section>

    <!-- 患者欄位 -->
    <section id="patientFields" class="card mb-6">
      <h2 class="card-title">患者資料</h2>

      <div class="field">
        <label for="city">縣市</label>
        <select id="city">
          <option value="">請選擇縣市</option>
        </select>
      </div>
      <div class="field">
        <label for="district">行政區</label>
        <select id="district" disabled>
          <option value="">請選擇行政區</option>
        </select>
      </div>
      <div class="field">
        <label for="road">道路/地址</label>
        <input id="road" type="text" placeholder="xx路xx巷xx號" />
      </div>
      <div class="field">
        <label for="disability">身心障礙別（若有）</label>
        <input id="disability" type="text" placeholder="選填" />
      </div>

      <div class="field">
        <div class="label">慢性病史（可複選）</div>
        <div class="grid grid-cols-2 gap-2">
          <label><input type="checkbox" name="chronic" value="高血壓"> 高血壓</label>
          <label><input type="checkbox" name="chronic" value="糖尿病"> 糖尿病</label>
          <label><input type="checkbox" name="chronic" value="高血脂"> 高血脂</label>
          <label><input type="checkbox" name="chronic" value="腎臟病"> 腎臟病</label>
        </div>
      </div>
      <div class="field">
        <label for="chronicOther">其他慢性病（選填）</label>
        <input id="chronicOther" type="text" placeholder="自由填寫" />
      </div>
    </section>

    <!-- 志工欄位 -->
    <section id="volunteerFields" class="card mb-6 hidden">
      <h2 class="card-title">志工資料</h2>

      <div class="field">
        <label for="idCard">身分證字號</label>
        <input id="idCard" type="text" placeholder="A123456789" />
      </div>

      <div class="field">
        <label>是否有志工專業執照</label>
        <select id="hasCert">
          <option value="無">無</option>
          <option value="有">有</option>
        </select>
      </div>

      <div class="field">
        <label for="police">良民證編號</label>
        <input id="police" type="text" placeholder="W123456789" />
      </div>

      <div class="field">
        <label>上傳良民證照片（必填）</label>
        <input id="policeFile" type="file" accept="image/*" />
      </div>

      <div class="field">
        <label>上傳駕照照片（必填）</label>
        <input id="licenseFile" type="file" accept="image/*" />
      </div>

      <div class="field">
        <label>上傳志工證明（若有）</label>
        <input id="certFile" type="file" accept="image/*,application/pdf" />
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div class="field">
          <label for="volCity">服務縣市</label>
          <select id="volCity">
            <option value="">請選擇縣市</option>
          </select>
        </div>
        <div class="field">
          <label for="volDistrict">服務行政區</label>
          <select id="volDistrict" disabled>
            <option value="">請選擇行政區</option>
          </select>
        </div>
      </div>
    </section>

    <!-- ✅ 按鈕加上 type="button"，避免預設 submit 造成整頁重整 -->
    <button id="saveBtn" type="button" class="btn-primary w-full">儲存並完成註冊</button>

    <p class="text-sm text-gray-500 mt-4">
      完成後請回登入頁繼續（志工會自動導向志工首頁；患者導向患者首頁）。
    </p>
  </main>

  <!-- 你的主程式（模組） -->
  <script type="module" src="./register-profile.js"></script>
</body>
</html>
