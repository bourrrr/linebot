<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>個人資訊（患者） - MakeWell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --bg:#efede9; --bg-2:#dad7cd;
      --text:#363636; --muted:#6e746e;
      --primary:#588157; --primary-weak:#659963de;
      --surface:#ffffff; --chip:#f4f3ef; --border:#e7e5dc;
    }
    body{ background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%); color:var(--text); }
    .card{ background:var(--surface); border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,.06); }
    .badge{ display:inline-flex; align-items:center; gap:.4rem; padding:.25rem .6rem; border-radius:9999px; border:1px solid var(--border); background:var(--chip); color:var(--muted); font-size:.9rem; }
    .label{ color:var(--muted); font-weight:600; }
    .input{ width:100%; background:#fff; border:1px solid var(--border); border-radius:14px; padding:.9rem 1rem; }
    .btn-primary{
      display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
      background:var(--primary); color:#fff; border:1px solid var(--primary);
      padding:.9rem 1.2rem; border-radius:9999px; font-weight:800; transition:.15s transform,.15s filter;
    }
    .btn-primary:hover{ transform:translateY(-1px); filter:brightness(.98); }
    .hint{ color:#6b6b6b; }
    .chip{ display:inline-flex; align-items:center; gap:.25rem; padding:.35rem .6rem; border-radius:9999px; background:var(--chip); border:1px solid var(--border); }

    /* 加入與 history 一致的樣式 */
    .btn-link{ color:var(--primary); font-weight:700; }
    .h-divider{ height:1px; width:100%; background:linear-gradient(to right, transparent, var(--border), transparent); }
  </style>

  <!-- LIFF SDK：一定要在 module 之前 -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="min-h-screen px-4 py-6 md:px-6 md:py-8">
  <div class="mx-auto max-w-[1120px]">
    <div class="card rounded-3xl p-8 md:p-12">
      <!-- Header：改成和 history 一樣 -->
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <!-- 左邊 Logo + 標題 -->
        <div class="flex items-center gap-5">
          <div>
            <h1 class="text-3xl md:text-4xl font-extrabold leading-tight">📝 個人資訊</h1>
            <p class="text-base md:text-lg" style="color:var(--muted)">
              更新你的聯絡方式與偏好資料（患者）
            </p>
          </div>
        </div>
        <!-- 右邊 回首頁 -->
        <div class="flex items-center gap-3 w-full sm:w-auto">
          <a href="home.html" class="btn-link underline whitespace-nowrap">← 回首頁</a>
        </div>
      </div>

      <div class="h-divider mt-6"></div>

      <div class="mt-6 flex items-center gap-3">
        <span id="roleBadge" class="badge">患者</span>
        <span id="saveHint" class="text-sm"></span>
      </div>

      <!-- 表單（只保留患者區塊） -->
      <main class="mt-8">
        <section id="patientSection" class="space-y-8">
          <div>
            <div class="flex items-center gap-3">
              <span class="text-xl font-bold">基本資料</span>
            </div>
            <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label for="name" class="label">姓名</label>
                <input id="name" class="input" placeholder="請輸入姓名"/>
              </div>
              <div>
                <label for="phone" class="label">手機號碼</label>
                <input id="phone" class="input" placeholder="09xxxxxxxx" inputmode="tel"/>
              </div>
              <div>
                <label for="emergencyName" class="label">緊急聯絡人姓名</label>
                <input id="emergencyName" class="input" placeholder="例如：王小明"/>
              </div>
              <div>
                <label for="emergencyPhone" class="label">緊急聯絡人電話</label>
                <input id="emergencyPhone" class="input" placeholder="09xxxxxxxx" inputmode="tel"/>
              </div>
            </div>
          </div>

          <div>
            <div class="flex items-center gap-3">
              <span class="text-xl font-bold">慢性病史</span>
            </div>
            <p class="hint text-sm mt-1">（可多選，自訂請輸入後按 Enter）</p>

            <div class="mt-3">
              <div id="chronicTags" class="flex flex-wrap gap-2"></div>
              <div class="mt-3 relative">
                <input id="chronicInput" class="input" placeholder="輸入慢性病（例如：高血壓、糖尿病），按 Enter 加入"/>
                <div id="chronicSuggest" class="absolute z-10 left-0 right-0 mt-1 rounded-2xl border border-[var(--border)] bg-white shadow hidden"></div>
              </div>
            </div>
          </div>

          <!-- 身心障礙程度（必填） -->
          <div>
            <div class="flex items-center gap-3">
              <span class="text-xl font-bold">身心障礙程度</span>
              <span class="hint text-sm">（必填）</span>
            </div>
            <div class="mt-4">
              <label for="disability" class="label">程度 <span class="text-red-600">*</span></label>
              <select id="disability" class="input" required>
                <option value="">請選擇</option>
                <option value="無">無</option>
                <option value="輕度">輕度</option>
                <option value="中度">中度</option>
                <option value="重度">重度</option>
              </select>
            </div>
          </div>

          <div>
            <div class="flex items-center gap-3">
              <span class="text-xl font-bold">聯絡地址</span>
            </div>
            <div class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-5">
              <div>
                <label for="city" class="label">縣市</label>
                <select id="city" class="input"></select>
              </div>
              <div>
                <label for="district" class="label">行政區</label>
                <select id="district" class="input" disabled></select>
              </div>
              <div class="md:col-span-3">
                <label for="road" class="label">詳細地址</label>
                <input id="road" class="input" placeholder="例如：中正路100號3樓"/>
              </div>
            </div>
          </div>

          <!-- 儲存按鈕：拿掉 min-h-screen，保留置中 -->
          <div class="mt-8 flex justify-center">
            <button id="saveBtn" type="button" class="btn-primary">
              💾 儲存變更
            </button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- 主程式（LIFF + Firestore） -->
  <script type="module">
    function roleKey(s){
      const m = String(s||'').trim().toLowerCase();
      if (m === '患者' || m === 'patient') return 'patient';
      if (m === '志工' || m === 'volunteer') return 'volunteer';
      return '';
    }
    function getUserRoles(data){
      const raw = (data && (data.roles ?? data.role)) ?? [];
      const arr = Array.isArray(raw) ? raw : (raw ? [raw] : []);
      const set = new Set(arr.map(roleKey).filter(Boolean));
      return { isPatient: set.has('patient'), isVolunteer: set.has('volunteer') };
    }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
	import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
	import { getAuth, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from './firebase-config.js';
    import { cityDistricts } from './district-data.js';

	const app  = initializeApp(firebaseConfig);
	const db   = getFirestore(app);
	const auth = getAuth(app);
    const LIFF_ID = "2007877199-Y5R2LenL";
	const CUSTOM_TOKEN_URL = "https://asia-east1-medwell-test1.cloudfunctions.net/authApi/getFirebaseCustomToken";

    // ----- 小工具 -----
    const el = (id) => document.getElementById(id);
    const roleBadge      = el('roleBadge');
    const saveBtn        = el('saveBtn');
    const saveHint       = el('saveHint');

    const citySel     = /** @type {HTMLSelectElement} */(el('city'));
    const districtSel = /** @type {HTMLSelectElement} */(el('district'));
    const roadInput   = /** @type {HTMLInputElement} */(el('road'));
    const disabilitySel = /** @type {HTMLSelectElement} */(el('disability'));

    // ===== 慢性病史 Tag =====
    const CHRONIC_OPTIONS = [
      '高血壓','糖尿病','高血脂','心臟病','冠狀動脈疾病','心房顫動','中風',
      '慢性腎臟病','慢性肝病/肝硬化','氣喘','慢性阻塞性肺病（COPD）','胃潰瘍/胃食道逆流',
      '甲狀腺功能低下','甲狀腺機能亢進','骨質疏鬆','癌症（請註明）'
    ];
    const chronicTagsEl = el('chronicTags');
    const chronicInputEl = /** @type {HTMLInputElement} */(el('chronicInput'));
    const chronicSuggestEl = el('chronicSuggest');
    let chronicSet = new Set();

    function normalize(s){ return String(s||'').replace(/[，、；;]/g, ',').trim(); }
    function escapeHtml(str){
      return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
                        .replaceAll('"','&quot;').replaceAll("'",'&#039;');
    }
    function renderChronicTags(){
      chronicTagsEl.innerHTML = '';
      Array.from(chronicSet).forEach(v => {
        const tag = document.createElement('span');
        tag.className = 'chip';
        tag.innerHTML = `${escapeHtml(v)} <button type="button" class="ml-1 text-slate-500 hover:text-slate-700" data-remove="${escapeHtml(v)}" aria-label="移除 ${escapeHtml(v)}">×</button>`;
        chronicTagsEl.appendChild(tag);
      });
    }
    function showSuggest(items){
      if (!items.length){ chronicSuggestEl.classList.add('hidden'); chronicSuggestEl.innerHTML=''; return; }
      chronicSuggestEl.innerHTML = items.map(it => `<button type="button" class="w-full text-left px-3 py-2 hover:bg-[#f8f8f5]">${escapeHtml(it)}</button>`).join('');
      chronicSuggestEl.classList.remove('hidden');
    }
    function addChronic(val){
      const v = normalize(val);
      if (!v || chronicSet.has(v) || chronicSet.size >= 20) return;
      chronicSet.add(v); renderChronicTags();
    }
    function removeChronic(val){ chronicSet.delete(val); renderChronicTags(); }
    function getChronicArray(){ return [...chronicSet]; }
    function setChronicArray(arr){ chronicSet = new Set((arr||[]).map(normalize).filter(Boolean)); renderChronicTags(); }

    chronicTagsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-remove]'); if (!btn) return;
      removeChronic(btn.getAttribute('data-remove'));
    });
    chronicInputEl.addEventListener('input', () => {
      const q = normalize(chronicInputEl.value).toLowerCase();
      if (!q){ showSuggest([]); return; }
      const items = CHRONIC_OPTIONS.filter(opt => opt.toLowerCase().includes(q))
                                   .filter(opt => !chronicSet.has(opt)).slice(0, 8);
      showSuggest(items);
    });
    chronicInputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ','){ e.preventDefault(); addChronic(chronicInputEl.value); chronicInputEl.value=''; showSuggest([]); }
      else if (e.key === 'Backspace' && !chronicInputEl.value){ const arr=[...chronicSet]; if (arr.length) removeChronic(arr[arr.length-1]); }
    });
    chronicSuggestEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button'); if (!btn) return;
      addChronic(btn.textContent || ''); chronicInputEl.value=''; showSuggest([]); chronicInputEl.focus();
    });
    document.addEventListener('click', (e) => { if (!chronicSuggestEl.contains(e.target) && e.target !== chronicInputEl){ showSuggest([]); } });

    // ===== 地址下拉 =====
    import { cityDistricts as _cd } from './district-data.js';
    function fillCities(){
      citySel.innerHTML = '<option value="" disabled selected>請選擇縣市</option>';
      Object.keys(_cd).forEach(c => citySel.appendChild(new Option(c, c)));
    }
    function fillDistricts(city, selected=''){
      districtSel.innerHTML = '';
      const list = _cd[city] || [];
      if (!list.length){ districtSel.innerHTML = '<option value="" disabled selected>請先選擇縣市</option>'; districtSel.disabled = true; return; }
      districtSel.disabled = false;
      districtSel.appendChild(new Option('請選擇行政區', '', true, false));
      list.forEach(d => districtSel.appendChild(new Option(d, d, false, d===selected)));
    }
    citySel.addEventListener('change', () => { fillDistricts(citySel.value); districtSel.focus(); });

    // ===== LIFF 守門（僅患者可進）=====
    let userDocRef = null;

    async function ensureLIFF(){
      try{ await liff.init({ liffId: LIFF_ID }); return true; }
      catch(e){ console.error(e); alert('LIFF 初始化失敗'); return false; }
    }

    (async () => {
      fillCities();

      if (!(await ensureLIFF()) || !liff.isLoggedIn()) { location.href = 'login.html'; return; }
     
	const idToken = liff.getIDToken();
	if (!idToken) { location.href = 'login.html'; return; }
	const resp = await fetch(CUSTOM_TOKEN_URL, {
	method: 'POST', headers: { 'Content-Type': 'application/json' },
	body: JSON.stringify({ idToken })
	});
	if (!resp.ok) { alert('驗證失敗（HTTP '+resp.status+'）'); location.href='login.html'; return; }
	const { customToken } = await resp.json();
	if (!customToken) { alert('驗證失敗（no customToken）'); location.href='login.html'; return; }
	await signInWithCustomToken(auth, customToken);
	const uid = auth.currentUser?.uid;
	if (!uid) { location.href='login.html'; return; }
	userDocRef = doc(db, 'users', uid);
	const snap = await getDoc(userDocRef);
	 

      if (!snap.exists()) { location.href = 'register-profile.html'; return; }

      const data = snap.data() || {};
      const { isPatient, isVolunteer } = getUserRoles(data);
      if (!isPatient) {
        if (isVolunteer) { location.href = "volunteer.html"; return; }
        location.href = "register-profile.html"; return;
      }

      // 帶值
      roleBadge.textContent = '患者';
      roleBadge.classList.remove('hidden');

      el('name').value           = data.name || '';
      el('phone').value          = data.phone || '';
      el('emergencyName').value  = data.emergencyName || '';
      el('emergencyPhone').value = data.emergencyPhone || '';

      setChronicArray(Array.isArray(data.chronic) ? data.chronic : (data.chronic ? String(data.chronic).split(',') : []));
      disabilitySel.value = data.disability || '';

      const city = data.patientCity || '';
      const district = data.patientDistrict || '';
      const road = data.patientRoad || '';
      if (city){ citySel.value = city; fillDistricts(city, district); } else { fillDistricts('', ''); }
      roadInput.value = road;
    })();

    // ===== 儲存（僅患者欄位）=====
    saveBtn.addEventListener('click', async () => {
      if (!userDocRef) return;

      try{
        saveBtn.setAttribute('disabled','true');
        saveHint.textContent = '儲存中…';

        // ★ 身心障礙程度為必填
        if (!disabilitySel.value) {
          saveHint.textContent = '⚠️ 請選擇身心障礙程度（必填）';
          saveBtn.removeAttribute('disabled');
          return;
        }

        const updates = {
          name: el('name').value.trim(),
          phone: el('phone').value.trim(),
          emergencyName: el('emergencyName').value.trim(),
          emergencyPhone: el('emergencyPhone').value.trim(),
          chronic: getChronicArray(),
          disability: disabilitySel.value
        };

        const city = citySel.value || '';
        const district = districtSel.disabled ? '' : (districtSel.value || '');
        const road = roadInput.value.trim();

        if (!city){ saveHint.textContent = '⚠️ 請選擇縣市'; saveBtn.removeAttribute('disabled'); return; }
        if (!district){ saveHint.textContent = '⚠️ 請選擇行政區'; saveBtn.removeAttribute('disabled'); return; }
        if (!road){ saveHint.textContent = '⚠️ 請輸入詳細地址'; saveBtn.removeAttribute('disabled'); return; }

        updates.patientCity = city;
        updates.patientDistrict = district;
        updates.patientRoad = road;

        await updateDoc(userDocRef, updates);
        saveHint.textContent = '✅ 資料已更新！';
        setTimeout(() => saveHint.textContent = '', 1800);
      }catch(err){
        console.error(err);
        saveHint.textContent = '❌ 儲存失敗，請稍後重試';
      }finally{
        saveBtn.removeAttribute('disabled');
      }
    });
  </script>
</body>
</html>
