<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>註冊 - MakeWell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --bg:#efede9; --bg-2:#dad7cd;
      --text:#363636; --muted:#6e746e;
      --primary:#588157; --primary-weak:#659963de;
      --surface:#ffffff; --chip:#f4f3ef; --border:#e7e5dc;
    }
    body{ background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%); color:var(--text); }
    .card{ background:var(--surface); border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,.06); }
    .input{ border:1px solid var(--border); background:#fff; transition:.2s; }
    .input::placeholder{ color:#a0a6a0; }
    .input:focus{ outline:none; border-color:var(--primary-weak); box-shadow:0 0 0 4px rgba(101,153,99,.18); }
    .btn{ width:100%; border-radius:1.25rem; padding:1rem; font-weight:800; transition:.15s transform,.15s filter; }
    .btn:hover{ transform:translateY(-1px); }
    .btn-primary{ background:var(--primary); color:#fff; }
    .btn-line{ background:#06C755; color:#fff; }
    .btn-fb{ background:#1877F2; color:#fff; }
    .feature{ background:var(--chip); border:1px solid var(--border); }
    .feature-badge{ width:28px; height:28px; border-radius:9999px; display:inline-flex; align-items:center; justify-content:center; background:var(--primary); color:#fff; font-size:14px; box-shadow:0 2px 8px rgba(88,129,87,.25); }
    .divider{ height:1px; width:100%; background:linear-gradient(to right, transparent, var(--border), transparent); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-6xl card rounded-3xl overflow-hidden">
    <div class="grid md:grid-cols-2">
      <!-- Left -->
      <div class="p-7 sm:p-10">
        <div class="w-full max-w-[460px] md:ml-auto mx-auto flex flex-col items-center justify-center gap-5">
          <div class="w-72 sm:w-80 md:w-96">
            <img src="MakeWell.jpg" alt="MakeWell Logo" class="block w-full h-auto object-contain">
          </div>
          <h1 class="text-center text-2xl sm:text-3xl font-extrabold leading-snug" style="color:var(--primary)">
            MakeWell 把照護變得更貼心
          </h1>
          <div class="w-full grid gap-2">
            <div class="feature rounded-xl px-3 py-2.5 flex items-center gap-3">
              <span class="feature-badge">🧭</span>
              <div class="text-sm font-medium">兩步驟更清楚</div>
              <span class="ml-auto text-xs" style="color:var(--muted)">登入 → 基本資料</span>
            </div>
            <div class="feature rounded-xl px-3 py-2.5 flex items-center gap-3">
              <span class="feature-badge">🔒</span>
              <div class="text-sm font-medium">Email 驗證安全性</div>
              <span class="ml-auto text-xs" style="color:var(--muted)">防止誤註冊</span>
            </div>
          </div>
          <div class="mt-4 divider md:hidden"></div>
        </div>
      </div>

      <!-- Right -->
      <div class="p-6 sm:p-10">
        <div class="w-full max-w-[460px] md:mr-auto mx-auto">
          <h2 class="text-3xl sm:text-4xl font-extrabold mb-3 tracking-tight text-center">註冊</h2>
          <p class="text-left text-base sm:text-[17px] leading-relaxed mb-6" style="color:var(--muted)">
            先用 Email、LINE 或 Facebook 建立帳號，再前往下一步填寫基本資料。
          </p>

          <!-- EMAIL -->
          <div class="space-y-3">
            <input id="email" type="email" class="input w-full rounded-xl px-3 py-3" placeholder="Email"/>
            <div class="relative">
              <input id="password" type="password" class="input w-full rounded-xl px-3 py-3 pr-12" placeholder="密碼（至少 6 碼）"/>
              <button type="button" id="togglePwd" class="absolute inset-y-0 right-0 px-3 flex items-center" aria-label="顯示密碼" title="顯示/隱藏密碼">
                <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3.5"/>
                </svg>
                <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M3 3l18 18M10.6 10.6a3.5 3.5 0 004.8 4.8M9.9 4.2A10.9 10.9 0 0112 4c7 0 11 8 11 8a20.9 20.9 0 01-4.2 5.2M6.6 6.6A21.3 21.3 0 001 12s4 8 11 8c1.6 0 3.1-.3 4.5-.9"/>
                </svg>
              </button>
            </div>
            <button id="emailSignupBtn" class="btn btn-primary">使用 Email 建立帳號</button>
          </div>

          <!-- OR -->
          <div class="my-6 text-center text-sm" style="color:var(--muted)">或</div>

          <!-- SOCIAL -->
          <div class="space-y-3">
            <button id="lineSignupBtn" class="btn btn-line">使用 LINE 建立帳號</button>
            <button id="fbSignupBtn" class="btn btn-fb">使用 Facebook 建立帳號</button>
            <div id="providerHint" class="text-xs text-center hidden" style="color:var(--muted)"></div>
          </div>

          <div class="mt-6 text-center text-sm">
            已經有帳號？<a href="login.html" class="font-semibold underline" style="color:var(--primary)">直接登入</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- App logic -->
  <script type="module" src="./register-auth.js"></script>
</body>
</html>
