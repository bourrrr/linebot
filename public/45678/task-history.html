<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>任務回報記錄 - MakeWell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --bg:#efede9; --bg-2:#dad7cd;
      --text:#363636; --muted:#6e746e;
      --primary:#588157; --primary-weak:#659963de;
      --surface:#ffffff; --chip:#f4f3ef; --border:#e7e5dc;
    }
    body{ background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%); color:var(--text); }
    .card{ background:var(--surface); border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,.06); }
    .h-divider{ height:1px; width:100%; background:linear-gradient(to right, transparent, var(--border), transparent); }
    .pill{
      display:inline-flex; align-items:center; justify-content:center;
      padding:.4rem .8rem; border-radius:9999px; font-weight:800;
      border:1px solid var(--border); background:#fff;
      white-space:nowrap; line-height:1; min-height:2.5rem;
    }
    .pill.active{ background:var(--primary); color:#fff; border-color:transparent; box-shadow:0 4px 12px rgba(88,129,87,.25); }
    .badge{ display:inline-flex; align-items:center; gap:6px; padding:.3rem .6rem; border-radius:999px; font-weight:800; font-size:.8rem; background:rgba(88,129,87,.08); border:1px solid rgba(88,129,87,.25); color:var(--primary); }
    .task{ border:1px solid var(--border); background:#fff; border-radius:18px; padding:16px; }
  </style>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- 守門（比照 my-tasks：使用 Custom Token，一次初始化 Firebase） -->
  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from './firebase-config.js';

    const app  = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    const LIFF_ID = "2007877199-Y5R2LenL";
    const CUSTOM_TOKEN_URL = "https://asia-east1-medwell-test1.cloudfunctions.net/authApi/getFirebaseCustomToken";

    // ===== DOM =====
    const container = document.getElementById("historyGroups");  // 以天為群組的容器
    const emptyEl   = document.getElementById("emptyState");
    const dateAll   = document.getElementById("dateAll");
    const date7     = document.getElementById("date7");
    const date30    = document.getElementById("date30");

    let allRows = [];
    let currentFilter = 'all';

    // ===== Utils =====
    const safe = (v)=> (v==null ? "" : String(v));
    function getTs(t){
      try{
        if(!t) return NaN;
        if(typeof t==='number') return t;
        if(typeof t==='string'){ const ms=Date.parse(t); return isNaN(ms)?NaN:ms; }
        if(t.seconds) return t.seconds*1000+Math.floor((t.nanoseconds||0)/1e6);
        if(t.toDate)  return t.toDate().getTime();
        return NaN;
      }catch{ return NaN; }
    }
    function fmtDate(ms){
      if (isNaN(ms)) return '—';
      const d = new Date(ms);
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const da = String(d.getDate()).padStart(2,'0');
      return `${y}/${m}/${da}`;
    }
    function fmtTime(ms){
      if (isNaN(ms)) return '—';
      return new Date(ms).toLocaleString();
    }

    function buildTaskCard(d){
      const addr = `${safe(d.city)}${safe(d.district)}${safe(d.road)}` || '—';
      const type = safe(d.type) || '—';
      const timeMs = getTs(d.time);
      const html = `
        <article class="task">
          <div class="flex items-start gap-3">
            <span class="rounded-full w-10 h-10 flex items-center justify-center bg-[var(--primary)] text-white text-lg">📍</span>
            <div class="min-w-0">
              <h3 class="text-lg md:text-xl font-bold truncate">${addr}</h3>
              <div class="mt-1 text-sm" style="color:var(--muted)">🏥 醫院／藥局：${safe(d.hospital)||'未提供'}</div>
              ${d.accompany ? `<div class="mt-1 text-sm" style="color:var(--muted)">🙋‍♀️ 陪同進診間：${safe(d.accompany)}</div>` : ''}
              <div class="mt-1 text-sm" style="color:var(--muted)">類型：${type}</div>
              <div class="mt-1 text-sm" style="color:var(--muted)">時間：${fmtTime(timeMs)}</div>
              <div class="mt-1 text-sm" style="color:var(--muted)">備註：${safe(d.note)||'無'}</div>
            </div>
          </div>

          <div class="mt-3 flex flex-wrap gap-2">
            <span class="badge">已完成</span>
            <span class="badge">已回報</span>
          </div>

          ${d.photoURL
            ? `<div class="mt-3"><img src="${safe(d.photoURL)}" alt="回報照片" class="w-full max-w-xs rounded-lg border border-[var(--border)] object-contain" /></div>`
            : `<div class="mt-2 text-sm" style="color:var(--muted)">(無回報照片)</div>`}
        </article>`;
      const wrap = document.createElement('div');
      wrap.innerHTML = html;
      return wrap.firstElementChild;
    }

    function renderGrouped(rows){
      container.innerHTML = '';
      if (!rows.length){ emptyEl.classList.remove('hidden'); return; }
      emptyEl.classList.add('hidden');

      // 依日期分組（YYYY/MM/DD）
      const groups = new Map();
      rows.forEach(r => {
        const ts = getTs(r.time);
        const key = fmtDate(ts);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(r);
      });

      // 依日期新→舊排序
      const orderedKeys = Array.from(groups.keys()).sort((a,b)=> new Date(b) - new Date(a));

      orderedKeys.forEach(dateStr => {
        // 日期在線上方置中
        const section = document.createElement('section');
        section.className = 'mb-10';
        section.innerHTML = `
          <div class="flex items-center mb-4">
            <div class="flex-1 h-px bg-[var(--border)]"></div>
            <span class="px-3 text-sm font-semibold" style="color:var(--muted)">${dateStr}</span>
            <div class="flex-1 h-px bg-[var(--border)]"></div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6"></div>
        `;
        const grid = section.querySelector('div.grid');
        groups.get(dateStr).forEach(r => grid.appendChild(buildTaskCard(r)));
        container.appendChild(section);
      });
    }

    function applyDateFilter(){
      let rows = allRows.slice();
      if (currentFilter !== 'all') {
        const days = currentFilter === 'd7' ? 7 : 30;
        const cutoff = Date.now() - days*24*60*60*1000;
        rows = rows.filter(r => {
          const ms = getTs(r.time);
          return !isNaN(ms) && ms >= cutoff;
        });
      }
      renderGrouped(rows);
    }
    function setPill(which){
      currentFilter = which;
      dateAll.classList.toggle('active', which==='all');
      date7.classList.toggle('active', which==='d7');
      date30.classList.toggle('active', which==='d30');
      applyDateFilter();
    }
    dateAll?.addEventListener('click', ()=>setPill('all'));
    date7?.addEventListener('click',  ()=>setPill('d7'));
    date30?.addEventListener('click', ()=>setPill('d30'));

    // ===== 主流程（與 my-tasks 一致的登入守門） =====
    (async () => {
      try{
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { location.href = "login.html"; return; }

        const idToken = liff.getIDToken();
        if (!idToken) { location.href = "login.html"; return; }

        const resp = await fetch(CUSTOM_TOKEN_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idToken })
        });
        if (!resp.ok) { alert("驗證失敗（HTTP "+resp.status+"）"); location.href="login.html"; return; }
        const { customToken } = await resp.json();
        if (!customToken) { alert("驗證失敗（no customToken）"); location.href="login.html"; return; }

        await signInWithCustomToken(auth, customToken);
        const uid = auth.currentUser?.uid;
        if (!uid) { location.href="login.html"; return; }

        // 角色檢查：僅志工可看
        const snap = await getDoc(doc(db, "users", uid));
        if (!snap.exists()) { location.href = "register-profile.html"; return; }
        const rolesArr = Array.isArray(snap.data()?.roles) ? snap.data().roles : [];
        const roles = rolesArr.map(r => String(r).trim().toLowerCase());
        const isVolunteer = roles.includes('志工') || roles.includes('volunteer');
        if (!isVolunteer) { location.href = "home.html"; return; }

        // 取回「已完成」且「我接的」任務
        const q = query(
          collection(db,"requests"),
          where("volunteerId","==", uid),
          where("status","==","completed")
        );
        const qs = await getDocs(q);
        const rows = [];
        qs.forEach(docSnap => rows.push(docSnap.data()));

        // 依任務時間新→舊
        rows.sort((a,b)=> {
          const ta = getTs(a.time), tb = getTs(b.time);
          if (isNaN(ta) && isNaN(tb)) return 0;
          if (isNaN(ta)) return 1;
          if (isNaN(tb)) return -1;
          return tb - ta;
        });

        allRows = rows;
        applyDateFilter();
      }catch(e){
        console.error(e);
        location.href="login.html";
      }
    })();
  </script>
</head>

<body class="min-h-screen p-4 flex items-center justify-center">
  <!-- 比照 my-tasks：置中卡片，固定高度，只有 main 捲動 -->
  <div class="w-full max-w-[1120px] card rounded-3xl overflow-hidden h-[90vh] md:h-[94vh] flex flex-col">
    <!-- Header（固定） -->
    <div class="p-6 md:p-8 border-b border-[var(--border)] flex-shrink-0">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
          <h1 class="text-3xl sm:text-4xl font-extrabold mb-3 tracking-tight">📸 任務回報記錄</h1>
          <a href="volunteer.html" class="text-xs md:text-sm md:ml-auto px-3 py-2 border rounded-full font-semibold" style="color: #363636; border-color: #e7e5dc;">回首頁</a>
      </div>
      <!-- 日期篩選（固定區內） -->
      <section class="mt-2">
        <div class="flex items-center gap-2 md:gap-3 text-s md:text-sm">
          <span class="font-bold">日期：</span>
          <button id="dateAll" class="pill active">全部</button>
          <button id="date7" class="pill">最近 7 天</button>
          <button id="date30" class="pill">最近 30 天</button>
        </div>
      </section>
    </div>

    <!-- 分隔線（固定） -->
    <div class="h-divider flex-shrink-0"></div>

    <!-- 內容（唯一可滾動區塊） -->
    <main class="flex-1 overflow-y-auto overscroll-contain">
      <div class="p-6 md:p-8">
        <!-- 以「日期」為群組的內容會插在這裡 -->
        <div id="historyGroups" class="space-y-10"></div>

        <p id="emptyState" class="hidden text-center text-sm md:text-base mt-8" style="color:var(--muted)">
          沒有符合日期篩選的回報記錄。
        </p>
      </div>
    </main>
  </div>
</body>
</html>
