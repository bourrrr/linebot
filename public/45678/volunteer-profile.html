<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>志工個人資訊 - MakeWell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{ --bg:#efede9; --bg-2:#dad7cd; --text:#363636; --muted:#6e746e; --primary:#588157; --primary-weak:#659963de; --surface:#ffffff; --chip:#f4f3ef; --border:#e7e5dc; }
    body{ background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%); color:var(--text); }
    .card{ background:var(--surface); border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,.06); }
    .h-divider{ height:1px; width:100%; background:linear-gradient(to right, transparent, var(--border), transparent); }
    .field{ display:flex; flex-direction:column; gap:.35rem; }
    .label{ font-weight:800; }
    .input,.select{ width:100%; border:1px solid var(--border); background:#fff; border-radius:14px; padding:.7rem .9rem; font-size:15px; outline:none; }
    .input:focus,.select:focus{ box-shadow:0 0 0 3px rgba(101,153,99,.25); border-color:var(--primary-weak); }
    .badge{ display:inline-flex; align-items:center; gap:.4rem; padding:.35rem .6rem; border-radius:999px; font-weight:800; font-size:.8rem; background:var(--chip); border:1px solid var(--border); color:var(--primary); }
    .btn-ghost{ border:1px solid var(--border); background:#fff; border-radius:9999px; padding:.6rem .9rem; font-weight:800; transition:.15s transform,.15s filter; }
    .btn-ghost:hover{ transform:translateY(-1px); filter:brightness(.98); }
    .btn-primary{ background:var(--primary); color:#fff; font-weight:800; padding:.9rem 1.1rem; border-radius:9999px; transition:.15s transform,.15s filter; }
    .btn-primary:hover{ transform:translateY(-1px); filter:brightness(.98); }
    .btn-primary[disabled]{ opacity:.55; cursor:not-allowed; transform:none; filter:none; }
    .section-title{ font-weight:900; display:flex; align-items:center; gap:.6rem; }
    .dot{ width:.55rem; height:.55rem; border-radius:999px; background:var(--primary); opacity:.8; }
    .preview-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    @media (min-width:768px){ .preview-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
    .file-card{ border:1px solid var(--border); border-radius:14px; padding:10px; background:#fff; }
    .thumb{ width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:10px; border:1px solid var(--border); background:#fafaf8; }
    .file-name{ font-weight:700; font-size:13px; margin-top:6px; word-break:break-all; }
    .file-actions a{ font-size:12px; color:var(--primary); text-decoration:underline; margin-right:8px; }
    .subtle{ color:var(--muted); font-size:12px; }
    .banner{ border:1px dashed #eab308; background:#fef9c3; color:#854d0e; }
  </style>

  <!-- LIFF SDK（一定要在 module 之前） -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="min-h-screen px-4 py-6 md:px-6 md:py-8">
  <div class="mx-auto max-w-[1120px]">
    <div class="card rounded-3xl p-8 md:p-12 min-h-[82vh] md:min-h-[86vh]">
      <!-- Header -->
      <header class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div class="flex items-center gap-5">
          <img src="MakeWell.jpg" alt="MakeWell Logo" class="w-16 h-16 md:w-20 md:h-20 object-contain rounded-xl border border-[var(--border)] bg-white">
          <div>
            <h1 class="text-3xl md:text-4xl font-extrabold leading-tight">志工個人資訊</h1>
            <p class="text-sm md:text-base mt-1" style="color:var(--muted)">更新你的聯絡方式與可服務地區。</p>
          </div>
        </div>
        <a href="volunteer.html" class="self-start md:self-auto text-sm md:text-base font-bold underline" style="color:var(--primary)">← 回志工中心</a>
      </header>

      <div class="mt-8 h-divider"></div>

      <!-- 表單（僅志工） -->
      <main class="mt-8 md:mt-10">
        <div id="authWarn" class="banner p-3 rounded-lg text-sm hidden">⚠️ 尚未完成登入，請回<a href="login.html" class="underline font-semibold">登入頁</a>使用 LINE 登入。</div>

        <section class="mt-4">
          <h2 class="section-title text-xl"><span class="dot"></span> 基本資料 <span id="roleBadge" class="badge hidden">志工</span></h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-4">
            <div class="field"><label for="name" class="label">姓名</label><input id="name" class="input" placeholder="王志工"></div>
            <div class="field"><label for="phone" class="label">手機號碼</label><input id="phone" class="input" inputmode="tel" placeholder="0912-345-678"></div>
            <div class="field"><label for="emergencyName" class="label">緊急聯絡人姓名</label><input id="emergencyName" class="input" placeholder="王媽媽"></div>
            <div class="field"><label for="emergencyPhone" class="label">緊急聯絡人電話</label><input id="emergencyPhone" class="input" inputmode="tel" placeholder="0912-000-000"></div>
          </div>
        </section>

        <section class="mt-10">
          <h2 class="section-title text-xl"><span class="dot"></span> 志工資訊</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-4">
            <div class="field"><label for="city" class="label">縣市</label><select id="city" class="select"><option value="" disabled selected>請選擇縣市</option></select></div>
            <div class="field"><label for="district" class="label">行政區</label><select id="district" class="select" disabled><option value="" disabled selected>請先選縣市</option></select></div>
            <div class="field"><label for="idCard" class="label">身分證字號</label><input id="idCard" class="input" placeholder="A123456789"></div>
            <div class="field"><label for="police" class="label">良民證編號</label><input id="police" class="input" placeholder="POL-2025-XXXX"></div>
            <div class="field"><label for="hours" class="label">志工時數</label><input id="hours" type="number" min="0" class="input" placeholder="0"></div>

            <!-- 良民證檔案 -->
            <div class="field md:col-span-2">
              <label for="policeFile" class="label">良民證檔案（PDF / 圖片）</label>
              <input id="policeFile" type="file" accept=".pdf,image/*" class="input">
              <p id="policeFileHint" class="subtle mt-1">支援 .pdf, .jpg, .png, .webp…</p>
              <div class="mt-3">
                <div class="flex items-center justify-between">
                  <strong>之前上傳的良民證</strong>
                  <button id="refreshPoliceList" type="button" class="text-sm underline" style="color:var(--primary)">重新整理</button>
                </div>
                <div id="policePrev" class="preview-grid mt-2"></div>
              </div>
            </div>

            <!-- 駕照檔案 -->
            <div class="field md:col-span-2">
              <label for="licenseFile" class="label">駕照檔案（PDF / 圖片）</label>
              <input id="licenseFile" type="file" accept=".pdf,image/*" class="input">
              <p id="licenseFileHint" class="subtle mt-1">支援 .pdf, .jpg, .png, .webp…</p>
              <div class="mt-3">
                <div class="flex items-center justify-between">
                  <strong>之前上傳的駕照</strong>
                  <button id="refreshLicenseList" type="button" class="text-sm underline" style="color:var(--primary)">重新整理</button>
                </div>
                <div id="licensePrev" class="preview-grid mt-2"></div>
              </div>
            </div>
          </div>
        </section>

        <div class="mt-12 text-center">
          <button id="saveBtn" class="btn-primary inline-flex items-center justify-center px-8">儲存變更</button>
          <p id="saveHint" class="mt-3 text-sm" style="color:var(--muted)"></p>
        </div>
      </main>
    </div>
  </div>

  <!-- 主腳本：LIFF → Firebase Auth（Custom Token）＋ Firestore + Storage -->
  <script type="module">
    function roleKey(s){
      const m = String(s||'').trim().toLowerCase();
      if (m === '患者' || m === 'patient') return 'patient';
      if (m === '志工' || m === 'volunteer') return 'volunteer';
      return '';
    }
    function getUserRoles(data){
      const raw = (data && (data.roles ?? data.role)) ?? [];
      const arr = Array.isArray(raw) ? raw : (raw ? [raw] : []);
      const set = new Set(arr.map(roleKey).filter(Boolean));
      return { isPatient: set.has('patient'), isVolunteer: set.has('volunteer') };
    }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getStorage, ref, listAll, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
    import { firebaseConfig } from "./firebase-config.js";
    import { cityDistricts } from "./district-data.js";

    // ======= 參數（請改成你的 Functions 網址） =======
    const CUSTOM_TOKEN_URL = "https://asia-east1-medwell-test1.cloudfunctions.net/authApi/getFirebaseCustomToken"; // ← 必改
    const LIFF_ID = "2007877199-Y5R2LenL"; // 你的 LIFF ID

    // ======= 初始化 =======
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const storage = getStorage(app); // 用預設 bucket

    // ======= DOM =======
    const $ = (id) => document.getElementById(id);
    const roleBadge = $("roleBadge");
    const saveBtn = $("saveBtn");
    const saveHint = $("saveHint");
    const citySel = $("city");
    const districtSel = $("district");
    const policePrev = $("policePrev");
    const licensePrev = $("licensePrev");
    $("refreshPoliceList")?.addEventListener("click", () => listPrevFiles("police"));
    $("refreshLicenseList")?.addEventListener("click", () => listPrevFiles("license"));

    // ======= 工具 =======
    function escapeHtml(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
    function fillCities(){ citySel.innerHTML='<option value="" disabled selected>請選擇縣市</option>'; Object.keys(cityDistricts).forEach(c=>citySel.appendChild(new Option(c,c))); }
    function fillDistricts(city, selected=""){ districtSel.innerHTML=""; const list=cityDistricts[city]||[]; if(!list.length){ districtSel.innerHTML='<option value="" disabled selected>請先選縣市</option>'; districtSel.disabled=true; return; } districtSel.disabled=false; districtSel.appendChild(new Option("請選擇行政區","",true,false)); list.forEach(d=>districtSel.appendChild(new Option(d,d,false,d===selected))); }
    citySel.addEventListener("change",()=>{ fillDistricts(citySel.value); districtSel.focus(); });

    // ======= LIFF → Custom Token 登入 =======
    async function ensureLiffReady(){
      try{ await liff.init({ liffId: LIFF_ID }); return true; }
      catch(e){ console.error(e); alert("LIFF 初始化失敗"); return false; }
    }
    async function signInWithLine(){
      if (!(await ensureLiffReady())) return null;
      if (!liff.isLoggedIn()) { location.href = "login.html"; return null; }
      const idToken = liff.getIDToken();
      if (!idToken) { $("authWarn").classList.remove("hidden"); return null; }
      try{
        const resp = await fetch(CUSTOM_TOKEN_URL, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ idToken }) });
        const data = await resp.json();
        if (!resp.ok || !data.customToken) throw new Error(data.error||"custom token error");
        const cred = await signInWithCustomToken(auth, data.customToken);
        return cred.user; // uid 會是 liff:<LINE userId>
      }catch(err){
        console.error("[Bridge Error]", err);
        $("authWarn").classList.remove("hidden");
        return null;
      }
    }

    // ======= 檔案列表 / 上傳（正規化 liff: -> line:） =======
    // ★ 只顯示「最新一張」
    async function listPrevFiles(kind){
      const user = auth.currentUser; if (!user) return;
      const container = kind==="police" ? policePrev : licensePrev;
      container.innerHTML = '<p class="subtle">讀取中…</p>';

      const uid = auth.currentUser?.uid || "";
      const normalized = uid.replace(/^liff:/, "line:");
      const folder = kind==="police"
        ? `police_certificates/${normalized}`
        : `licenses/${normalized}`;

      try{
        const res = await listAll(ref(storage, folder));
        if (!res.items.length){
          container.innerHTML='<p class="subtle">尚無上傳紀錄</p>';
          return;
        }

        // 依檔名中的 timestamp（你上傳時有）挑最新
        const latest = res.items.slice().sort((a,b)=>{
          const ax = a.name.match(/(\d{10,13})/);
          const bx = b.name.match(/(\d{10,13})/);
          const ta = ax ? Number(ax[1]) : 0;
          const tb = bx ? Number(bx[1]) : 0;
          return tb - ta; // 新→舊
        })[0];

        const url = await getDownloadURL(latest);
        const name = latest.name;
        const isImg = /\.(jpe?g|png|webp|gif|bmp)$/i.test(name);
        const isPdf = /\.pdf$/i.test(name);
        const thumb = isImg
          ? `<img class="thumb" src="${url}" alt="${escapeHtml(name)}">`
          : `<div class="thumb flex items-center justify-center text-sm subtle">${isPdf?'PDF 檔案':'檔案'}</div>`;

        container.innerHTML = `<div class="file-card">
          ${thumb}
          <div class="file-name">${escapeHtml(name)}</div>
          <div class="file-actions mt-1">
            <a href="${url}" target="_blank" rel="noopener">開啟</a>
            <a href="${url}" download>下載</a>
          </div>
        </div>`;
      }catch(e){
        console.error(e);
        container.innerHTML = '<p class="subtle">讀取失敗，請確認登入與 Storage 規則</p>';
      }
    }

    async function uploadIfSelected(kind){
      const user = auth.currentUser; if (!user) throw new Error("未登入");
      const input = document.getElementById(kind==="police" ? "policeFile" : "licenseFile");
      const file = input?.files?.[0]; if (!file) return null;
      const ts = Date.now();
      const safeName = file.name.replace(/\s+/g,"_");

      const uid = auth.currentUser?.uid || "";
      const normalized = uid.replace(/^liff:/, "line:");
      const path = kind==="police"
        ? `police_certificates/${normalized}/police_${ts}_${safeName}`
        : `licenses/${normalized}/license_${ts}_${safeName}`;

      const snap = await uploadBytes(ref(storage, path), file);
      const url = await getDownloadURL(snap.ref);
      return { name: file.name, path, url, updatedAt: new Date().toISOString() };
    }

    // ======= users 文件 ID 正規化（避免 line:line:U...）=======
    function usersDocIdFromAuthUid(uid) {
      const s = String(uid || "");
      if (s.startsWith("line:")) return s;
      if (s.startsWith("liff:")) return "line:" + s.slice(5);
      if (/^U[0-9A-Za-z]/.test(s)) return "line:" + s;
      return "line:" + s.replace(/^:+/, "");
    }

    // ======= 主流程 =======
    let userDocRef = null;
    (async () => {
      fillCities();

      const user = await signInWithLine();
      if (!user) return;

      const usersDocId = usersDocIdFromAuthUid(user.uid);
      userDocRef = doc(db, "users", usersDocId);

      if (usersDocId.startsWith("line:line:")) {
        const correctId  = usersDocId.replace(/^line:/, "");
        const wrongRef   = userDocRef;
        const correctRef = doc(db, "users", correctId);
        const wrongSnap  = await getDoc(wrongRef);
        const rightSnap  = await getDoc(correctRef);
        if (wrongSnap.exists() && !rightSnap.exists()) {
          await setDoc(correctRef, wrongSnap.data(), { merge: true });
          console.warn("[FIX] 已將 line:line:… 文件合併到正確的", correctId);
        }
        userDocRef = correctRef;
      }

      let snap = await getDoc(userDocRef);
      if (!snap.exists()) {
        await setDoc(userDocRef, { uid: user.uid, role: "志工", createdAt: serverTimestamp() }, { merge: true });
        snap = await getDoc(userDocRef);
      }

      console.log("[DEBUG] 嘗試讀取 Firestore 文件：users/" + userDocRef.id);
      if (!snap.exists()) {
        console.warn("[DEBUG] 文件不存在：users/" + userDocRef.id);
        location.href = 'register-profile.html';
        return;
      }

      const data = snap.data() || {};
      const { isVolunteer, isPatient } = getUserRoles(data);
      if (!isVolunteer) {
        if (isPatient) { location.href = "home.html"; return; }
        location.href = "register-profile.html"; return;
      }

      roleBadge.textContent = "志工";
      roleBadge.classList.remove("hidden");

      // 帶值
      $("name").value           = data.name || data.displayName || "";
      $("phone").value          = data.phone || "";
      $("emergencyName").value  = data.emergencyName || "";
      $("emergencyPhone").value = data.emergencyPhone || "";
      $("idCard").value         = data.idCard || "";
      $("police").value         = data.police || "";
      $("hours").value          = Number(data.hours ?? 0);

      if (data.volCity) {
        citySel.value = data.volCity;
        fillDistricts(data.volCity, data.volDistrict || "");
      } else {
        fillDistricts("", "");
      }

      await Promise.all([listPrevFiles("police"), listPrevFiles("license")]);
    })();

    // ======= 儲存 =======
    saveBtn.addEventListener("click", async () => {
      if (!userDocRef) { saveHint.textContent = "尚未登入"; return; }

      try{
        saveBtn.setAttribute("disabled","true");
        saveHint.textContent = "儲存中…";

        const updates = {
          name: $("name").value.trim(),
          phone: $("phone").value.trim(),
          emergencyName: $("emergencyName").value.trim(),
          emergencyPhone: $("emergencyPhone").value.trim(),
          idCard: $("idCard").value.trim(),
          police: $("police").value.trim(),
          hours: Number($("hours").value || 0),
          volCity: citySel.value || "",
          volDistrict: districtSel.disabled ? "" : (districtSel.value || ""),
          updatedAt: serverTimestamp()
        };

        if (!updates.volCity){ saveHint.textContent = "⚠️ 請選擇縣市"; saveBtn.removeAttribute("disabled"); return; }
        if (!updates.volDistrict){ saveHint.textContent = "⚠️ 請選擇行政區"; saveBtn.removeAttribute("disabled"); return; }

        const [policeCert, licenseFile] = await Promise.all([ uploadIfSelected("police"), uploadIfSelected("license") ]);
        if (policeCert)  updates.policeCert  = policeCert;
        if (licenseFile) updates.licenseFile = licenseFile;

        await setDoc(userDocRef, updates, { merge: true });

        if (policeCert)  { await listPrevFiles("police");  $("policeFile").value="";  $("policeFileHint").textContent  = `已更新：${policeCert.name}`; }
        if (licenseFile) { await listPrevFiles("license"); $("licenseFile").value=""; $("licenseFileHint").textContent = `已更新：${licenseFile.name}`; }

        saveHint.textContent = "✅ 資料已更新！";
        setTimeout(()=> saveHint.textContent = "", 1800);
      }catch(err){
        console.error(err);
        saveHint.textContent = "❌ 儲存失敗，請稍後重試";
      }finally{
        saveBtn.removeAttribute("disabled");
      }
    });
  </script>
</body>
</html>
