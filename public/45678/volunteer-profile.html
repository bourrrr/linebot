<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>志工個人資訊 - MakeWell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --bg:#efede9; --bg-2:#dad7cd;
      --text:#363636; --muted:#6e746e;
      --primary:#588157; --primary-weak:#659963de;
      --surface:#ffffff; --chip:#f4f3ef; --border:#e7e5dc;
    }
    body{ background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%); color:var(--text); }
    .card{ background:var(--surface); border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,.06); }
    .h-divider{ height:1px; width:100%; background:linear-gradient(to right, transparent, var(--border), transparent); }
    .field{ display:flex; flex-direction:column; gap:.35rem; }
    .label{ font-weight:800; }
    .input, .select{
      width:100%; border:1px solid var(--border); background:#fff; border-radius:14px;
      padding:.7rem .9rem; font-size:15px; outline:none;
    }
    .input:focus, .select:focus{ box-shadow:0 0 0 3px rgba(101,153,99,.25); }
    .badge{ display:inline-flex; align-items:center; gap:.4rem; padding:.35rem .6rem; border-radius:999px; font-weight:800; font-size:.8rem; background:var(--chip); border:1px solid var(--border); color:var(--primary); }
    .btn-ghost{
      border:1px solid var(--border); background:#fff; border-radius:9999px;
      padding:.6rem .9rem; font-weight:800; transition:.15s transform,.15s filter;
    }
    .btn-ghost:hover{ transform:translateY(-1px); filter:brightness(.98); }
    .btn-primary{
      background:var(--primary); color:#fff; font-weight:800;
      padding:.9rem 1.1rem; border-radius:9999px; transition:.15s transform,.15s filter;
    }
    .btn-primary:hover{ transform:translateY(-1px); filter:brightness(.98); }
    .btn-primary[disabled]{ opacity:.55; cursor:not-allowed; transform:none; filter:none; }
    .section-title{ font-weight:900; display:flex; align-items:center; gap:.6rem; }
    .dot{ width:.55rem; height:.55rem; border-radius:999px; background:var(--primary); opacity:.8; }

    /* 上傳清單樣式 */
    .preview-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    @media (min-width:768px){ .preview-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
    .file-card{ border:1px solid var(--border); border-radius:14px; padding:10px; background:#fff; }
    .thumb{ width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:10px; border:1px solid var(--border); background:#fafaf8; }
    .file-name{ font-weight:700; font-size:13px; margin-top:6px; word-break:break-all; }
    .file-actions a{ font-size:12px; color:var(--primary); text-decoration:underline; margin-right:8px; }
    .subtle{ color:var(--muted); font-size:12px; }
  </style>
</head>
<body class="min-h-screen px-4 py-6 md:px-6 md:py-8">
  <div class="mx-auto max-w-[1120px]">
    <div class="card rounded-3xl p-8 md:p-12 min-h-[82vh] md:min-h-[86vh]">
      <!-- Header -->
      <header class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div class="flex items-center gap-5">
          <img src="MakeWell.jpg" alt="MakeWell Logo"
               class="w-16 h-16 md:w-20 md:h-20 object-contain rounded-xl border border-[var(--border)] bg-white">
          <div>
            <h1 class="text-3xl md:text-4xl font-extrabold leading-tight">志工個人資訊</h1>
            <p class="text-sm md:text-base mt-1" style="color:var(--muted)">更新你的聯絡方式與可服務地區。</p>
          </div>
        </div>
        <a href="volunteer.html" class="btn-ghost text-sm md:text-base">← 回志工中心</a>
      </header>

      <div class="mt-8 h-divider"></div>

      <!-- 表單 -->
      <main class="mt-8 md:mt-10">
        <!-- 基本資料 -->
        <section>
          <h2 class="section-title text-xl"><span class="dot"></span> 基本資料 <span id="roleBadge" class="badge hidden">志工</span></h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-4">
            <div class="field">
              <label for="name" class="label">姓名</label>
              <input id="name" type="text" class="input" placeholder="王志工">
            </div>
            <div class="field">
              <label for="phone" class="label">手機號碼</label>
              <input id="phone" type="tel" class="input" placeholder="0912-345-678">
            </div>
            <div class="field">
              <label for="emergencyName" class="label">緊急聯絡人姓名</label>
              <input id="emergencyName" type="text" class="input" placeholder="王媽媽">
            </div>
            <div class="field">
              <label for="emergencyPhone" class="label">緊急聯絡人電話</label>
              <input id="emergencyPhone" type="tel" class="input" placeholder="0912-000-000">
            </div>
          </div>
        </section>

        <!-- 志工資訊 -->
        <section class="mt-10">
          <h2 class="section-title text-xl"><span class="dot"></span> 志工資訊</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-4">
            <div class="field">
              <label for="city" class="label">縣市</label>
              <select id="city" class="select">
                <option value="" disabled selected>請選擇縣市</option>
              </select>
            </div>
            <div class="field">
              <label for="district" class="label">行政區</label>
              <select id="district" class="select" disabled>
                <option value="" disabled selected>請先選縣市</option>
              </select>
            </div>
            <div class="field">
              <label for="idCard" class="label">身分證字號</label>
              <input id="idCard" type="text" class="input" placeholder="A123456789">
            </div>
            <div class="field">
              <label for="police" class="label">良民證編號</label>
              <input id="police" type="text" class="input" placeholder="POL-2025-XXXX">
            </div>
            <div class="field">
              <label for="hours" class="label">志工時數</label>
              <input id="hours" type="number" min="0" class="input" placeholder="0">
            </div>

            <!-- 良民證檔案 -->
            <div class="field md:col-span-2">
              <label for="policeFile" class="label">良民證檔案（PDF / 圖片）</label>
              <input id="policeFile" type="file" accept=".pdf,image/*" class="input">
              <p id="policeFileHint" class="subtle mt-1">支援 .pdf, .jpg, .png, .webp…</p>
              <div class="mt-3">
                <div class="flex items-center justify-between">
                  <strong>之前上傳的良民證</strong>
                  <button id="refreshPoliceList" type="button" class="text-sm underline" style="color:var(--primary)">重新整理</button>
                </div>
                <div id="policePrev" class="preview-grid mt-2"></div>
              </div>
            </div>

            <!-- 駕照檔案 -->
            <div class="field md:col-span-2">
              <label for="licenseFile" class="label">駕照檔案（PDF / 圖片）</label>
              <input id="licenseFile" type="file" accept=".pdf,image/*" class="input">
              <p id="licenseFileHint" class="subtle mt-1">支援 .pdf, .jpg, .png, .webp…</p>
              <div class="mt-3">
                <div class="flex items-center justify-between">
                  <strong>之前上傳的駕照</strong>
                  <button id="refreshLicenseList" type="button" class="text-sm underline" style="color:var(--primary)">重新整理</button>
                </div>
                <div id="licensePrev" class="preview-grid mt-2"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- 儲存 -->
        <div class="mt-12 text-center">
          <button id="saveBtn" class="btn-primary inline-flex items-center justify-center px-8">儲存變更</button>
          <p id="saveHint" class="mt-3 text-sm" style="color:var(--muted)"></p>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, doc, getDoc, setDoc,
      collection, query, where, getDocs, serverTimestamp, limit
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getStorage, ref, uploadBytes, getDownloadURL, listAll
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
    import { firebaseConfig } from "./firebase-config.js";
    import { cityDistricts } from "./district-data.js";

    // ===== Firebase =====
    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    const auth = getAuth(app);
    const storage = getStorage(app);

    // ===== DOM =====
    const el = (id) => document.getElementById(id);
    const roleBadge = el('roleBadge');
    const citySel = /** @type {HTMLSelectElement} */(el('city'));
    const districtSel = /** @type {HTMLSelectElement} */(el('district'));
    const saveBtn = el('saveBtn');
    const saveHint = el('saveHint')

    // 上傳/歷史
    const policeFileInput = /** @type {HTMLInputElement} */(el('policeFile'));
    const licenseFileInput = /** @type {HTMLInputElement} */(el('licenseFile'));
    const policePrev = el('policePrev');
    const licensePrev = el('licensePrev');
    el('refreshPoliceList')?.addEventListener('click', () => listPrevFiles('police'));
    el('refreshLicenseList')?.addEventListener('click', () => listPrevFiles('license'));

    let userDocRef = null;
    let currentUser = null;

    // ===== 城市/行政區 =====
    function fillCities(){
      citySel.innerHTML = '<option value="" disabled selected>請選擇縣市</option>';
      Object.keys(cityDistricts).forEach(c => citySel.appendChild(new Option(c, c)));
    }
    function fillDistricts(city, selected=''){
      districtSel.innerHTML = '';
      const list = cityDistricts[city] || [];
      if (!list.length){
        districtSel.innerHTML = '<option value="" disabled selected>請先選縣市</option>';
        districtSel.disabled = true; return;
      }
      districtSel.disabled = false;
      districtSel.appendChild(new Option('請選擇行政區', '', true, false));
      list.forEach(d => districtSel.appendChild(new Option(d, d, false, d===selected)));
    }
    citySel.addEventListener('change', () => { fillDistricts(citySel.value); districtSel.focus(); });

    // ===== 找舊文件 → 合併搬家到 users/{uid} =====
    async function locateUserDoc(user){
      const uidRef = doc(db, 'users', user.uid);
      let snap = await getDoc(uidRef);
      if (snap.exists()) return { ref: uidRef, data: snap.data() };

      // 1) uid 欄位
      let q1 = query(collection(db,'users'), where('uid','==', user.uid), limit(1));
      let r1 = await getDocs(q1);
      if (!r1.empty){
        const oldRef = doc(db,'users', r1.docs[0].id);
        const oldData = r1.docs[0].data();
        // 合併搬家
        await setDoc(uidRef, { ...oldData, uid: user.uid, migratedFrom: oldRef.id, migratedAt: serverTimestamp() }, { merge:true });
        return { ref: uidRef, data: { ...oldData, uid:user.uid } };
      }

      // 2) email 欄位
      if (user.email){
        let q2 = query(collection(db,'users'), where('email','==', user.email), limit(1));
        let r2 = await getDocs(q2);
        if (!r2.empty){
          const oldRef = doc(db,'users', r2.docs[0].id);
          const oldData = r2.docs[0].data();
          await setDoc(uidRef, { ...oldData, uid: user.uid, email: user.email, migratedFrom: oldRef.id, migratedAt: serverTimestamp() }, { merge:true });
          return { ref: uidRef, data: { ...oldData, uid:user.uid, email:user.email } };
        }
      }

      // 都找不到：建立最小文件
      await setDoc(uidRef, { uid:user.uid, role:'volunteer', createdAt:serverTimestamp() }, { merge:true });
      return { ref: uidRef, data: { uid:user.uid, role:'volunteer' } };
    }

    // ===== 載入 & 帶入表單 =====
    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href="login.html"; return; }
      currentUser = user;
      fillCities();

      try{
        const { ref, data } = await locateUserDoc(user);
        userDocRef = ref;

        // 角色徽章
        roleBadge.textContent = (data.role === 'volunteer') ? '志工' : (data.role || '使用者');
        roleBadge.classList.remove('hidden');

        // 基本資料（帶入舊值）
        el('name').value           = data.name || '';
        el('phone').value          = data.phone || '';
        el('emergencyName').value  = data.emergencyName || '';
        el('emergencyPhone').value = data.emergencyPhone || '';

        // 志工欄位
        el('idCard').value = data.idCard || '';
        el('police').value = data.police || '';
        el('hours').value  = (data.hours ?? 0);

        if (data.city){
          citySel.value = data.city;
          fillDistricts(data.city, data.district || '');
        } else { fillDistricts('', ''); }

        // 歷史檔案
        await Promise.all([listPrevFiles('police'), listPrevFiles('license')]);
        if (data.policeCert?.name)  el('policeFileHint').textContent  = `目前最新：${data.policeCert.name}`;
        if (data.licenseFile?.name) el('licenseFileHint').textContent = `目前最新：${data.licenseFile.name}`;
      }catch(err){
        console.error('[LOAD_ERR]', err);
        alert('讀取個人資料失敗，請稍後再試');
      }
    });

    // ===== 列出歷史檔案 =====
    async function listPrevFiles(kind /** 'police' | 'license' */){
      if (!currentUser) return;
      const folder = (kind === 'police') ? `police_certificates/${currentUser.uid}` : `licenses/${currentUser.uid}`;
      const container = (kind === 'police') ? policePrev : licensePrev;
      if (!container) return;

      container.innerHTML = '<p class="subtle">讀取中…</p>';
      try{
        const listRef = ref(storage, folder);
        const res = await listAll(listRef);
        if (!res.items.length){ container.innerHTML = '<p class="subtle">尚無上傳紀錄</p>'; return; }
        const items = res.items.sort((a,b)=>a.name.localeCompare(b.name));
        const rows = await Promise.all(items.map(async it=>{
          try{ const url = await getDownloadURL(it); return renderFileCard(it.name, url); }
          catch{ return renderFileCard(it.name, ''); }
        }));
        container.innerHTML = rows.join('');
      }catch(err){
        console.error('[LIST_ERR]', err);
        container.innerHTML = '<p class="subtle">讀取失敗，請稍後重試</p>';
      }
    }
    function renderFileCard(name, url){
      const isImg = /\.(jpg|jpeg|png|webp|gif|bmp)$/i.test(name);
      const isPdf = /\.pdf$/i.test(name);
      const thumb = isImg
        ? `<img class="thumb" src="${url}" alt="${escapeHtml(name)}">`
        : `<div class="thumb flex items-center justify-center text-sm subtle">預覽不可用<br>${isPdf?'PDF 檔案':'檔案'}</div>`;
      const open = url ? `<a href="${url}" target="_blank" rel="noopener">開啟</a>` : '';
      const dl   = url ? `<a href="${url}" download>下載</a>` : '';
      return `<div class="file-card">${thumb}<div class="file-name">${escapeHtml(name)}</div><div class="file-actions mt-1">${open}${dl}</div></div>`;
    }
    function escapeHtml(str){
      return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    }

    // ===== 上傳（若選檔） =====
    async function maybeUploadFile(kind /** 'police' | 'license' */){
      if (!currentUser) return null;
      const input = (kind==='police') ? policeFileInput : licenseFileInput;
      const file  = input?.files?.[0];
      if (!file) return null;

      const safeName = file.name.replace(/\s+/g,'_');
      const ts = Date.now();
      const path = (kind === 'police')
        ? `police_certificates/${currentUser.uid}/police_${ts}_${safeName}`
        : `licenses/${currentUser.uid}/license_${ts}_${safeName}`;

      const fileRef = ref(storage, path);
      await uploadBytes(fileRef, file);
      const url = await getDownloadURL(fileRef);
      return { name:file.name, path, url, updatedAt: new Date().toISOString() };
    }

    // ===== 儲存 =====
    saveBtn.addEventListener('click', async () => {
      if (!userDocRef) return;
      try{
        saveBtn.setAttribute('disabled','true');
        saveHint.textContent = '儲存中…';

        const updates = {
          name: el('name').value.trim(),
          phone: el('phone').value.trim(),
          emergencyName: el('emergencyName').value.trim(),
          emergencyPhone: el('emergencyPhone').value.trim(),
          idCard: el('idCard').value.trim(),
          police: el('police').value.trim(),
          hours: Number(el('hours').value || 0),
          city: citySel.value || '',
          district: districtSel.disabled ? '' : (districtSel.value || ''),
          updatedAt: serverTimestamp()
        };

        if (!updates.city){ saveHint.textContent = '⚠️ 請選擇縣市'; saveBtn.removeAttribute('disabled'); return; }
        if (!updates.district){ saveHint.textContent = '⚠️ 請選擇行政區'; saveBtn.removeAttribute('disabled'); return; }

        // 檔案上傳（若有）
        const [policeCert, licenseFile] = await Promise.all([
          maybeUploadFile('police'),
          maybeUploadFile('license')
        ]);
        if (policeCert)  updates.policeCert  = policeCert;
        if (licenseFile) updates.licenseFile = licenseFile;

        // merge 寫回
        await setDoc(userDocRef, updates, { merge:true });

        if (policeFileInput?.files?.length){ await listPrevFiles('police'); el('policeFileHint').textContent = `已更新：${policeFileInput.files[0].name}`; policeFileInput.value=''; }
        if (licenseFileInput?.files?.length){ await listPrevFiles('license'); el('licenseFileHint').textContent = `已更新：${licenseFileInput.files[0].name}`; licenseFileInput.value=''; }

        saveHint.textContent = '✅ 資料已更新！';
        setTimeout(()=> saveHint.textContent='', 2000);
      }catch(err){
        console.error('[SAVE_ERR]', err);
        saveHint.textContent = '❌ 儲存失敗：' + (err?.message || '請稍後再試');
      }finally{
        saveBtn.removeAttribute('disabled');
      }
    });
  </script>

</body>
</html>
