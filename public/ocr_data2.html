  <style>
    :root{
      --mw-green:#588157;
      --mw-green-light:#659963de;
      --mw-warm-gray:#dad7cd;
      --mw-gray:#8e8e8cf2;
      --mw-ink:#363636;
      --mw-border:#cfcfc9;
    }
    html,body{ background: var(--mw-warm-gray); color: var(--mw-ink); font-family: "Noto Sans TC", system-ui, -apple-system, Segoe UI, sans-serif; }
    .mw-header{ background:#fff; border-bottom:1px solid var(--mw-border);}
    .mw-title{ color:var(--mw-green);}
    .mw-sub{ color:var(--mw-gray);}
    .mw-card{ background:#fff; border:1px solid var(--mw-border); border-radius:20px; box-shadow:0 6px 18px rgba(0,0,0,.04); }
    .mw-btn-primary{ background:var(--mw-green); color:#fff; border-radius:12px; padding:.65rem 1rem; font-weight:700; transition:.2s;}
    .mw-btn-ghost{ border:1px solid var(--mw-border); background:#fff; color:#363636; border-radius:12px; padding:.55rem .9rem; }
    .mw-input{ width:100%; border:1px solid var(--mw-border); border-radius:14px; padding:.7rem .9rem; background:#fff; }
    .mw-field-row{ display:grid; grid-template-columns:160px 1fr auto; gap:.6rem; align-items:center; }
    @media (max-width: 767px){ .mw-field-row{ grid-template-columns: 1fr 1fr; } .mw-field-row [data-del]{ grid-column: 1 / -1; } }
    @keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .animate-fadeInUp{animation:fadeInUp .45s ease-out forwards}
  </style>
</head>
<body>

  <header class="mw-header">

      <div style="padding: 10px; text-align: left;">

           style="display: inline-block; background-color: #588157; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 16px;">
          ← 回主頁
        </a>
      </div>

  <main class="mx-auto max-w-6xl px-4 py-6 space-y-6">
    <!-- 上傳卡片 -->

      <div class="flex flex-col md:flex-row md:items-end gap-4">

          <input id="fileInput" type="file" accept="image/*" class="mw-input" placeholder="從裝置選擇影像檔">

        </div>

          <button id="btnFillFromRaw" class="mw-btn-ghost" title="把原文一鍵轉欄位（嘗試）">原文轉欄位</button>
        </div>
      </div>

      <div id="previewWrap" class="mt-4 hidden" style="background:#f6f6f3; border:1px dashed var(--mw-border); border-radius:16px; padding:.75rem;">
        <p class="text-sm mb-2" style="color:var(--mw-gray)">預覽</p>

      </div>

      <div id="status" class="mt-3 text-sm hidden"></div>
    </section>

    <!-- 辨識結果 -->
    <section class="mw-card p-4 md:p-6">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <div>
          <h2 class="text-xl font-bold" style="color:var(--mw-green)">辨識結果（可編輯）</h2>
          <p class="text-xs mt-1" style="color:var(--mw-gray)">日期：<span id="date"></span></p>
        </div>
        <div class="flex gap-2">
          <button id="btnAdd" class="mw-btn-ghost">＋ 新增欄位</button>
          <button id="btnClear" class="mw-btn-ghost">清除全部欄位</button>

      <div id="fields" class="mt-4 space-y-2">

      </div>

    <!-- 原文備查 -->

      <h3 class="text-lg font-semibold mb-2" style="color:var(--mw-green)">原始內容（備查）</h3>
      <pre id="rawText" class="bg-white rounded-lg border border-[var(--mw-border)] p-3 text-sm whitespace-pre-wrap"></pre>
    </section>

  <!-- 仍沿用你現有的字典解析器 -->
  <script src="https://medwell-test1.web.app/extractHealthData.js"></script>

  <script>
    /* ====== 基本設定（原樣保留） ====== */
    const liffId = "2007877199-xXoPD8mD";
    const firebaseConfig = {
      apiKey: "AIzaSyCCUzxpn1quR9PPSBeZBGG17XVh8vPzjY",
      authDomain: "medwell-test1.firebaseapp.com",
      projectId: "medwell-test1",
      storageBucket: "medwell-test1.appspot.com",
      messagingSenderId: "860851688843",
      appId: "1:860851688843:web:622eb8feccad45ce640b8e",
      measurementId: "G-9FGX9SG7XB"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const OCR_API = "https://linebot-o8nr.onrender.com/api/ocr";

    /* ====== DOM ====== */
    const fileInput = document.getElementById('fileInput');
    const btnUpload = document.getElementById('btnUpload');
    const btnFillFromRaw = document.getElementById('btnFillFromRaw');
    const btnAdd = document.getElementById('btnAdd');
    const btnClear = document.getElementById('btnClear');
    const btnConfirm = document.getElementById('btnConfirm');
    const fieldsEl = document.getElementById('fields');
    const statusEl = document.getElementById('status');
    const previewWrap = document.getElementById('previewWrap');
    const previewImg = document.getElementById('previewImg');
    const rawSection = document.getElementById('rawSection');
    const rawTextEl = document.getElementById('rawText');
    const pageTitle = document.getElementById('pageTitle');
    const loginStatus = document.getElementById('loginStatus');

    /* ====== 狀態 ====== */
    let dynamicData = {};
    let ocrRawText = "";
    let formattedDate = "";
    let editingId = null;
    let originalDoc = null;

    // 日期（原樣）
    (function(){
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const dd = String(d.getDate()).padStart(2,'0');
      formattedDate = `${yyyy}/${mm}/${dd}`;
      document.getElementById('date').textContent = formattedDate;
    })();

    /* ====== 編輯模式（原樣：?id / localStorage） ====== */
    (function(){
      const id = new URL(location.href).searchParams.get('id');
      if (!id) { localStorage.removeItem('edit_data'); editingId = null; originalDoc = null; }
    })();

    function getQueryId(){ try { return new URL(location.href).searchParams.get('id'); } catch { return null; } }

    async function loadEditIfAny() {
      editingId = getQueryId();
      if (editingId) {
        const snap = await db.collection('health_records').doc(editingId).get();
        if (snap.exists) {
          originalDoc = snap.data() || {};
          dynamicData = { ...(originalDoc.data || {}) };
          if (originalDoc.date) formattedDate = originalDoc.date;
          document.getElementById('date').textContent = formattedDate;
          pageTitle.textContent = '健康數據編輯';
          renderFields();
          return;
        }
      }
      const cached = localStorage.getItem('edit_data');
      if (cached) {
        try {
          const obj = JSON.parse(cached);
          editingId = obj._id || null;
          dynamicData = { ...(obj.data || {}) };
          if (obj.date) formattedDate = obj.date;
          document.getElementById('date').textContent = formattedDate;
          pageTitle.textContent = '健康數據編輯';
          renderFields();
        } catch {}
      }
    }
    loadEditIfAny();

    /* ====== LIFF（原樣） ====== */
    async function initLIFF() {
      const $ = (t) => loginStatus && (loginStatus.textContent = t);
      try {
        await liff.init({ liffId });
        if (liff.isLoggedIn()) {
          try { const p = await liff.getProfile(); $(p?.displayName ? `已登入 ✓（${p.displayName}）` : '已登入 ✓'); }
          catch { $('已登入 ✓'); }
        } else {
          loginStatus.innerHTML = '未登入（點我登入）';
          loginStatus.style.cursor = 'pointer';
          loginStatus.onclick = () => liff.login({ redirectUri: location.href });
        }
      } catch (e) { console.error('LIFF 初始化失敗：', e); $('LIFF 初始化失敗'); }
    }
    document.addEventListener('DOMContentLoaded', initLIFF);

    /* ====== 欄位渲染（原樣） ====== */
    function renderFields(){
      fieldsEl.innerHTML = "";
      const keys = Object.keys(dynamicData);
      if (!keys.length){
        fieldsEl.innerHTML = '<div class="text-sm" style="color:var(--mw-gray)">尚未有資料，請先上傳圖片辨識，或點「＋ 新增欄位」。</div>';
        return;
      }
      keys.forEach((k, idx)=>{
        const row = document.createElement('div');
        row.className = "mw-field-row ";

        const keyVal = (k || "").trim();
        const valVal = (dynamicData[k] ?? "").trim();

        const keyAttr = keyVal ? `value="${keyVal.replace(/"/g,'&quot;')}"` : "";
        const valAttr = valVal ? `value="${valVal.replace(/"/g,'&quot;')}"` : "";

        row.innerHTML = `
          <input class="mw-input" data-k="key" ${keyAttr} placeholder="名稱（如 血壓）">
          <input class="mw-input" data-k="val" ${valAttr} placeholder="值（如 120/80 mmHg）">
          <button class="mw-btn-ghost" data-del>刪除</button>
        `;

        row.querySelector('[data-del]').onclick = ()=>{
          delete dynamicData[k];
          renderFields();
        };

        const keyInput = row.querySelector('[data-k="key"]');
        const valInput = row.querySelector('[data-k="val"]');

        keyInput.addEventListener('change', ()=>{
          const nk = keyInput.value.trim();
          const v = valInput.value.trim();
          delete dynamicData[k];
          if (nk) dynamicData[nk] = v;
          renderFields();
        });
        valInput.addEventListener('change', ()=>{
          const nk = keyInput.value.trim();
          if (nk) dynamicData[nk] = valInput.value.trim();
        });

        fieldsEl.appendChild(row);
        
      });
    }

    /* ====== 單位正規化 / 表格斷行合併（微調） ====== */
    function normalizeUnitFront(s = '') {
      return (s || '')
        .replace(/mg\/?dl/gi, 'mg/dL')
        .replace(/g\/?dl/gi, 'g/dL')
        .replace(/mmhg/gi, 'mmHg')
        .replace(/\/min/gi, 'bpm')
        .replace(/\bkg\b/gi, 'kg')
        .replace(/\bcm\b/gi, 'cm')
        .replace(/度c|c度/gi, '°C');
    }
    function collapseTableRowsFront(rawText) {
      const lines = (rawText || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const merged = [];
      const isNameLike = (t) => /^(總膽固醇|血清總膽固醇|血清膽固醇|三酸甘油|三酸甘油脂|中性脂肪|HDL|LDL|Cholesterol|Triglyceride|HDL\s*Cholesterol|LDL\s*Cholesterol|血壓|脈搏|心率|血糖|BMI|身高|體重|尿蛋白|尿糖|血小板|白血球|紅血球|HbA1c|CRP|TSH|T3|T4|Ferritin|Vitamin\s*D|鈣|鈉|鉀|氯|膽紅素|AST|ALT|GOT|GPT|ALP|GGT|eGFR|Creatinine|BUN|尿酸|MCV|MCH|MCHC|Hct|HGB)/i.test(t);
      const isValueLike = (s) =>
	  /^([<>]?\s*\d+(?:\.\d+)?(?:\s*-\s*\d+(?:\.\d+)?)?|(?:\d{2,3}\s*\/\s*\d{2,3}))$/i.test(String(s || ''));

		const isRefLike = (s) =>
	  /^[<>]\s*\d+(?:\.\d+)?|\d+\s*[-~～]\s*\d+(?:\.\d+)?$/i.test(String(s || ''));

		const isUnitLike = (s) =>
	  /^(mg\/?d[l1I]|mmol\/?L|mmHg|bpm|%|°C|cm|kg|g\/?d[l1I]|10\^9\/L|10\^6\/µL)$/i.test(String(s || ''));


      for (let i = 0; i < lines.length; i++) {
        const a = lines[i];
        if (isNameLike(a)) {
          let val = '', ref = '', unit = '';
          if (i + 1 < lines.length && isValueLike(lines[i + 1])) { val  = lines[++i]; }
          if (i + 1 < lines.length && isRefLike(lines[i + 1]))   { ref  = lines[++i]; }
          if (i + 1 < lines.length && isUnitLike(lines[i + 1]))  { unit = lines[++i]; }
          const oneLine = [a, val, ref, unit].filter(Boolean).join(' ');
          merged.push(normalizeUnitFront(oneLine));
        } else {
          merged.push(normalizeUnitFront(a));
        }
      }
      return merged.join('\n');
    }

    /* ====== 放寬且擴充的 OCR 解析 ====== */
function parseOCRResultFlexible(text){
  const result = {};
  if (!text) return result;

  // 先把直欄表格「名稱/值/參考/單位」併回一行（你檔案裡已定義過）
  const pre   = collapseTableRowsFront(text);
  const lines = pre.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);

  // 小工具：只含英文/點/斜線/空白的括號，視為別名（如 "(ALT)"）
  const isAliasParen = (s='') => /^\(?\s*[A-Za-z][A-Za-z.\-\/\s]*\s*\)?$/.test(String(s||''));
  // 去掉鍵名中的（英文）括號別名（含全形）
  const stripEnglishParen = (s='') =>
    String(s||'').replace(/[（(]\s*[A-Za-z][A-Za-z.\-\/\s]*\s*[)）]/g, '').trim();

  // 1) 可辨識鍵（大幅擴充＋含舊寫法）
  const keyHints = new RegExp([
    // 一般生命徵象/常見欄
    '(?:血壓|血糖(?:\\(空腹\\)|\\(飯後\\))?|脈搏|心率|血氧|體溫|體重|身高|BMI|腰圍|體脂)',
    // 血脂/膽固醇（含血清寫法）
    '(?:|HDL(?:-?C)?|LDL(?:-?C)?|高密度膽固醇|低密度膽固醇|非HDL|總膽固醇|血清膽固醇|血清總膽固醇|三酸甘油脂|Triglyceride|Cholesterol)',
    // 肝功能（含舊寫法與括號）
    '(?:|GOT\\(AST\\)|GPT\\(ALT\\)|AST|ALT|SGOT|SGPT|S\\.G\\.O\\.T|S\\.G\\.P\\.T|r-?GTP|GGT|ALP|膽紅素|T-?Bil|D-?Bil)',
    // 腎功能
    '(?:|尿酸|BUN|Creatinine|Creat|eGFR|微量白蛋白|尿蛋白|尿糖|ACR|UACR)',
    // 內分泌/發炎/維生素/電解質
    '(?:|HbA1c|CRP|TSH|T3|T4|Ferritin|維生素D|Vitamin\\s*D|鈣|鈉|鉀|氯|鎂|磷|尿鈉|尿鉀)',
    // 血球
    '(?:|白血球|紅血球|血紅素|血色素|血小板|WBC|RBC|HGB|Hb|Hct|MCV|MCH|MCHC|PLT|Neutrophil|Lymphocyte|Eosinophil|Basophil|Monocyte)',
    // 風險指標
    '(?:|Risk|危險因子指數|AIP|非HDL\\s*膽固醇|TG\\/HDL)'
  ].join('|'), 'i');

  // 2) 「長文字」鍵（醫囑/診斷/備註…）允許多行累積
  const noteKeyReg =
    /^(醫師建議|醫囑|醫師囑言|診斷|印象|影像結論|評估|處置|衛教|注意事項|備註|建議|說明|Summary|Impression|Plan|Assessment|Recommendation)s?$/i;

  // 3) key: value 或 key  value
  const keyValRegex1 = /^(.{1,30}?)[：:]\s*(.+)$/;      // 帶冒號
  const keyValRegex2 = /^(.{1,30}?)\s{1,3}(.{1,80})$/;  // 兩欄靠空白

  // 4) 像數值/範圍/血壓的「值」行（可含單位）
  const valueLine =
    /^([<>]?\s*\d+(?:\.\d+)?(?:\s*-\s*\d+(?:\.\d+)?)?(?:\/\d+(?:\.\d+)?)?)\s*(?:[a-zA-Z%°/]+|mmHg|mg\/?d[l1I]|g\/?d[l1I]|mmol\/?L|bpm|mL\/min\/1\.73m²|U\/L|fL|pg)?$/i;

  // 5) 名稱正規化（同義詞→中文標準名）
  const normalizeMap = {
    // 既有
    '心率':'脈搏','高密度膽固醇':'HDL','低密度膽固醇':'LDL',
    '血紅素':'血色素(Hb)','血色素':'血色素(Hb)',
    '白血球':'白血球(WBC)','紅血球':'紅血球(RBC)','血小板':'血小板(PLT)',
    'HbA1c':'糖化血色素(HbA1c)',
    'GOT':'AST','GPT':'ALT','T Bil':'T-Bil','D Bil':'D-Bil',
    '維生素D':'Vitamin D','非HDL':'非HDL膽固醇',
    '血清膽固醇':'總膽固醇','血清總膽固醇':'總膽固醇',

    // 新增（英文/舊寫法 → 中文）
    'AST':'天門冬胺酸轉胺酶',
    'S.G.O.T':'天門冬胺酸轉胺酶',
    'S.G.O.T(AST)':'天門冬胺酸轉胺酶',

    'ALT':'丙胺酸轉胺酶',
    'GPT':'丙胺酸轉胺酶',
    'S.G.P.T':'丙胺酸轉胺酶',
    'S.G.P.T(ALT)':'丙胺酸轉胺酶',

    'GGT':'γ-穀胱甘肽轉移酶',
    'r-GTP':'γ-穀胱甘肽轉移酶',
    'r-GTP(GGT)':'γ-穀胱甘肽轉移酶'
  };
  const nk = k => (normalizeMap[k] || k);

  // 逐行解析
  for (let i = 0; i < lines.length; i++){
    const line = lines[i];

    // (A) 先處理 "key: value" / "key  value"
    let m = line.match(keyValRegex1) || line.match(keyValRegex2);
    if (m){
      const rawKey = (m[1] || '').trim();

      // 去掉鍵名內的 (ALT)/(AST)… 再做正規化成中文
      const key = nk(stripEnglishParen(rawKey));

      let val = normalizeUnitFront((m[2] || '').trim());

      // 值若只是 "(ALT)" 這類英文別名 → 視為註記，不當值；向下一行抓真數值
      if (isAliasParen(val)) {
        if (i + 1 < lines.length && valueLine.test(lines[i + 1])) {
          val = normalizeUnitFront(lines[++i].trim());
          // 嘗試再多吃一行單位（選擇性）
          if (i + 1 < lines.length &&
              /(mmHg|mg\/?dL|g\/?dL|%|bpm|°C|cm|kg|U\/L|mL\/min\/1\.73m²|mmol\/L|fL|pg)/i.test(lines[i+1])) {
            val = `${val} ${normalizeUnitFront(lines[++i].trim())}`;
          }
        } else {
          // 下一行也不是數值 → 略過這筆，避免把 (ALT) 寫入
          continue;
        }
      }

      // 長文字鍵：允許自由文本多行
      if (noteKeyReg.test(rawKey)) {
        const buf = [val];
        let j = i + 1;
        while (j < lines.length) {
          const next = lines[j].trim();
          const looksLikeNextKey = keyValRegex1.test(next) || keyValRegex2.test(next) || keyHints.test(next);
          if (looksLikeNextKey) break;
          buf.push(next);
          j++;
        }
        result[key] = buf.join('\n').trim();
        i = j - 1;
        continue;
      }

      // 一般鍵：key 類型正確或 value 像數值/含單位就收
      if (key && (keyHints.test(key) || valueLine.test(val) || /mmHg|mg\/dL|g\/dL|%|bpm|cm|kg|°C/i.test(val))) {
        if (!(key in result) || String(result[key]??'').trim()==='') result[key]=val;
      }
      continue;
    }

    // (B) 直欄：本行是鍵、下一行是值
    if (keyHints.test(line) && i+1<lines.length && valueLine.test(lines[i+1])) {
      const key = nk(stripEnglishParen(line));
      const val = normalizeUnitFront(lines[i+1].trim());
      if (!(key in result) || String(result[key]??'').trim()==='') result[key]=val;
      i++;
      continue;
    }
  }

  return result;
}

    /* ====== 去噪/正規化（放寬，允許長文字欄位） ====== */
    function sanitizeDynamicData(data) {
      const out = {};

      const normalizeKey = (k) => {
        let key = String(k || '').trim();
        key = key.replace(/[：:]\s*$/, '');
        key = key.replace(/\s+/g, ' ');
        key = key.replace(/^白血球$/, '白血球(WBC)')
                 .replace(/^紅血球$/, '紅血球(RBC)')
                 .replace(/^血色素$/, '血色素(Hb)')
                 .replace(/^血小板$/, '血小板(PLT)');
        return key;
      };

      const looksLikeRange = s => /^\s*[<>]?\s*\d+(?:\.\d+)?\s*[-~～]\s*[<>]?\s*\d+(?:\.\d+)?/.test(s);
      const hasLetters = s => /[A-Za-z\u4e00-\u9fa5]/.test(s);

      // 允許長文本的欄位（醫囑/建議/備註/診斷/評估/處置/結論/衛教/注意事項…）
      const longTextKeyReg = /(醫師建議|醫囑|醫師囑言|診斷|印象|影像結論|評估|處置|衛教|注意事項|備註|建議|說明|Summary|Impression|Plan|Assessment|Recommendation)s?$/i;

      const isBadKey = (k) => {
        const key = String(k||'').trim();
        if (key.length < 2) return true;
        if (!hasLetters(key)) return true;
        if (/^\d/.test(key)) return true;
        if (/^(cm|kg|mmhg|mg\/dl|bpm|％|%|公分|公斤|單位|I)$/i.test(key)) return true;
		if (/^[A-Za-z\s]+$/.test(key)) return true;

        return false;
      };

		// 依文件自上而下排序欄位
		function sortByDocOrder(data, rawText){
		  if (!rawText) return data;

		  // 針對常見同義/縮寫做別名映射（可再擴充）
		  const alias = {
			'天門冬胺酸轉胺酶': ['天門冬胺酸轉胺酶','AST','GOT','S.G.O.T','S.G.O.T(AST)'],
			'丙胺酸轉胺酶': ['丙胺酸轉胺酶','ALT','GPT','S.G.P.T','S.G.P.T(ALT)'],
			'γ-穀胱甘肽轉移酶': ['γ-穀胱甘肽轉移酶','GGT','r-GTP','r-GTP(GGT)'],
			'總膽固醇': ['總膽固醇','血清膽固醇','血清總膽固醇','Cholesterol'],
			'三酸甘油脂': ['三酸甘油脂','Triglyceride','中性脂肪'],
			'HDL': ['HDL','高密度膽固醇','HDL-C'],
			'LDL': ['LDL','低密度膽固醇','LDL-C'],
			'血壓': ['血壓','BP'],
			'血糖': ['血糖','AC Sugar','FPG','Glucose'],
			'脈搏': ['脈搏','心率','Pulse'],
			'Creatinine': ['Creatinine','肌酸酐','肌酐','Cr'],
			'BUN': ['BUN','尿素氮'],
			'尿酸': ['尿酸','Uric Acid'],
			'eGFR': ['eGFR','腎絲球過濾率'],
			'T-Bil': ['T-Bil','總膽紅素','TBil','T Bil','膽紅素'],
			'D-Bil': ['D-Bil','直接膽紅素','DBil','D Bil'],
		  };

		  const stripEnglishParen = s => String(s||'')
			.replace(/[（(]\s*[A-Za-z][A-Za-z.\-\/\s]*\s*[)）]/g, '')
			.trim();
		  const norm = s => String(s||'').toLowerCase().replace(/\s+/g,'');

		  // 用你現有的合併器，確保與解析相同的行序
		  const lines = collapseTableRowsFront(rawText)
			.split(/\r?\n/).map(s => stripEnglishParen(s.trim()));

		  const seen = new Set();
		  const order = [];

		  lines.forEach(line => {
			const L = norm(line);
			Object.keys(data).forEach(k => {
			  if (seen.has(k)) return;
			  const cands = [k].concat(alias[k] || []);
			  for (const c of cands) {
				if (c && L.includes(norm(c))) { order.push(k); seen.add(k); break; }
			  }
			});
		  });

		  // 沒在文件中比對到的欄位，維持原本插入順序接在後面
		  Object.keys(data).forEach(k => { if (!seen.has(k)) order.push(k); });

		  const out = {};
		  order.forEach(k => out[k] = data[k]);
		  return out;
		}


      const isBadVal = (k, v) => {
        const val = String(v ?? '').trim();
        if (!val) return true;

        // 長文本鍵：不做長度與標點限制
        if (longTextKeyReg.test(k)) return false;

        if (/^(cm|kg|mmhg|mg\/dl|bpm|％|%)$/i.test(val)) return true;
        if (/^[\W_]+$/.test(val)) return true;

        // 參考範圍類型：保留（避免被過濾）
        if (/^(參考|正常|範圍|Reference|Ref)/.test(k) || /(參考|正常|上限|下限|範圍)/.test(val)) return false;

        // 純中文段落太長且不像數值，避免塞滿畫面（但仍保留到 200 字）
        if (val.length > 200 && /[\u4e00-\u9fa5]/.test(val)) return true;

        // 範圍值：通常不是「單一欄位值」，過濾掉（有需要可在上面解除）
        if (looksLikeRange(val)) return true;

        return false;
      };

      const withUnitIfNeeded = (k, v) => {
        let val = String(v || '').trim();
        if (/身高/.test(k) && /^\d{2,3}(\.\d+)?$/.test(val)) val += ' cm';
        if (/(體重)/.test(k) && /^\d{1,3}(\.\d+)?$/.test(val)) val += ' kg';
        if (/血壓/.test(k) && /^\d{2,3}\s*\/\s*\d{2,3}$/.test(val)) val = val.replace(/\s*/g,'') + ' mmHg';
        return val;
      };

      for (const [rawK, rawV] of Object.entries(data)) {
        const k = normalizeKey(rawK);
        if (isBadKey(k) || isBadVal(k, rawV)) continue;
        const v = withUnitIfNeeded(k, rawV);
        if (!v) continue;
        out[k] = out[k] && out[k] !== v ? `${out[k]} / ${v}` : v;
      }
      return out;
    }

    /* ====== 預覽 ====== */
    fileInput.addEventListener('change', () => {
      const f = fileInput.files?.[0];
      if (!f) { previewWrap.classList.add('hidden'); return; }
      previewImg.src = URL.createObjectURL(f);
      previewWrap.classList.remove('hidden');
    });

    /* ====== 上傳辨識（流程原樣，僅插入新的解析器 & 放寬清理） ====== */
    btnUpload.addEventListener('click', async ()=>{
      const file = fileInput.files?.[0];
      if (!file){ toast("請先選擇圖片檔案"); return; }

      setStatus("⏳ 上傳並辨識中…", true);
      btnUpload.disabled = true;

      try{
        const fd = new FormData();
        fd.append('image', file);
        const resp = await fetch(OCR_API, { method:'POST', body:fd });
        if (!resp.ok){
          let msg = "辨識失敗";
          try { const e = await resp.json(); if(e?.error) msg += "："+e.error; } catch {}
          throw new Error(msg);
        }
        const result = await resp.json();
        ocrRawText = result.text || "";
        const fieldsSuggested = result.fieldsSuggested || {};

        dynamicData = {};
        // 1) 後端建議值
        for (const [k,v] of Object.entries(fieldsSuggested)){
          if (k && v && (!(k in dynamicData) || String(dynamicData[k]??'').trim()==='')) dynamicData[k]=v;
        }
        // 2) 你原本的 extractHealthData
        const parsed1 = window.extractHealthData(ocrRawText);
        for (const [k,v] of Object.entries(parsed1)){
          if (k && v && (!(k in dynamicData) || String(dynamicData[k]??'').trim()==='')) {
            dynamicData[k] = v;
          }
        }
        // 3) 新的寬鬆解析器
        const parsed2 = parseOCRResultFlexible(ocrRawText);
        for (const [k,v] of Object.entries(parsed2)){
          if (k && v && (!(k in dynamicData) || String(dynamicData[k]??'').trim()==='')) {
            dynamicData[k] = v;
          }
        }

        // 放寬清理
        dynamicData = sanitizeDynamicData(dynamicData);

        if (!Object.keys(dynamicData).length && ocrRawText){
          dynamicData["原始內容"]=ocrRawText;
        }

        if (ocrRawText?.trim()){
          rawTextEl.textContent = ocrRawText;
          rawSection.classList.remove('hidden');
        }else{
          rawSection.classList.add('hidden');
        }

        renderFields();
        setStatus("✅ 完成");
      }catch(err){
        console.error(err);
        setStatus("❌ "+err.message);
      }finally{
        btnUpload.disabled = false;
      }
    });

    /* ====== 原文一鍵轉欄位（加入新解析器，流程不變） ====== */
    btnFillFromRaw.addEventListener('click', ()=>{
      if (!ocrRawText?.trim()){
        toast("尚無原文可轉換。請先上傳圖片或此功能需後端回傳原文。");
        return;
      }
      const parsed1 = window.extractHealthData(ocrRawText);
      for (const [k,v] of Object.entries(parsed1)){
        if (k && v && (!(k in dynamicData) || String(dynamicData[k]??'').trim()==='')) {
          dynamicData[k] = v;
        }
      }
      const parsed2 = parseOCRResultFlexible(ocrRawText);
      for (const [k,v] of Object.entries(parsed2)){
        if (k && v && (!(k in dynamicData) || String(dynamicData[k]??'').trim()==='')) {
          dynamicData[k] = v;
        }
      }
      dynamicData = sanitizeDynamicData(dynamicData);
      renderFields();
      toast("已嘗試從原文提取欄位");
    });

    /* ====== 新增／清除欄位（原樣） ====== */
    btnAdd.addEventListener('click', () => {
      const base = '';
      let i = '';
      let name = `${base}${i}`;
      while (Object.prototype.hasOwnProperty.call(dynamicData, name)) {
        i += 1;
        name = `${base}${i}`;
      }
      dynamicData[name] = '';
      renderFields();
    });
    btnClear.addEventListener('click', ()=>{ dynamicData={}; renderFields(); });

    /* ====== 送出（原樣） ====== */
    btnConfirm.addEventListener('click', async ()=>{
      // 同步尚未 blur 的值
      const rows = fieldsEl.querySelectorAll('.mw-field-row');
      rows.forEach(row=>{
        const k = row.querySelector('[data-k="key"]')?.value?.trim();
        const v = row.querySelector('[data-k="val"]')?.value?.trim();
        if (k) dynamicData[k] = v ?? '';
      });

      // 清空空值
      const dataToSave = {};
      Object.entries(dynamicData).forEach(([k,v])=>{
        if (k && String(v ?? '').trim() !== '') dataToSave[k]=String(v).trim();
      });

      try{
        if (editingId) {
          await db.collection('health_records').doc(editingId).update({
            data: dataToSave,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          alert('✅ 已更新！');
        } else {
          await db.collection("health_records").add({
            userId: (await ensureUserId()),
            date: formattedDate,
            data: dataToSave,
            source: 'liff',
            autoDietPushed: false,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
          alert("✅ 資料成功上傳到 Firebase！");
        }
        localStorage.removeItem('edit_data');
        window.location.href = new URL('/ocr_data1.html', window.location.origin).href;
      }catch(err){
        console.error(err);
        alert("❌ 送出失敗，請查看 Console");
      }
    });

    // LIFF 取得 userId（原樣）
    let currentUserId = null;
    async function ensureUserId(){
      if (currentUserId) return currentUserId;
      const $login = document.getElementById('loginStatus');
      await liff.init({ liffId });
      if (!liff.isLoggedIn()){ $login.textContent = "導向 LINE 登入中…"; liff.login({ redirectUri: location.href }); throw new Error("尚未登入 LIFF"); }
      try{ const p = await liff.getProfile(); currentUserId = p.userId || null; }
      catch(e){ const d = liff.getDecodedIDToken(); currentUserId = d?.sub ?? null; }
      $login.textContent = currentUserId ? "已登入 ✓" : "未取得使用者身分，建議於 LINE 內開啟";
      return currentUserId;
    }

    /* ====== 全域提示（原樣） ====== */
    window.setStatus = function (text, hint = false) {
      if (!statusEl) return;
      statusEl.textContent = text || "";
      statusEl.classList.toggle('hidden', !text);
      statusEl.classList.toggle('mw-hint', !!hint);
    };
    window.toast = function (msg) {
      window.setStatus(msg, true);
      setTimeout(()=> window.setStatus(""), 2200);
    };
  </script>
