<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>健康數據新增</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.3/dist/tesseract.min.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* iOS 避免輸入框放大 */
    @media (max-width:640px){ input,select,textarea{font-size:16px} }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-100 to-blue-50 flex items-center justify-center px-4 py-8">
  <a href="ocr_data1.html"
     class="fixed top-4 left-4 px-4 py-2 bg-gray-200 text-gray-800 rounded-xl shadow hover:bg-gray-300 transition z-50">
    ← 返回
  </a>

  <div class="max-w-4xl w-full bg-white rounded-3xl shadow-2xl p-6 md:p-10 flex flex-col-reverse md:flex-row items-center gap-10">
    <!-- 表單 -->
    <div class="w-full max-w-md">
      <h1 class="text-3xl font-bold text-gray-800 text-center mb-1">健康數據新增</h1>
      <h2 id="date" class="text-center text-indigo-600 text-lg mb-6">日期：--/--</h2>

      <div id="dynamic-fields" class="my-4"></div>

      <!-- 拍照與確認同一排 -->
      <div class="flex gap-4 mt-6">
        <button class="photo-btn flex-1 px-4 py-3 bg-gray-100 text-gray-700 rounded-xl border hover:bg-gray-200 transition">📷 拍照上傳</button>
        <button class="confirm-btn flex-1 px-4 py-3 bg-indigo-500 text-white rounded-xl hover:bg-indigo-600 transition">確認</button>
      </div>
      <input type="file" id="photoInput" accept="image/*" hidden>
    </div>

    <!-- 品牌文字 -->
    <div class="text-center md:text-right">
      <h3 class="text-3xl font-bold text-indigo-800 mb-1">MakeWell</h3>
      <p class="text-lg text-slate-600">慢理歲月，樂活永悅</p>
    </div>
  </div>

<script>
let currentUserId = null;

// ✅ LIFF 初始化（保留）
window.onload = function() {
  liff.init({ liffId: "2007877199-xXoPD8mD" })
    .then(() => {
      if (!liff.isLoggedIn()) {
        liff.login();
      } else {
        liff.getProfile().then(profile => {
          currentUserId = profile.userId;
          console.log("自動取得 userId：", currentUserId);
        });
      }
    })
    .catch(err => { alert("LIFF 初始化失敗：" + err); });
};

// ✅ Firebase（保留）
const firebaseConfig = {
  apiKey: "AIzaSyCCUzxpn1quR9PPSBeZBGG17XVh8vPzjY",
  authDomain: "medwell-test1.firebaseapp.com",
  projectId: "medwell-test1",
  storageBucket: "medwell-test1.appspot.com",
  messagingSenderId: "860851688843",
  appId: "1:860851688843:web:622eb8feccad45ce640b8e",
  measurementId: "G-9FGX9SG7XB"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ===== 動態欄位狀態 =====
let dynamicData = {};
let editId = null;

// 以 dynamicData 重繪畫面
function renderFields() {
  const fieldsDiv = document.getElementById("dynamic-fields");
  fieldsDiv.innerHTML = "";

  // 已有欄位
  Object.entries(dynamicData).forEach(([k, v]) => {
    const row = document.createElement("div");
    row.className = "flex gap-2 items-center mb-2 min-w-0"; // ⭐ 新增 min-w-0 防止溢出
    row.innerHTML = `
      <label class="w-24 shrink-0 text-gray-700 font-medium truncate" title="${k}">${k}：</label>
      <input type="text" data-key="${k}" value="${v ?? ''}" class="flex-1 min-w-0 bg-indigo-50 rounded-xl px-4 py-2 text-gray-800" />
      <button type="button" class="del-btn text-red-500 text-xl px-2" title="刪除欄位">×</button>
    `;
    row.querySelector('.del-btn').onclick = () => {
      delete dynamicData[k];
      renderFields();
    };
    fieldsDiv.appendChild(row);
  });

  // 新增一筆（data20807 風格）：欄位名稱 + 數值 + ＋
  const addRow = document.createElement("div");
  addRow.className = "flex flex-col sm:flex-row gap-2 items-stretch sm:items-center mt-3"; // ⭐ 手機直排
  addRow.innerHTML = `
    <input id="add-key" type="text" placeholder="記錄項目" class="sm:w-24 bg-indigo-50 rounded-xl px-3 py-2 text-gray-800" />
    <input id="add-value" type="text" placeholder="內容或數值" class="flex-1 bg-indigo-50 rounded-xl px-3 py-2 text-gray-800" />
    <button type="button" class="add-btn text-green-700 text-xl px-2 sm:px-3 py-1.5 sm:py-0" title="新增">＋</button>
  `;
  addRow.querySelector(".add-btn").onclick = () => {
    const key = addRow.querySelector("#add-key").value.trim();
    const val = addRow.querySelector("#add-value").value.trim();
    if (!key || !val) return;
    dynamicData[key] = val;
    renderFields();
  };
  fieldsDiv.appendChild(addRow);
}

window.addEventListener("DOMContentLoaded", async () => {
  // 日期顯示
  const dateText = document.getElementById("date");
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  const formattedDate = `${yyyy}/${mm}/${dd}`;
  dateText.textContent = `日期：${formattedDate}`;

  // 編輯模式（保留）
  const params = new URLSearchParams(window.location.search);
  editId = params.get('id');
  if (editId && localStorage.getItem('edit_data')) {
    const saved = JSON.parse(localStorage.getItem('edit_data'));
    dynamicData = saved.data || {};
    localStorage.removeItem('edit_data');
  } else {
    dynamicData = {};
  }
  renderFields();

  // 拍照 -> OCR -> 追加欄位（保留）
  document.querySelector(".photo-btn").addEventListener("click", () => {
    document.getElementById("photoInput").click();
  });

document.getElementById("photoInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append("image", file, "image.jpg");

  try {
    const res = await fetch("https://linebot-o8nr.onrender.com/api/ocr", { method: "POST", body: formData });
    const result = await res.json();
    const text = result.text || "";
    if (!text) { alert("❌ 無法辨識圖片，請重試或更換照片"); return; }

    const parsed = parseOCRResultFlexible(text);

    const before = Object.keys(dynamicData).length;
    Object.entries(parsed).forEach(([k, v]) => {
      if (!(k in dynamicData) || String(dynamicData[k] ?? "").trim() === "") {
        dynamicData[k] = v;
      }
    });

    renderFields();
    const after = Object.keys(dynamicData).length;

    if (after > before) {
      alert("📋 OCR 已辨識並加入欄位！");
    } else {
      alert("⚠️ 有辨識到文字，但沒有解析出『欄位：值』格式；已把全文放在「原始內容」。");
    }
  } catch (err) {
    console.error(err);
    alert("❌ OCR 失敗，請稍後再試");
  }
});


  // 確認儲存（保留）
  document.querySelector(".confirm-btn").addEventListener("click", async () => {
    if (!currentUserId) { alert("userId 尚未取得，請稍後再試或重新登入"); return; }

    const inputs = Array.from(document.querySelectorAll('#dynamic-fields input[data-key]'));
    const dataToSave = {};
    inputs.forEach(input => {
      const k = input.getAttribute('data-key');
      const v = input.value.trim();
      if (k && v) dataToSave[k] = v;
    });

    try {
      if (editId) {
        await db.collection("health_records").doc(editId).update({
          userId: currentUserId,
          date: formattedDate,
          data: dataToSave,
          timestamp: new Date()
        });
        alert("✅ 資料已成功更新！");
      } else {
        await db.collection("health_records").add({
          userId: currentUserId,
          date: formattedDate,
          data: dataToSave,
          timestamp: new Date()
        });
        alert("✅ 資料成功上傳到 Firebase！");
      }
      window.location.href = "ocr_data1.html";
    } catch (err) {
      console.error(err);
      alert("❌ 上傳失敗，請查看 Console");
    }
  });
});

/* === 彈性 OCR 解析（保留） === */
function parseOCRResultFlexible(text) {
  const data = {};
  const lines = text
    .split(/\r?\n/)
    .map(l => l.replace(/\s+/g, ' ').trim())
    .filter(Boolean);

  for (let i = 0; i < lines.length; i++) {
    // 形如「欄位名：值」或「欄位名: 值」——允許中英數符號
    let m = lines[i].match(/^([\u4e00-\u9fa5A-Za-z0-9（）()．\.\-／\/\s]+)[：:]\s*(.+)$/);
    if (m) {
      const key = m[1].trim().replace(/[．。]$/,'');
      const val = m[2].trim();
      if (key && val) data[key] = val;
      continue;
    }
    // 形如上一行是「欄位名：」，下一行是值
    let m2 = lines[i].match(/^([\u4e00-\u9fa5A-Za-z0-9（）()．\.\-／\/\s]+)[：:]$/);
    if (m2 && i + 1 < lines.length) {
      const key = m2[1].trim().replace(/[．。]$/,'');
      const val = lines[i + 1].trim();
      if (key && val) data[key] = val;
      i++;
    }
  }

  // 常見欄位名歸一（可按需要擴充）
  const map = {
    '藥名':'藥名','品名':'藥名','藥品名稱':'藥名',
    '用法':'用法','服法':'用法',
    '用量':'劑量','劑量':'劑量',
    '天數':'天數','日數':'天數',
    '日期':'日期','開立日期':'日期'
  };
  for (const k of Object.keys(data)) {
    const nk = map[k] || k;
    if (nk !== k && !(nk in data)) { data[nk] = data[k]; delete data[k]; }
  }

  // 解析不到任何鍵值 → 退而求其次：整段塞進「原始內容」
  if (Object.keys(data).length === 0 && text.trim()) {
    data['原始內容'] = text.trim();
  }
  return data;
}
</script>
</body>
</html>
