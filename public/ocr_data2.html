<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>健康數據新增 | MakeWell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase & LIFF -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root{
      --mw-green:#588157;
      --mw-green-light:#659963de;
      --mw-warm-gray:#dad7cd;
      --mw-gray:#8e8e8cf2;
      --mw-ink:#363636;
      --mw-border:#cfcfc9;
    }
    html,body{ background: var(--mw-warm-gray); color: var(--mw-ink); font-family: "Noto Sans TC", system-ui, -apple-system, Segoe UI, sans-serif; }
    .mw-header{ background:#fff; border-bottom:1px solid var(--mw-border);}
    .mw-title{ color:var(--mw-green);}
    .mw-sub{ color:var(--mw-gray);}
    .mw-card{ background:#fff; border:1px solid var(--mw-border); border-radius:20px; box-shadow:0 6px 18px rgba(0,0,0,.04); }
    .mw-btn-primary{ background:var(--mw-green); color:#fff; border-radius:12px; padding:.65rem 1rem; font-weight:700; transition:.2s;}
    .mw-btn-ghost{ border:1px solid var(--mw-border); background:#fff; color:#363636; border-radius:12px; padding:.55rem .9rem; }
    .mw-input{ width:100%; border:1px solid var(--mw-border); border-radius:14px; padding:.7rem .9rem; background:#fff; }
    .mw-field-row{ display:grid; grid-template-columns:160px 1fr auto; gap:.6rem; align-items:center; }
    @media (max-width: 767px){ .mw-field-row{ grid-template-columns: 1fr 1fr; } .mw-field-row [data-del]{ grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="mw-header">
    <div class="mx-auto max-w-6xl px-4 py-4 flex items-center gap-4">
      <div style="padding: 10px; text-align: left;">
        <a href="https://medwell-test1.web.app/ocr_data1.html"
           style="display: inline-block; background-color: #588157; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 16px;">
          ← 回主頁
        </a>
      </div>
      <img src="https://medwell-test1.web.app/makewell-logo.png" alt="MakeWell" class="h-10 w-auto select-none" />
      <div class="flex-1">
        <h1 id="pageTitle" class="mw-title text-2xl md:text-3xl font-extrabold">健康數據新增</h1>
        <p class="mw-sub text-sm mt-1">慢理歲月，樂活永悅</p>
      </div>
      <div class="text-xs text-slate-500 hidden md:block" id="loginStatus">LIFF 準備中…</div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6 space-y-6">
    <!-- 上傳卡片 -->
    <section class="mw-card p-4 md:p-6">
      <div class="flex flex-col md:flex-row md:items-end gap-4">
        <div class="flex-1">
          <label class="block text-sm font-semibold mb-1" style="color:var(--mw-green)">選擇圖片 / PDF</label>
          <input id="fileInput"
                 type="file"
                 accept="image/*,application/pdf,.pdf"
                 multiple
                 class="mw-input"
                 placeholder="選擇影像或 PDF（可多檔）">
          <p class="text-xs mt-2" style="color:var(--mw-gray)">僅做 OCR 辨識，請避開反光、傾斜與過度裁切。</p>
        </div>
        <div class="flex gap-2">
          <button id="btnUpload" class="mw-btn-primary">上傳並辨識</button>
        </div>
      </div>

      <!-- 多檔預覽，可滾動 -->
      <div id="previewWrap" class="mt-4 hidden"
           style="background:#f6f6f3; border:1px dashed var(--mw-border); border-radius:16px; padding:.75rem;
                  max-height:60vh; overflow:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;">
        <p class="text-sm mb-2" style="color:var(--mw-gray)">預覽</p>
        <div id="previewList" class="space-y-3"></div>
      </div>

      <div id="status" class="mt-3 text-sm hidden"></div>
    </section>

    <!-- 辨識結果 -->
    <section class="mw-card p-4 md:p-6">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <div>
          <h2 class="text-xl font-bold" style="color:var(--mw-green)">辨識結果（可編輯）</h2>
          <p class="text-xs mt-1" style="color:var(--mw-gray)">日期：<span id="date"></span></p>
        </div>
        <div class="flex gap-2">
          <button id="btnAdd" class="mw-btn-ghost">＋ 新增欄位</button>
          <button id="btnClear" class="mw-btn-ghost">清除全部欄位</button>
          <button id="btnPretty" class="mw-btn-ghost">閱讀模式</button>
          <button id="btnConfirm" class="mw-btn-primary">確認</button>
        </div>
      </div>

      <div id="fields" class="mt-4 space-y-2">
        <div class="text-sm" style="color:var(--mw-gray)">尚未有資料，請先上傳圖片／PDF 辨識，或點「＋ 新增欄位」。</div>
      </div>

      <!-- 友善閱讀模式 -->
      <div id="prettyView" class="mt-4 hidden">
        <div class="text-sm" style="color:var(--mw-gray)">（閱讀模式）</div>
        <div id="prettyList" class="mt-2 space-y-2"></div>
      </div>
    </section>
  </main>

  <!-- 仍沿用你現有的字典解析器（若有） -->
  <script src="https://medwell-test1.web.app/extractHealthData.js"></script>

  <script>
    /* ====== 基本設定 ====== */
    const liffId = "2007877199-xXoPD8mD";
    const firebaseConfig = {
      apiKey: "AIzaSyCCUzxpn1quR9PPSBeZBGG17XVh8vPzjY",
      authDomain: "medwell-test1.firebaseapp.com",
      projectId: "medwell-test1",
      storageBucket: "medwell-test1.appspot.com",
      messagingSenderId: "860851688843",
      appId: "1:860851688843:web:622eb8feccad45ce640b8e",
      measurementId: "G-9FGX9SG7XB"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const OCR_API = "https://linebot-o8nr.onrender.com/api/ocr";

    /* ====== DOM ====== */
    const fileInput = document.getElementById('fileInput');
    const btnUpload = document.getElementById('btnUpload');
    const btnAdd = document.getElementById('btnAdd');
    const btnClear = document.getElementById('btnClear');
    const btnPretty = document.getElementById('btnPretty');
    const btnConfirm = document.getElementById('btnConfirm');
    const fieldsEl = document.getElementById('fields');
    const statusEl = document.getElementById('status');
    const previewWrap = document.getElementById('previewWrap');
    const pageTitle = document.getElementById('pageTitle');
    const loginStatus = document.getElementById('loginStatus');

    /* ====== 狀態 ====== */
    let dynamicData = {};
    let ocrRawText = ""; // 只用於解析，不顯示
    let formattedDate = "";
    let editingId = null;
    let originalDoc = null;

    // 日期顯示
    (function(){
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const dd = String(d.getDate()).padStart(2,'0');
      formattedDate = `${yyyy}/${mm}/${dd}`;
      document.getElementById('date').textContent = formattedDate;
    })();

    /* ====== 編輯模式 ====== */
    (function(){
      const id = new URL(location.href).searchParams.get('id');
      if (!id) { localStorage.removeItem('edit_data'); editingId = null; originalDoc = null; }
    })();
    function getQueryId(){ try { return new URL(location.href).searchParams.get('id'); } catch { return null; } }

    async function loadEditIfAny() {
      editingId = getQueryId();
      if (editingId) {
        const snap = await db.collection('health_records').doc(editingId).get();
        if (snap.exists) {
          originalDoc = snap.data() || {};
          dynamicData = { ...(originalDoc.data || {}) };
          if (Array.isArray(originalDoc.orderKeys) && originalDoc.orderKeys.length) {
            const ordered = {};
            originalDoc.orderKeys.forEach(k => { if (k in dynamicData) ordered[k]=dynamicData[k]; });
            Object.keys(dynamicData).forEach(k => { if (!(k in ordered)) ordered[k]=dynamicData[k]; });
            dynamicData = ordered;
          }
          if (originalDoc.date) formattedDate = originalDoc.date;
          document.getElementById('date').textContent = formattedDate;
          pageTitle.textContent = '健康數據編輯';
          renderFields(); renderPretty();
          return;
        }
      }
      const cached = localStorage.getItem('edit_data');
      if (cached) {
        try {
          const obj = JSON.parse(cached);
          editingId = obj._id || null;
          dynamicData = { ...(obj.data || {}) };
          if (obj.date) formattedDate = obj.date;
          document.getElementById('date').textContent = formattedDate;
          pageTitle.textContent = '健康數據編輯';
          renderFields(); renderPretty();
        } catch {}
      }
    }
    loadEditIfAny();

    /* ====== LIFF ====== */
    async function initLIFF() {
      const $ = (t) => loginStatus && (loginStatus.textContent = t);
      try {
        await liff.init({ liffId });
        if (liff.isLoggedIn()) {
          try { const p = await liff.getProfile(); $(p?.displayName ? `已登入 ✓（${p.displayName}）` : '已登入 ✓'); }
          catch { $('已登入 ✓'); }
        } else {
          loginStatus.innerHTML = '未登入（點我登入）';
          loginStatus.style.cursor = 'pointer';
          loginStatus.onclick = () => liff.login({ redirectUri: location.href });
        }
      } catch (e) { console.error('LIFF 初始化失敗：', e); $('LIFF 初始化失敗'); }
    }
    document.addEventListener('DOMContentLoaded', initLIFF);

    /* ====== 欄位渲染（維持兩欄編輯） ====== */
    function renderFields(){
      const pretty = document.getElementById('prettyView');
      const prettyIsOpen = pretty && !pretty.classList.contains('hidden');

      fieldsEl.innerHTML = "";
      const keys = Object.keys(dynamicData);
      if (!keys.length){
        fieldsEl.innerHTML = '<div class="text-sm" style="color:var(--mw-gray)">尚未有資料，請先上傳圖片／PDF 辨識，或點「＋ 新增欄位」。</div>';
        if (prettyIsOpen) renderPretty();
        return;
      }
      keys.forEach((k)=>{
        const row = document.createElement('div');
        row.className = "mw-field-row ";

        const keyVal = (k || "").trim();
        const valVal = String(dynamicData[k] ?? "").trim();
        const keyAttr = keyVal ? `value="${keyVal.replace(/"/g,'&quot;')}"` : "";
        const valAttr = valVal ? `value="${valVal.replace(/"/g,'&quot;')}"` : "";

        row.innerHTML = `
          <input class="mw-input" data-k="key" ${keyAttr} placeholder="名稱（如 血壓）">
          <input class="mw-input" data-k="val" ${valAttr} placeholder="值（如 120/80 mmHg）">
          <button class="mw-btn-ghost" data-del>刪除</button>
        `;

        row.querySelector('[data-del]').onclick = ()=>{ delete dynamicData[k]; renderFields(); };
        const keyInput = row.querySelector('[data-k="key"]');
        const valInput = row.querySelector('[data-k="val"]');
        keyInput.addEventListener('change', ()=>{
          const nk = keyInput.value.trim();
          const v = valInput.value.trim();
          delete dynamicData[k];
          if (nk) dynamicData[nk] = v;
          renderFields();
        });
        valInput.addEventListener('change', ()=>{
          const nk = keyInput.value.trim();
          if (nk) dynamicData[nk] = valInput.value.trim();
          // 若正在閱讀模式，同步更新
          const prettyOpen = document.getElementById('prettyView') && !document.getElementById('prettyView').classList.contains('hidden');
          if (prettyOpen) renderPretty();
        });

        fieldsEl.appendChild(row);
      });

      // 若閱讀模式開啟，重繪
      if (prettyIsOpen) renderPretty();
    }

    /* ====== 友善閱讀：合併 + 判讀 ====== */
    const KEY_ALIAS = {
      '身高':'身高', '身高 172 cm':'身高',
      '體重':'體重', '體重 82 kg':'體重',
      '血壓':'血壓',
      '脈搏':'脈搏', '心率':'脈搏',
      '血糖':'血糖', 'AC Sugar':'血糖', 'FPG':'血糖',
      '總膽固醇':'總膽固醇','Cholesterol':'總膽固醇',
      '三酸甘油脂':'三酸甘油脂','Triglyceride':'三酸甘油脂',
      'HDL':'HDL','HDL-C':'HDL',
      'LDL':'LDL','LDL-C':'LDL'
    };
    const REF = {
      '脈搏':      {unit:'bpm',  min:60,  max:100},
      '血糖':      {unit:'mg/dL',min:70,  max:100},
      '總膽固醇':  {unit:'mg/dL',max:200},
      '三酸甘油脂':{unit:'mg/dL',max:150},
      'HDL':       {unit:'mg/dL',min:40},
      'LDL':       {unit:'mg/dL',max:130}
    };
    function parseValueNum(s){
      if (!s) return null;
      const mm = String(s).match(/^([<>]=?)?\s*(\d+(?:\.\d+)?)(?:\s*\/\s*(\d+(?:\.\d+)?))?/);
      if (!mm) return null;
      return {op:mm[1]||'=', a:parseFloat(mm[2]), b:mm[3]?parseFloat(mm[3]):null};
    }
    function extractUnit(s){
      const m = String(s).match(/\b(mg\/dL|mmHg|bpm|cm|kg|g\/dL|%)\b/i);
      return m ? m[1].replace(/dl/i,'dL') : null;
    }
    function compressClinicalPairs(obj){
      const out = {};
      for (const [kRaw, vRaw] of Object.entries(obj)){
        const key = KEY_ALIAS[kRaw] || kRaw;
        const val = String(vRaw||'').trim();
        const looksRange = /^(\d+(\.\d+)?)\s*[-~～]\s*(\d+(\.\d+)?)/.test(val) || /^([<>]=?)\s*\d+/.test(val);
        const looksBp    = /^\d{2,3}\s*\/\s*\d{2,3}/.test(val);

        if (!out[key]) out[key] = { key, value:null, unit:null, refText:null };

        if (looksBp && key.includes('血壓')){
          out[key].value = val;
          out[key].unit  = 'mmHg';
        } else if (looksRange){
          out[key].refText = val;
          if (!out[key].unit) out[key].unit = extractUnit(val);
        } else {
          out[key].value = val;
          const u = extractUnit(val);
          if (u) out[key].unit = u;
        }
      }
      Object.values(out).forEach(row=>{
        row.status = 'unknown';
        const rule = REF[row.key];
        if (row.key.includes('血壓') && row.value){
          const mm = row.value.match(/(\d{2,3})\s*\/\s*(\d{2,3})/);
          if (mm){
            const sys = parseFloat(mm[1]), dia = parseFloat(mm[2]);
            if (sys>=140 || dia>=90) row.status='high';
            else if (sys<90 || dia<60) row.status='low';
            else row.status='normal';
          }
          return;
        }
        if (rule && row.value){
          const pv = parseValueNum(row.value);
          if (!pv) return;
          if (rule.min!=null && pv.a<rule.min) row.status='low';
          else if (rule.max!=null && pv.a>rule.max) row.status='high';
          else row.status='normal';
          if (!row.unit && rule.unit) row.unit = rule.unit;
        }
      });
      return Object.values(out);
    }
    function badge(status){
      const map = {
        normal: 'bg-green-100 text-green-700',
        high:   'bg-red-100 text-red-700',
        low:    'bg-yellow-100 text-yellow-800',
        unknown:'bg-slate-100 text-slate-700'
      };
      const text = {normal:'正常', high:'偏高', low:'偏低', unknown:'—'}[status] || '—';
      return `<span class="px-2 py-0.5 rounded text-xs ${map[status]||map.unknown}">${text}</span>`;
    }
    function renderPretty(){
      const wrap = document.getElementById('prettyView');
      const list = document.getElementById('prettyList');
      if (!wrap || !list) return;
      list.innerHTML = '';
      const rows = compressClinicalPairs(dynamicData);
      if (!rows.length){ wrap.classList.add('hidden'); return; }
      wrap.classList.remove('hidden');

      rows.forEach(r=>{
        const unit = r.unit ? ` ${r.unit}` : '';
        const ref  = r.refText ? `<div class="text-xs text-slate-500">參考：${r.refText}</div>` : '';
        const html = `
          <div class="flex items-start justify-between gap-2 border border-[var(--mw-border)] bg-white rounded-xl px-3 py-2">
            <div>
              <div class="text-sm font-semibold">${r.key}</div>
              <div class="text-base mt-0.5">
                <span class="font-bold">${r.value || '—'}</span><span class="text-slate-500">${unit}</span>
              </div>
              ${ref}
            </div>
            <div class="mt-1">${badge(r.status)}</div>
          </div>`;
        const item = document.createElement('div');
        item.innerHTML = html;
        list.appendChild(item.firstElementChild);
      });
    }

    /* ====== 多檔預覽 ====== */
    fileInput.addEventListener('change', () => {
      const files = Array.from(fileInput.files || []);
      const list = document.getElementById('previewList');
      if (!list) return;

      list.innerHTML = '';
      if (!files.length) { previewWrap.classList.add('hidden'); return; }

      files.forEach(f => {
        const item = document.createElement('div');
        item.className = 'border border-[var(--mw-border)] rounded-md bg-white p-1';

        if (f.type.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = URL.createObjectURL(f);
          img.className = 'w-full h-auto block';
          img.onload = () => URL.revokeObjectURL(img.src);
          item.appendChild(img);
        } else if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) {
          const embed = document.createElement('embed');
          embed.src = URL.createObjectURL(f);
          embed.type = 'application/pdf';
          embed.className = 'w-full h-80 block';
          item.appendChild(embed);

          const a = document.createElement('a');
          a.href = embed.src; a.target = '_blank';
          a.className = 'text-sm underline mt-1 inline-block';
          a.textContent = '在新分頁開啟 PDF';
          item.appendChild(a);
        }

        const cap = document.createElement('div');
        cap.className = 'text-xs text-slate-600 mt-1 break-all';
        cap.textContent = f.name;
        item.appendChild(cap);

        list.appendChild(item);
      });

      previewWrap.classList.remove('hidden');
      setStatus(`已選 ${files.length} 檔`, true);
    });

    /* ====== 上傳辨識（多檔含 PDF）＋ 敏感欄位過濾（你前一版的邏輯保留） ====== */
    btnUpload.addEventListener('click', async ()=>{
      const files = Array.from(fileInput.files || []);
      if (!files.length){ toast("請先選擇檔案（可多檔）"); return; }

      setStatus("⏳ 上傳並辨識中…", true);
      btnUpload.disabled = true;

      try {
        function normalizeText(s=''){
          return String(s || '')
            .normalize('NFKC')
            .replace(/[()（）\[\]{}]/g,' ')
            .replace(/[：:|｜/、,，;；\\]/g,' ')
            .replace(/\s+/g,' ')
            .trim()
            .toLowerCase();
        }
        const SENSITIVE_HEADERS = new Set([
          '基本資料','個人資料','患者資料','健檢報告','健康報告','健康數據',
          '項目','數值','單位','參考範圍','參考值','檢查日期','檢查時間',
          'report date','collection date','specimen','accession number','specimen number'
        ].map(normalizeText));
        const SENSITIVE_TOKENS = new Set([
          '姓名','性別','年齡','身分證','身份證','id','idno','id number',
          '病歷號碼','mrn','chart no','patient id','患者','住址','地址',
          '電話','手機','phone','mobile','緊急連絡人','emergency contact',
          '報告日期','收件日期','檢體編號'
        ].map(normalizeText));
        const looksLikeDate   = s => /^\d{4}[\/\-\.年]\d{1,2}([\/\-\.月]\d{1,2})?([日])?$/.test(s);
        const looksLikeId     = s => /^[a-z]\d{9}$/i.test(s);
        const looksLikePhone  = s => /^0\d{1,2}-?\d{6,8}$/.test(s) || /^09\d{2}-?\d{3}-?\d{3}$/.test(s);
        const looksDivider    = s => /^[<>\-_.=＋*~─—]+$/.test(s);
        function isSensitiveKey(k=''){
          const nk = normalizeText(k);
          if (!nk) return true;
          if (SENSITIVE_HEADERS.has(nk) || SENSITIVE_TOKENS.has(nk)) return true;
          if (looksDivider(nk)) return true;
          if (nk.includes('基本資料')) return true;
          const parts = nk.split(' ').filter(Boolean);
          if (parts.some(p => SENSITIVE_HEADERS.has(p) || SENSITIVE_TOKENS.has(p))) return true;
          return false;
        }
        function isSensitiveValue(v=''){
          const nv = normalizeText(v);
          if (!nv) return false;
          if (SENSITIVE_HEADERS.has(nv)) return true;
          if (looksDivider(nv)) return true;
          if (looksLikeDate(nv) || looksLikeId(nv) || looksLikePhone(nv)) return true;
          for (const t of SENSITIVE_TOKENS){ if (nv.includes(t)) return true; }
          if (nv.includes('基本資料')) return true;
          return false;
        }
        function mergeFields(source){
          for (const [k,v] of Object.entries(source || {})){
            if (isSensitiveKey(k)) continue;
            const val = String(v ?? '').trim();
            if (isSensitiveValue(val)) continue;
            if (k && val && (!(k in dynamicData) || String(dynamicData[k]??'').trim()==='')){
              dynamicData[k] = val;
            }
          }
        }

        dynamicData = {};
        ocrRawText = "";
        let handled = 0, failCount = 0;

        for (const f of files){
          const fd = new FormData();
          fd.append('image', f, f.name);
          try{
            const resp = await fetch(OCR_API, { method:'POST', body:fd });
            if (!resp.ok){ failCount++; continue; }
            const result = await resp.json();
            const text = result.text || "";
            const sug  = result.fieldsSuggested || {};
            ocrRawText += (ocrRawText ? "\n" : "") + text;
            mergeFields(sug);
            if (window.extractHealthData) mergeFields(window.extractHealthData(text));
            mergeFields(parseOCRResultFlexible(text));
            handled++;
            setStatus(`處理中…(${handled}/${files.length})`, true);
          }catch(e){
            console.warn('OCR 例外（略過）:', f?.name, e);
            failCount++;
          }
        }

        for (const [k,v] of Object.entries({...dynamicData})){
          if (isSensitiveKey(k) || isSensitiveValue(v)) {
            delete dynamicData[k];
          }
        }

        dynamicData = sortByDocOrder(dynamicData, ocrRawText);
        renderFields();
        setStatus(failCount ? `✅ 完成（${files.length - failCount}/${files.length} 檔）` : "✅ 完成");
        renderPretty(); // ← 上傳完成後顯示友善閱讀
      } catch(err){
        console.error(err);
        setStatus("❌ " + err.message);
      } finally {
        btnUpload.disabled = false;
      }
    });

    /* ====== 新增／清除欄位 ====== */
    btnAdd.addEventListener('click', () => {
      const base = '';
      let i = '';
      let name = `${base}${i}`;
      while (Object.prototype.hasOwnProperty.call(dynamicData, name)) { i += 1; name = `${base}${i}`; }
      dynamicData[name] = '';
      renderFields();
    });
    btnClear.addEventListener('click', ()=>{ dynamicData={}; renderFields(); renderPretty(); });

    /* ====== 送出（儲存欄位順序） ====== */
    btnConfirm.addEventListener('click', async ()=>{
      const rows = fieldsEl.querySelectorAll('.mw-field-row');
      rows.forEach(row=>{
        const k = row.querySelector('[data-k="key"]')?.value?.trim();
        const v = row.querySelector('[data-k="val"]')?.value?.trim();
        if (k) dynamicData[k] = v ?? '';
      });

      const dataToSave = {};
      Object.entries(dynamicData).forEach(([k,v])=>{
        if (k && String(v ?? '').trim() !== '') dataToSave[k]=String(v).trim();
      });
      const orderedKeys = Object.keys(dataToSave);

      try{
        if (editingId) {
          await db.collection('health_records').doc(editingId).update({
            data: dataToSave,
            orderKeys: orderedKeys,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          alert('✅ 已更新！');
        } else {
          await db.collection("health_records").add({
            userId: (await ensureUserId()),
            date: formattedDate,
            data: dataToSave,
            orderKeys: orderedKeys,
            source: 'liff',
            autoDietPushed: false,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
          alert("✅ 資料成功上傳到 Firebase！");
        }
        localStorage.removeItem('edit_data');
        window.location.href = new URL('/ocr_data1.html', window.location.origin).href;
      }catch(err){
        console.error(err);
        alert("❌ 送出失敗，請查看 Console");
      }
    });

    // 閱讀模式切換
		btnPretty.addEventListener('click', ()=>{
		  const pretty = document.getElementById('prettyView');
		  const fields = document.getElementById('fields');

		  if (pretty.classList.contains('hidden')) {
			// 切到閱讀模式
			renderPretty();
			fields.classList.add('hidden');
			pretty.classList.remove('hidden');
			btnPretty.textContent = '編輯模式';
		  } else {
			// 切回編輯模式
			fields.classList.remove('hidden');
			pretty.classList.add('hidden');
			btnPretty.textContent = '閱讀模式';
		  }
		});


    // LIFF 取得 userId
    let currentUserId = null;
    async function ensureUserId(){
      if (currentUserId) return currentUserId;
      const $login = document.getElementById('loginStatus');
      await liff.init({ liffId });
      if (!liff.isLoggedIn()){ $login.textContent = "導向 LINE 登入中…"; liff.login({ redirectUri: location.href }); throw new Error("尚未登入 LIFF"); }
      try{ const p = await liff.getProfile(); currentUserId = p.userId || null; }
      catch(e){ const d = liff.getDecodedIDToken(); currentUserId = d?.sub ?? null; }
      $login.textContent = currentUserId ? "已登入 ✓" : "未取得使用者身分，建議於 LINE 內開啟";
      return currentUserId;
    }

    /* ====== OCR 輔助（你原本就有） ====== */
    function normalizeUnitFront(s = '') {
      return (s || '')
        .replace(/mg\/?dl/gi, 'mg/dL')
        .replace(/g\/?dl/gi, 'g/dL')
        .replace(/mmhg/gi, 'mmHg')
        .replace(/\/min/gi, 'bpm')
        .replace(/\bkg\b/gi, 'kg')
        .replace(/\bcm\b/gi, 'cm')
        .replace(/度c|c度/gi, '°C');
    }
    function collapseTableRowsFront(rawText) {
      const lines = (rawText || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const merged = [];
      const isNameLike = (t) => /^(總膽固醇|血清總膽固醇|血清膽固醇|三酸甘油|三酸甘油脂|中性脂肪|HDL|LDL|Cholesterol|Triglyceride|HDL\s*Cholesterol|LDL\s*Cholesterol|血壓|脈搏|心率|血糖|BMI|身高|體重|尿蛋白|尿糖|血小板|白血球|紅血球|HbA1c|CRP|TSH|T3|T4|Ferritin|Vitamin\s*D|鈣|鈉|鉀|氯|膽紅素|AST|ALT|GOT|GPT|ALP|GGT|eGFR|Creatinine|BUN|尿酸|MCV|MCH|MCHC|Hct|HGB)/i.test(t);
      const isValueLike = (s) => /^([<>]?\s*\d+(?:\.\d+)?(?:\s*-\s*\d+(?:\.\d+)?)?|(?:\d{2,3}\s*\/\s*\d{2,3}))$/i.test(String(s || ''));
      const isRefLike   = (s) => /^[<>]\s*\d+(?:\.\d+)?|\d+\s*[-~～]\s*\d+(?:\.\d+)$/i.test(String(s || ''));
      const isUnitLike  = (s) => /^(mg\/?d[l1I]|mmol\/?L|mmHg|bpm|%|°C|cm|kg|g\/?d[l1I]|10\^9\/L|10\^6\/µL)$/i.test(String(s || ''));

      for (let i = 0; i < lines.length; i++) {
        const a = lines[i];
        if (isNameLike(a)) {
          let val = '', ref = '', unit = '';
          if (i + 1 < lines.length && isValueLike(lines[i + 1])) { val  = lines[++i]; }
          if (i + 1 < lines.length && isRefLike(lines[i + 1]))   { ref  = lines[++i]; }
          if (i + 1 < lines.length && isUnitLike(lines[i + 1]))  { unit = lines[++i]; }
          const oneLine = [a, val, ref, unit].filter(Boolean).join(' ');
          merged.push(normalizeUnitFront(oneLine));
        } else {
          merged.push(normalizeUnitFront(a));
        }
      }
      return merged.join('\n');
    }
    function parseOCRResultFlexible(text){
      const result = {};
      if (!text) return result;

      const pre   = collapseTableRowsFront(text);
      const lines = pre.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);

      const isAliasParen = (s='') => /^\(?\s*[A-Za-z][A-Za-z.\-\/\s]*\s*\)?$/.test(String(s||''));
      const stripEnglishParen = (s='') => String(s||'').replace(/[（(]\s*[A-Za-z][A-Za-z.\-\/\s]*\s*[)）]/g, '').trim();

      const keyValRegex1 = /^(.{1,60}?)[：:]\s*(.+)$/;
      const keyValRegex2 = /^(.{1,60}?)\s{2,}(.{1,120})$/;

      const normalizeMap = {
        '心率':'脈搏','高密度膽固醇':'HDL','低密度膽固醇':'LDL',
        '血紅素':'血色素(Hb)','血色素':'血色素(Hb)',
        '白血球':'白血球(WBC)','紅血球':'紅血球(RBC)','血小板':'血小板(PLT)',
        'HbA1c':'糖化血色素(HbA1c)','GOT':'AST','GPT':'ALT','T Bil':'T-Bil','D Bil':'D-Bil',
        '維生素D':'Vitamin D','非HDL':'非HDL膽固醇',
        '血清膽固醇':'總膽固醇','血清總膽固醇':'總膽固醇',
        'AST':'天門冬胺酸轉胺酶','S.G.O.T':'天門冬胺酸轉胺酶','S.G.O.T(AST)':'天門冬胺酸轉胺酶',
        'ALT':'丙胺酸轉胺酶','S.G.P.T':'丙胺酸轉胺酶','S.G.P.T(ALT)':'丙胺酸轉胺酶',
        'GGT':'γ-穀胱甘肽轉移酶','r-GTP':'γ-穀胱甘肽轉移酶','r-GTP(GGT)':'γ-穀胱甘肽轉移酶'
      };
      const nk = k => (normalizeMap[k] || k);

      for (let i = 0; i < lines.length; i++){
        const line = lines[i];

        let m = line.match(keyValRegex1) || line.match(keyValRegex2);
        if (m){
          const rawKey = (m[1] || '').trim();
          const key = nk(stripEnglishParen(rawKey));
          let val = normalizeUnitFront((m[2] || '').trim());

          if (isAliasParen(val)) {
            if (i + 1 < lines.length) {
              val = normalizeUnitFront(lines[++i].trim());
            } else { continue; }
          }

          if (key) {
            if (!(key in result) || String(result[key]??'').trim()==='') result[key] = val;
          }
          continue;
        }

        const looksLikeValueToken = (s='') =>
          /^[<>≤≥]?\s*\d+(?:\.\d+)?(?:\s*[-~～]\s*\d+(?:\.\d+)?)?(?:\s*\/\s*\d+(?:\.\d+)?)?$/.test(String(s||''));

        if (line && i + 1 < lines.length) {
          const key = nk(stripEnglishParen(line));
          const next = lines[i + 1].trim();
          if (/[:：]\s*$/.test(next)) continue;
          if (looksLikeValueToken(key)) continue;

          if (key && next) {
            result[key] = normalizeUnitFront(next);
            i++;
            continue;
          }
        }
      }
      return result;
    }

    function sortByDocOrder(data, rawText){
      if (!rawText) return data;
      const alias = {
        '天門冬胺酸轉胺酶': ['天門冬胺酸轉胺酶','AST','GOT','S.G.O.T','S.G.O.T(AST)'],
        '丙胺酸轉胺酶': ['丙胺酸轉胺酶','ALT','GPT','S.G.P.T','S.G.P.T(ALT)'],
        'γ-穀胱胺肽轉移酶': ['γ-穀胱甘肽轉移酶','GGT','r-GTP','r-GTP(GGT)'],
        '總膽固醇': ['總膽固醇','血清膽固醇','血清總膽固醇','Cholesterol'],
        '三酸甘油脂': ['三酸甘油脂','Triglyceride','中性脂肪'],
        'HDL': ['HDL','高密度膽固醇','HDL-C'],
        'LDL': ['LDL','低密度膽固醇','LDL-C'],
        '血壓': ['血壓','BP'],
        '血糖': ['血糖','AC Sugar','FPG','Glucose'],
        '脈搏': ['脈搏','心率','Pulse'],
        'Creatinine': ['Creatinine','肌酸酐','肌酐','Cr'],
        'BUN': ['BUN','尿素氮'],
        '尿酸': ['尿酸','Uric Acid'],
        'eGFR': ['eGFR','腎絲球過濾率'],
        'T-Bil': ['T-Bil','總膽紅素','TBil','T Bil','膽紅素'],
        'D-Bil': ['D-Bil','直接膽紅素','DBil','D Bil'],
      };
      const stripEnglishParen = s => String(s||'').replace(/[（(]\s*[A-Za-z][A-Za-z.\-\/\s]*\s*[)）]/g, '').trim();
      const norm = s => String(s||'').toLowerCase().replace(/\s+/g,'');
      const lines = collapseTableRowsFront(rawText).split(/\r?\n/).map(s => stripEnglishParen(s.trim()));
      const seen = new Set(), order = [];
      lines.forEach(line => {
        const L = norm(line);
        Object.keys(data).forEach(k => {
          if (seen.has(k)) return;
          const cands = [k].concat(alias[k] || []);
          for (const c of cands) {
            if (c && L.includes(norm(c))) { order.push(k); seen.add(k); break; }
          }
        });
      });
      Object.keys(data).forEach(k => { if (!seen.has(k)) order.push(k); });
      const out = {}; order.forEach(k => out[k] = data[k]);
      return out;
    }

    /* ====== 全域提示 ====== */
    window.setStatus = function (text, hint = false) {
      if (!statusEl) return;
      statusEl.textContent = text || "";
      statusEl.classList.toggle('hidden', !text);
      statusEl.classList.toggle('mw-hint', !!hint);
    };
    window.toast = function (msg) {
      window.setStatus(msg, true);
      setTimeout(()=> window.setStatus(""), 2200);
    };
  </script>
