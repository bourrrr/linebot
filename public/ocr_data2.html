<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>健康數據新增</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div class="max-w-3xl mx-auto p-4 md:p-6">
    <h1 class="text-2xl md:text-3xl font-bold text-indigo-800 mb-4">健康數據新增</h1>

    <!-- 上傳卡片 -->
    <div class="bg-white rounded-2xl shadow p-4 md:p-6 mb-6">
      <div class="flex flex-col md:flex-row md:items-center gap-4">
        <div class="flex-1">
          <label class="block text-sm text-slate-600 mb-1">選擇圖片 / 拍照</label>
          <input id="fileInput" type="file" accept="image/*" capture="environment"
                 class="block w-full text-sm text-slate-700 file:mr-4 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"/>
        </div>
        <button id="btnUpload"
                class="px-4 py-2 rounded-xl bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-50">
          上傳辨識
        </button>
      </div>

      <!-- 圖片預覽 -->
      <div id="previewWrap" class="mt-4 hidden">
        <p class="text-sm text-slate-600 mb-2">預覽</p>
        <img id="previewImg" class="w-full max-h-80 object-contain rounded-xl border"/>
      </div>

      <!-- 狀態列 -->
      <div id="status" class="mt-3 text-sm text-slate-600"></div>
    </div>

    <!-- 欄位區 -->
    <div class="bg-white rounded-2xl shadow p-4 md:p-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xl font-semibold text-slate-800">辨識結果（可編輯）</h2>
        <div class="flex gap-2">
          <button id="btnAdd"
                  class="px-3 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-50">＋ 新增欄位</button>
          <button id="btnClear"
                  class="px-3 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-50">清除欄位</button>
          <button id="btnConfirm"
                  class="px-3 py-1.5 rounded-xl bg-emerald-600 text-white hover:bg-emerald-700">確認</button>
        </div>
      </div>

      <!-- 日期 -->
      <div class="text-sm text-slate-600 mb-4">
        <span id="date"></span>
      </div>

      <!-- 欄位列表 -->
      <div id="fields" class="space-y-2">
        <div class="text-slate-500 text-sm">尚未有資料，請先上傳圖片辨識，或點「＋ 新增欄位」。</div>
      </div>
    </div>

    <!-- 原文備查 -->
    <div id="rawBlock" class="bg-white rounded-2xl shadow p-4 md:p-6 mt-6 hidden">
      <h3 class="text-lg font-semibold text-slate-800 mb-2">原始內容（備查）</h3>
      <pre id="rawText" class="whitespace-pre-wrap text-sm bg-slate-50 border rounded-xl p-3"></pre>
    </div>
  </div>

  <script>
  // 後端 OCR API（用你的 Render 網域）
const OCR_API = "https://linebot-o8nr.onrender.com/api/ocr";

    // ====== 狀態與工具 ======
    const fileInput = document.getElementById('fileInput');
    const btnUpload = document.getElementById('btnUpload');
    const btnAdd = document.getElementById('btnAdd');
    const btnClear = document.getElementById('btnClear');
    const btnConfirm = document.getElementById('btnConfirm');
    const statusEl = document.getElementById('status');
    const fieldsEl = document.getElementById('fields');
    const previewWrap = document.getElementById('previewWrap');
    const previewImg = document.getElementById('previewImg');
    const rawBlock = document.getElementById('rawBlock');
    const rawTextEl = document.getElementById('rawText');

    // 當前欄位（動態）
    let dynamicData = {};     // { key: value }
    let ocrRawText = "";      // 後端回傳的 text
    let fieldsSuggested = {}; // 後端已解析欄位

    // 日期顯示
    (function setToday(){
      const dateText = document.getElementById("date");
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const dd = String(d.getDate()).padStart(2,'0');
      dateText.textContent = `日期：${yyyy}/${mm}/${dd}`;
    })();

    // 預覽
    fileInput.addEventListener('change', () => {
      const f = fileInput.files?.[0];
      if (!f) { previewWrap.classList.add('hidden'); return; }
      const url = URL.createObjectURL(f);
      previewImg.src = url;
      previewWrap.classList.remove('hidden');
    });

    // ====== 鍵名歸一化：避免同義重複（中英） ======
    const keyAliasMap = {
      '高密度膽固醇': 'HDL',
      '低密度膽固醇': 'LDL',
      '總膽固醇': '總膽固醇',
      '三酸甘油脂': '三酸甘油脂',
      '血糖': '血糖',
      '血糖(空腹)': '血糖(空腹)',
      '血糖(飯後)': '血糖(飯後)',
      '脈搏': '脈搏',
      '心率': '脈搏',
      '血氧': '血氧',
      '體溫': '體溫',
      '體重': '體重',
      '身高': '身高',
      'BMI': 'BMI',
      '腰圍': '腰圍',
      '體脂': '體脂',
      'GOT(AST)': 'GOT(AST)',
      'GPT(ALT)': 'GPT(ALT)',
      '尿酸': '尿酸',
      'BUN': 'BUN',
      'Creatinine': 'Creatinine',
      'eGFR': 'eGFR',
      // 需要再補可加在這裡
    };
    function normalizeKey(k){ return keyAliasMap[k] || k; }

    // ====== 解析「欄位: 值」的彈性補強 ======
    function parseOCRResultFlexible(text) {
      const result = {};
      if (!text) return result;
      // 只抓看起來像「欄位: 值」或「欄位 值」
      const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      for (const line of lines) {
        // 先用冒號
        let m = line.match(/^(.{1,30}?)[：:]\s*(.+)$/);
        if (!m) {
          // 再試空格切（避免吃到太多：限制鍵長度）
          m = line.match(/^(.{1,30}?)\s{1,3}(.{1,50})$/);
        }
        if (m) {
          const k = normalizeKey(m[1].trim());
          const v = m[2].trim();
          if (!k || !v) continue;
          if (!(k in result) || String(result[k] ?? "").trim() === "") {
            result[k] = v;
          }
        }
      }
      return result;
    }

    // ====== 渲染欄位 ======
    function renderFields() {
      fieldsEl.innerHTML = "";
      const keys = Object.keys(dynamicData);
      if (keys.length === 0) {
        fieldsEl.innerHTML = '<div class="text-slate-500 text-sm">尚未有資料，請先上傳圖片辨識，或點「＋ 新增欄位」。</div>';
        return;
      }

      for (const k of keys) {
        const v = dynamicData[k] ?? "";
        const row = document.createElement('div');
        row.className = "grid grid-cols-12 gap-2 items-center";

        const keyInput = document.createElement('input');
        keyInput.className = "col-span-5 md:col-span-4 px-3 py-2 rounded-xl border text-slate-800";
        keyInput.value = k;

        const valInput = document.createElement('input');
        valInput.className = "col-span-6 md:col-span-7 px-3 py-2 rounded-xl border text-slate-800";
        valInput.value = v;

        const delBtn = document.createElement('button');
        delBtn.className = "col-span-1 px-3 py-2 rounded-xl border hover:bg-slate-50";
        delBtn.textContent = "刪";
        delBtn.onclick = () => {
          delete dynamicData[k];
          renderFields();
        };

        // 同步編輯
        keyInput.addEventListener('change', () => {
          const newK = normalizeKey(keyInput.value.trim());
          const oldV = dynamicData[k];
          delete dynamicData[k];
          if (newK) {
            // 若新鍵不存在或為空，再寫
            if (!(newK in dynamicData) || String(dynamicData[newK] ?? "").trim() === "") {
              dynamicData[newK] = valInput.value.trim();
            }
          }
          renderFields();
        });
        valInput.addEventListener('change', () => {
          dynamicData[keyInput.value.trim()] = valInput.value.trim();
        });

        row.appendChild(keyInput);
        row.appendChild(valInput);
        row.appendChild(delBtn);
        fieldsEl.appendChild(row);
      }
    }

    // ====== 事件：新增、清除、確認 ======
    btnAdd.addEventListener('click', () => {
      let base = "自訂欄位";
      let name = base;
      let i = 1;
      while (name in dynamicData) { name = base + (++i); }
      dynamicData[name] = "";
      renderFields();
    });

    btnClear.addEventListener('click', () => {
      dynamicData = {};
      renderFields();
    });

    btnConfirm.addEventListener('click', () => {
      // 這裡可改成送 Firestore；先示範輸出 JSON
      const payload = {
        date: new Date().toISOString(),
        data: dynamicData,
        raw: ocrRawText || ""
      };
      console.log("確認送出：", payload);
      alert("✅ 已整理完成（示範）：\n" + JSON.stringify(payload, null, 2));
      // TODO: 寫入 Firestore 的程式放這裡
    });

    // ====== 上傳辨識 ======
    btnUpload.addEventListener('click', async () => {
      const file = fileInput.files?.[0];
      if (!file) { statusEl.textContent = "請先選擇圖片檔案"; return; }

      statusEl.textContent = "⏳ 上傳並辨識中…";
      btnUpload.disabled = true;

      try {
        const fd = new FormData();
fd.append("image", file);               // 欄位名一定要叫 image

const resp = await fetch(OCR_API, {    // ← 改成打到完整網址
  method: 'POST',
  body: fd
});

// 把錯誤內容也提示出來，方便排查
if (!resp.ok) {
  let msg = "辨識失敗";
  try {
    const e = await resp.json();
    if (e?.error) msg += "：" + e.error;
  } catch (_) {}
  throw new Error(msg);
}

const result = await resp.json();       // 之後照你原流程處理 result


        // 後端應回傳：{ ok, text, fieldsSuggested, ... }
        ocrRawText = result.text || "";
        fieldsSuggested = result.fieldsSuggested || {};

        // 先吃 fieldsSuggested
        dynamicData = {};
        for (const [k, v] of Object.entries(fieldsSuggested)) {
          const nk = normalizeKey(k);
          if (nk && v && (!(nk in dynamicData) || String(dynamicData[nk] ?? "").trim() === "")) {
            dynamicData[nk] = v;
          }
        }

        // 再用彈性解析做補強
        const flexParsed = parseOCRResultFlexible(ocrRawText);
        for (const [k, v] of Object.entries(flexParsed)) {
          const nk = normalizeKey(k);
          if (nk && v && (!(nk in dynamicData) || String(dynamicData[nk] ?? "").trim() === "")) {
            dynamicData[nk] = v;
          }
        }

        // 如果完全沒抓到欄位，至少保留原文備查
        if (Object.keys(dynamicData).length === 0 && ocrRawText) {
          dynamicData["原始內容"] = ocrRawText;
        }

        // 原文區塊
        if (ocrRawText && ocrRawText.trim().length > 0) {
          rawTextEl.textContent = ocrRawText;
          rawBlock.classList.remove('hidden');
        } else {
          rawBlock.classList.add('hidden');
        }

        renderFields();
        statusEl.textContent = "✅ 完成";
      } catch (err) {
        console.error(err);
        statusEl.textContent = "❌ 發生錯誤：" + err.message;
      } finally {
        btnUpload.disabled = false;
      }
    });
  </script>
</body>
</html>
