<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>就醫/領藥地圖查詢</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <script src="https://medwell-test1.web.app/map/madmap.html"></script>
  <style>
    html, body { height: 100%; margin: 0; font-family: "Noto Sans TC", sans-serif;}
    body, #app { height: 100vh; background: #f8f9fa; }

    .header-search {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1002;
      background: #efede9; padding: 10px 12px 8px 12px; box-shadow: 0 2px 8px #1976d219;
      display: flex; flex-direction: row; align-items: center; gap: 8px;
    }
    .header-search input, .header-search select {
      font-size: 15px; padding: 7px 9px; border-radius: 5px; border: 1px solid #d2d7db;
      flex: 1;
    }
    .header-search button {
      background: #659963de;
color: #fff;; border: none; padding: 7px 18px; border-radius: 5px;
      font-size: 14px; cursor: pointer; transition: background .2s;
    }
    .header-search button:hover { background: #659963de; }
    .header-search .mode-btn {
      background: #dad7cd;
    color: #588157;
 border: none;
      font-size: 16px; font-weight: bold; padding: 7px 13px;
      border-radius: 20px; margin-right: 5px;
    }
    .header-search .mode-btn.active {
      background: #659963de; color: #fff;
    }
    #map {
      position: absolute; top: 55px; bottom: 0; left: 0; right: 0;
      z-index: 1;
    }
    @media (max-width: 700px) {
      .header-search { flex-direction: column; gap: 8px; }
      #map { top: 112px; }
    }

    #bottom-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 1200;
      background: #efede9; box-shadow: 0 -2px 18px #2223;
      border-radius: 20px 20px 0 0;
      min-height: 54px; max-height: 49.5vh;
      transition: transform 0.33s cubic-bezier(.77,0,.18,1), max-height 0.33s;
      will-change: transform;
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    #bottom-sheet.collapsed { max-height: 54px; transform: translateY(65%);}
    #bottom-sheet .sheet-handle { width: 54px; height: 7px; border-radius: 6px;
      background: #c2c4cc; margin: 8px auto 6px auto; cursor: pointer;}
    #bottom-sheet .results-list { 
      flex: 1 1 0%; min-height: 0; overflow-y: auto; 
      padding: 6px 8px 12px 8px;
      position:relative;
    }
    .sheet-title { text-align: left;
    font-size: 19.5px;
    color: #588157;
  margin: 7px 16px 10px 16px;}
    .result-card {
      background: #f3f3f3;
    border-radius: 12px;
    box-shadow: 0 2px 8px #252a2c12;
    padding: 11px 13px 10px 12px;
    margin-bottom: 9px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: border .15s, background .15s;

    }
    .result-card.active { border: 2px solid #659963de;
    background: #fff;
 }
    .result-card img { width: 42px; height: 42px; margin-top: 2px;}
    .result-card .info { flex: 1; font-size: 14px;}
    .result-card .info strong { font-size: 17px;color: #363636;}
    .result-card .address { color: #444; font-size: 12.5px;}
    .result-card .phone { color: #1976d2; font-size: 12px;}
    .result-card .more-btn {
      border: none;
    background: #659963de;
    color: #fff;
    border-radius: 100px;
    font-size: 15px;
    padding: 4px 15px;

    cursor: pointer;
    transition: background .2s;

    }
    .result-card .more-btn:hover { background: #059669;}
    .no-result { text-align: center; color: #aaa; font-size: 15px; margin-top: 22px;}

#scrollTopBtn {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  z-index: 9999;
  background: #dad7cdd1;
  color: white;
  border: none;
  border-radius: 22px;
  font-size: 17px;
  padding: 9px 14px;
  display: none;
  box-shadow: 0 2px 8px #8e8c8c8f;
  cursor: pointer;
}


    #detail-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(25,40,60,0.17); z-index: 5000;
      align-items: flex-end; justify-content: center;
    }
    #detail-modal.active { display: flex; }
    .modal-content {
background: #f7f7f1;
    border-radius: 18px 18px 0 0;
    max-height: 53vh;
    width: 100%;
    max-width: 500px;
    padding: 20px 20px 20px 20px;
    box-shadow: 0 4px 36px #2223;
    overflow-y: auto;
    position: relative;
    animation: slideup .32s;

    }
    @keyframes slideup { from {transform: translateY(110%);} to {transform: translateY(0);} }
    .modal-content .modal-close {
      position: absolute; top: 16px; right: 16px;
      background: #eee; color: #222; border: none; border-radius: 50%; font-size: 19px;
      width: 38px; height: 38px; cursor: pointer;
    }
    .modal-content h2 { margin: 0 0 6px 0; color: #1976d2; }
    .modal-content .address, .modal-content .phone {
      color: #444; font-size: 14px; margin-bottom: 7px;
      display: block;
    }
    .modal-content .section-title { color: #059669; font-size: 14px; margin-top: 13px; margin-bottom: 2px; }
    .modal-content table {
      width: 100%; font-size: 13px; border-collapse: collapse;
      margin-top: 7px; margin-bottom: 7px;
    }
    .modal-content th, .modal-content td {
      border: 1px solid #c6cec6bf; padding: 6px 3px; text-align: center;
    }
    .modal-content th { background: #9cc29b8f;}
    .modal-content .tag {
      display: inline-block; background: #10b981; color: #fff; font-size: 12px;
      padding: 2px 10px; border-radius: 16px; margin: 0 6px 4px 0;
    }
    @media (max-width: 700px) {
      .header-search { flex-direction: column; gap: 8px; }
      #map { top: 112px; }
      .modal-content { max-width: 100vw;}
    }

    /* 營業中/休息中 標籤樣式 */
    .open-tag {
      background: #9cc29b;
      color: #fff;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 13px;
      margin-left: 5px;
      vertical-align: middle;
    }
    .closed-tag {
      background: #bdbdbd;
      color: #fff;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 13px;
      margin-left: 5px;
      vertical-align: middle;
    }
    /* 表格統一勾叉 */
    .period-check {
      color: #659963de;
      font-size: 21px;
      font-weight: bold;
      display: inline-block;
      line-height: 1;
      font-family: inherit;
    }
    .period-x {
      color: #bbb;
      font-size: 19px;
      font-weight: bold;
      display: inline-block;
      line-height: 1;
      font-family: inherit;
    }
    

@media (max-width: 700px) {
  .header-search {
    display: flex;
        flex-wrap: wrap;
        flex-direction: row;
        gap: 6px 0;
        padding: 9px 6px 6px 6px;
        background: #efede9;
        justify-content: center;

  }
  .header-search .mode-btn {
    order: 1;
    flex: 1 1 45%;
    margin-bottom: 0;
    text-align: center;
    min-width: 90px;
    max-width: 160px;
    font-size: 16px;
  }
  .header-search .mode-btn:first-child { margin-right: 8px; }

  .header-search #citySelect,
  .header-search #districtSelect {
    order: 2;
    flex: 1 1 48%;
    min-width: 80px;
    margin-bottom: 0;
    margin-right: 0;
  }
  .header-search #citySelect { margin-right: 6px; }

  /* ===== 四格並排 ===== */
  .header-search .four-row {
    order: 3;
    display: flex;
    width: 100%;
    gap: 6px;
    margin-top: 7px;
  }
  .header-search #roadInput,
  .header-search #nameInput,
  .header-search #filterButton,
  .header-search #clearButton {
    flex: 1 1 0;
    min-width: 0;
    margin: 0;
    font-size: 14px;
    height: 37px;
    box-sizing: border-box;
  }
  .header-search #filterButton,
  .header-search #clearButton {
    padding-left: 0;
    padding-right: 0;
    font-size: 14px;
    min-width: 0;
    height: 37px;
  }
}
.result-card:hover {
  background: #f9f9f9; 
  transition: background 0.18s;
}
@media (min-width: 701px) {
  #citySelect,
  #districtSelect {
    flex: 0 0 220px; /* 寬版桌面時：變大 */
  }

  #keywordInput {
    flex: 1 1 auto;
    min-width: 0;
    max-width: 240px; /* 限制最大寬度變小 */
  }
}
.location-input-wrapper {
  position: relative;
  flex: 1 1 auto;
  max-width: 280px; /* 依你原本的設定 */
}

@media (max-width: 500px) {
  #locateBtn {
    font-size: 14px;
    right: 4px;
  }
}
.leaflet-container a {
  font-size: 16px;
    color: #659963;
    font-weight: 100px;
}
.leaflet-popup-content {
    margin: 12px 26px 10px 16px;
    line-height: 1.3;
    font-size: 13px;
    font-size: 1.08333em;
    min-height: 1px;
    color: #659963;
    font-size: 16px;
}
.leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: white;
    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.4);
    font-weight: 500;
    color: #363636;
  }
#locateBtn:hover {
  color: #588157;
  font-weight: 430;
}

@media (min-width: 701px) {
  #citySelect,
  #districtSelect {
    flex: 0 0 220px; /* 寬版桌面時：變大 */
  }

  #keywordInput {
    flex: 1 1 auto;
    min-width: 0;
    max-width: 400px; /* 限制最大寬度變小 */
  }
}
.four-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: 1 1 auto;
  gap: 12px;
}

.button-group {
  display: flex;
  gap: 8px;
}
.input-group {
  display: flex;
  border: 1px solid #d2d7db;
  border-radius: 5px;
  overflow: hidden;
  flex: 1 1 auto;
  max-width: 320px;
}


.input-group input {
  flex: 1 1 auto;
  border: none;
  padding: 7px 9px;
  font-size: 15px;
  outline: none;
}

.input-group button {
  background: none;
  border: none;
  color: #588157;
  font-size: 14px;
  padding: 0 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.2s;
  font-weight: 430;
}

.input-group button:hover,
.input-group button:active,
.input-group button:focus {
  color: #0d47a1;
  background: none;  /* ✅ 防止系統自動上背景 */
  outline: none;     /* ✅ 移除按下時的外框線 */
  box-shadow: none;  /* ✅ 移除陰影 */
}
@media (min-width: 701px) {
  #filterButton,
  #clearButton {
    min-width: 100px;
    padding: 8px 20px;
  }
}


@media (max-width: 700px) {
  .header-search .input-group {
    flex: 1 1 34%;
    max-width: none;
    background: #fff;
  }

  .input-group input {
    flex: 1 1 auto;
    max-width: 70%;   /* ✅ 限制 input 最多佔 70% */
    min-width: 0;
  }

  .input-group button {
    flex: 0 0 auto;
    white-space: nowrap;
    padding: 0 10px;
    font-size: 13px;
  }
}
.leaflet-control-zoom {
  top: 40px;  /* ← 調整這個數字來控制下移程度 */
}
.input-group button:hover, .input-group button:active, .input-group button:focus
{
    color: #588157;
    background: none;
    outline: none;
    box-shadow: none;
}
#guide-modal {
  display: flex;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(25,40,60,0.17);
  z-index: 6000;
  align-items: center;
  justify-content: center;
}
#guide-modal.hidden { display: none; }
#guide-modal .modal-content {
  background: #f7f7f1;
  border-radius: 14px;
  max-width: 420px;
  width: 90%;
  padding: 20px;
  box-shadow: 0 4px 28px #2225;
  animation: fadeIn .3s ease;
}
#guide-modal h3 {
  margin: 0 0 10px 0;
  color: #588157;
  text-align: center;
}
#guide-close {
  position: absolute;
  top: 14px; right: 14px;
  background: #eee;
  border: none;
  border-radius: 50%;
  width: 34px; height: 34px;
  font-size: 18px;
  cursor: pointer;
}
@keyframes fadeIn {
  from {opacity:0; transform:scale(0.9);}
  to {opacity:1; transform:scale(1);}
}

  </style>
</head>
<body>
  <div id="app">
<div class="header-search">
  <button class="mode-btn" id="btn-clinic" data-mode="clinic">🏥 就醫掛號</button>
  <button class="mode-btn" id="btn-pharmacy" data-mode="pharmacy">💊 就近領藥</button>
  <select id="citySelect"><option value="">縣市</option></select>
  <select id="districtSelect" disabled><option value="">鄉鎮市區</option></select>

  <div class="four-row">
<div class="input-group">
  <input id="keywordInput" placeholder="輸入關鍵字">
  <button id="locateBtn" title="重新開啟定位">⦿直接找最近</button>
</div>


    <button id="filterButton">篩選</button>
    <button id="clearButton" style="background:#8e8e8cf2;">清除</button>
    
  </div>
</div>

    <div id="map"></div>
    <div id="bottom-sheet" class="collapsed">
      <div class="sheet-handle"></div>

<div class="sheet-title" style="display: flex;font-weight: bold; align-items: baseline; gap: 8px;">
  <div>💡搜尋結果</div>
  <div style="font-size:13px;color:#666;font-weight: normal; ">點擊卡片可查看位置及導航</div>
</div>


      <div class="results-list" id="results-list">
        <div class="no-result">請先搜尋</div>
      </div>
      <button id="scrollTopBtn" title="回頂部">↑</button>
    </div>
    <div id="detail-modal">
      <div class="modal-content" id="modal-content">
        <button class="modal-close" id="modal-close" title="關閉">×</button>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="map.js"></script>
   <script>
    // 初始化 Choices，下拉選單就會自動換成自訂的，手機能滑到底
    document.addEventListener('DOMContentLoaded', function() {
      new Choices('#citySelect', {
        searchEnabled: false,
        itemSelectText: '',
        shouldSort: false
      });
      new Choices('#districtSelect', {
        searchEnabled: false,
        itemSelectText: '',
        shouldSort: false
      });
    });
  </script>
  <!-- 🟢 新手教學 Modal -->
<div id="guide-modal">
  <div class="modal-content">
    <button class="modal-close" id="guide-close">×</button>
    <h3>歡迎使用就醫/領藥地圖</h3>
    <p>使用方式：</p>
    <ol style="padding-left:18px; line-height:1.8; color:#444;font-size: 15px;">
      <li>先選擇要「就醫掛號」還是「就近領藥」</li>
      <li>可選擇直接點擊 「⦿直接找最近」按鈕找最近 <br>
        或至少「選擇縣市」後點擊「篩選」按鈕開始搜尋</li>
    </ol>
    <p>Tips:</p>
    <div style="padding-left:2px; line-height:1.8; color:#444;font-size: 15px;">
      🌟支援判斷營業狀態<br>
      🌟支援導航及各種預約掛號
    </div>

    <!-- 🟢 新增：不再顯示選項 -->
<div style="margin:0 0 16px; font-size:14px; color:#555; text-align:center;">
  <label style="cursor:pointer; display:inline-flex; align-items:center;">
    <input type="checkbox" id="dont-show-again" style="margin-right:6px;">
    下次不再顯示
  </label>
</div>


    <div style="text-align:center; margin-top:16px;">
      <button id="guide-ok" style="background:#659963de; color:#fff; border:none; padding:9px 18px; border-radius:6px; font-size:15px; cursor:pointer;">我知道了</button>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const guideModal = document.getElementById("guide-modal");
    const guideClose = document.getElementById("guide-close");
    const guideOk = document.getElementById("guide-ok");
    const dontShowAgain = document.getElementById("dont-show-again");

    // 🟢 檢查 localStorage，如果之前選過「不再顯示」就直接隱藏
    if (localStorage.getItem("guideDontShow") === "true") {
      guideModal.style.display = "none";
    } else {
      guideModal.style.display = "flex";
    }

    function closeGuide() {
      if (dontShowAgain.checked) {
        localStorage.setItem("guideDontShow", "true"); // 記錄使用者選擇
      }
      guideModal.style.display = "none";
    }

    guideClose.addEventListener("click", closeGuide);
    guideOk.addEventListener("click", closeGuide);
  });
</script>

</body>
</html>
