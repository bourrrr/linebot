<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>個人資訊</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from './firebase-config.js';
    import { cityDistricts } from './district-data.js';

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const saveBtn = document.getElementById("saveBtn");
    let userDocRef = null;

    const citySelect = document.getElementById("city");
    const districtSelect = document.getElementById("district");

    citySelect.addEventListener("change", () => {
      const selectedCity = citySelect.value;
      districtSelect.innerHTML = '<option value="">請選擇行政區</option>';
      if (cityDistricts[selectedCity]) {
        cityDistricts[selectedCity].forEach(d => {
          const opt = document.createElement("option");
          opt.value = d;
          opt.textContent = d;
          districtSelect.appendChild(opt);
        });
        districtSelect.disabled = false;
      } else {
        districtSelect.disabled = true;
      }
    });

  onAuthStateChanged(auth, async user => {
    if (user) {
      const q = query(collection(db, "users"), where("uid", "==", user.uid));
      const querySnapshot = await getDocs(q);
      if (!querySnapshot.empty) {
        const docSnap = querySnapshot.docs[0];
        const data = docSnap.data();
        userDocRef = doc(db, "users", docSnap.id);

        document.getElementById("name").value = data.name || "";
        document.getElementById("phone").value = data.phone || "";
        document.getElementById("emergencyName").value = data.emergencyName || "";
        document.getElementById("emergencyPhone").value = data.emergencyPhone || "";

        if (data.role === "volunteer") {
          document.getElementById("idCard").value = data.idCard || "";
          document.getElementById("police").value = data.police || "";
          document.getElementById("hours").value = data.hours || 0;

          // 設定城市
          citySelect.value = data.city || "";
          citySelect.dispatchEvent(new Event("change"));

          // 等待行政區選項載入後再設定
          const waitForDistrictOptions = () => {
            if (districtSelect.options.length > 1) {
              districtSelect.value = data.district || "";
            } else {
              setTimeout(waitForDistrictOptions, 50);
            }
          };
          waitForDistrictOptions();
        }
      }
    } else {
      window.location.href = "login.html";
    }
  });


    saveBtn.addEventListener("click", async () => {
      const updates = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        emergencyName: document.getElementById("emergencyName").value,
        emergencyPhone: document.getElementById("emergencyPhone").value
      };

      if (document.getElementById("idCard")) {
        updates.idCard = document.getElementById("idCard").value;
        updates.police = document.getElementById("police").value;
        updates.hours = Number(document.getElementById("hours").value);
        updates.city = document.getElementById("city").value;
        updates.district = document.getElementById("district").value;
      }

      if (userDocRef) {
        await updateDoc(userDocRef, updates);
        alert("✅ 資料已更新！");
      }
    });
  </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-6">
  <div class="bg-white p-6 rounded-2xl shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-4 text-center">編輯個人資訊</h2>
    <div class="space-y-4 text-gray-800 mb-6">
      <div>
        <label class="block font-semibold mb-1">姓名</label>
        <input id="name" class="w-full border p-2 rounded" type="text">
      </div>
      <div>
        <label class="block font-semibold mb-1">手機號碼</label>
        <input id="phone" class="w-full border p-2 rounded" type="text">
      </div>
      <div>
        <label class="block font-semibold mb-1">緊急聯絡人姓名</label>
        <input id="emergencyName" class="w-full border p-2 rounded" type="text">
      </div>
      <div>
        <label class="block font-semibold mb-1">緊急聯絡人電話</label>
        <input id="emergencyPhone" class="w-full border p-2 rounded" type="text">
      </div>

      <div id="volunteerFields">
        <label class="block font-semibold mb-1">縣市</label>
        <select id="city" class="w-full border p-2 rounded mb-2">
          <option value="">請選擇縣市</option>
          <option value="基隆市">基隆市</option>
          <option value="臺北市">臺北市</option>
          <option value="新北市">新北市</option>
          <option value="桃園市">桃園市</option>
          <option value="新竹市">新竹市</option>
          <option value="新竹縣">新竹縣</option>
          <option value="苗栗縣">苗栗縣</option>
          <option value="臺中市">臺中市</option>
          <option value="彰化縣">彰化縣</option>
          <option value="南投縣">南投縣</option>
          <option value="雲林縣">雲林縣</option>
          <option value="嘉義市">嘉義市</option>
          <option value="嘉義縣">嘉義縣</option>
          <option value="臺南市">臺南市</option>
          <option value="高雄市">高雄市</option>
          <option value="屏東縣">屏東縣</option>
          <option value="宜蘭縣">宜蘭縣</option>
          <option value="花蓮縣">花蓮縣</option>
          <option value="臺東縣">臺東縣</option>
          <option value="澎湖縣">澎湖縣</option>
          <option value="金門縣">金門縣</option>
          <option value="連江縣">連江縣</option>
      </select>
        </select>
        <label class="block font-semibold mb-1">行政區</label>
        <select id="district" class="w-full border p-2 rounded mb-2" disabled>
          <option value="">請選擇行政區</option>
        </select>

        <label class="block font-semibold mb-1 mt-2">身分證號</label>
        <input id="idCard" class="w-full border p-2 rounded" type="text">
        <label class="block font-semibold mb-1">良民證編號</label>
        <input id="police" class="w-full border p-2 rounded" type="text">
        <label class="block font-semibold mb-1">志工時數</label>
        <input id="hours" class="w-full border p-2 rounded" type="number">
      </div>
    </div>

    <div class="text-center space-y-2">
      <button id="saveBtn" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">儲存變更</button><br>
    </div>
    <div class="text-center mt-4">
      <a href="volunteer.html" class="text-blue-500 hover:underline">← 回首頁</a>
    </div>
  </div>
</body>
</html>
