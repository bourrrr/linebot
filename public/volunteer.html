<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>志工首頁</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
  <div class="bg-white shadow-xl rounded-2xl flex flex-col md:flex-row w-full max-w-6xl overflow-hidden">

    <!-- 左側 Logo -->
    <div class="md:w-1/3 w-full flex items-center justify-center p-6">
      <img src="MakeWell.jpg" alt="MakeWell Logo" class="max-h-60 w-full max-w-[300px] object-contain" />
    </div>

    <!-- 右側 功能選單 -->
    <div class="md:w-2/3 w-full p-8">
      <!-- Header -->
      <div class="flex flex-col items-center mb-6 relative">
        <h1 class="text-3xl font-bold text-gray-800 text-center">🙋 志工任務總覽</h1>
        <a href="login.html" class="absolute right-0 top-0 text-sm text-blue-500 hover:underline">登出</a>
      </div>

      <!-- Card Layout -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <a href="task-list.html" class="bg-blue-100 hover:bg-blue-200 rounded-xl p-6 transition shadow">
          <h2 class="text-xl font-semibold mb-2">📋 任務待接區</h2>
          <p class="text-gray-700 text-sm">查看等待支援的請求，挑選協助對象</p>
        </a>
        <a href="my-tasks.html" class="bg-yellow-100 hover:bg-yellow-200 rounded-xl p-6 transition shadow">
          <h2 class="text-xl font-semibold mb-2">✅ 我的任務</h2>
          <p class="text-gray-700 text-sm">查看我已接受的協助任務</p>
        </a>
        <a href="task-history.html" class="bg-purple-100 hover:bg-purple-200 rounded-xl p-6 transition shadow">
          <h2 class="text-xl font-semibold mb-2">📸 任務回報記錄</h2>
          <p class="text-gray-700 text-sm">查看我已上傳的任務完成照片與回報</p>
        </a>
        <a href="volunteer-profile.html" class="bg-pink-100 hover:bg-pink-200 rounded-xl p-6 transition shadow">
          <h2 class="text-xl font-semibold mb-2">👤 個人資料</h2>
          <p class="text-gray-700 text-sm">檢視與更新個人資訊</p>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
