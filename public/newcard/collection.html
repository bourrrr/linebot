<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>我的圖鑑｜Make Well</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --green-dark:#588157;
      --green-light:#659963de;
      --gray-soft:#dad7cd;
      --gray-deep:#8e8e8cf2;
      --yellow-soft:#efede9;
      --black-soft:#363636;
    }
    body{ background:var(--yellow-soft); color:var(--black-soft); font-family:system-ui,sans-serif; }
    h1,h2{ color:var(--green-dark); }

    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      gap:.4rem; padding:.65rem 1rem; border-radius:.75rem; font-weight:600;
      transition:transform .06s ease, opacity .2s ease, background .2s ease;
      text-decoration:none;
    }
    .btn:active{ transform:translateY(1px); }
    .btn-primary{ background:var(--green-dark); color:#fff; border:1px solid var(--green-dark); }
    .btn-primary:hover{ opacity:.9; }
    .btn-ghost{ color:var(--green-dark); background:transparent; border:1px solid var(--green-dark); }
    .btn-ghost:hover{ background:var(--gray-soft); }

    .card{
      background:#fff; border:1px solid var(--gray-soft); border-radius:1rem;
      box-shadow:0 4px 6px rgba(0,0,0,.06); padding:12px;
      transition: box-shadow .2s ease, border-color .2s ease, transform .06s ease;
    }
    .card:hover{ border-color:var(--green-light); box-shadow:0 6px 10px rgba(0,0,0,.08); }
    .card:active{ transform:translateY(1px); }
    .card img{ width:100%; height:auto; border-radius:.75rem; border:1px solid var(--gray-soft); background:#fff; }
    .card h3{ font-weight:700; margin-top:.5rem; color:var(--black-soft); }
    .badge{
      display:inline-block; font-size:.75rem; padding:.15rem .5rem; border-radius:999px;
      color:#fff; background:var(--green-dark);
    }

    .info-box{
      background:var(--gray-soft); color:var(--black-soft);
      padding:6px 12px; border-radius:.5rem; border:1px solid var(--green-light); font-weight:500;
    }
  </style>
</head>
<body>
  <main class="max-w-4xl mx-auto p-5">
    <header class="flex items-center justify-between gap-2 mb-3">
      <h1 class="text-2xl font-bold">我的圖鑑</h1>
      <nav class="flex items-center gap-2">
        <a href="indexcard.html" class="btn btn-ghost">← 返回首頁</a>
        <a href="knowledge-draw.html" class="btn btn-primary">前往抽卡</a>
      </nav>
    </header>

    <p class="text-sm mb-4" style="color:var(--gray-deep)">查看你收集到的知識圖片與獲得次數。</p>

    <section class="flex flex-wrap items-center gap-2 mb-4">
      <span class="info-box">已收集：<b id="statUnique">-</b> 張</span>
      <span class="info-box">總獲得：<b id="statTotal">-</b> 次</span>
    </section>

    <section id="gallery" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></section>

    <div class="flex items-center gap-2 mt-6">
      <a href="indexcard.html" class="btn btn-ghost">← 返回首頁</a>
      <a href="knowledge-draw.html" class="btn btn-primary">前往抽卡</a>
    </div>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getStorage, ref as storageRef, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

    const log = (...a)=>console.log(...a);
    const $ = (id)=>document.getElementById(id);
    const gallery = $('gallery');
    const statUnique = $('statUnique');
    const statTotal  = $('statTotal');

    function mockUid(){ const k="dev_mock_uid"; let id=localStorage.getItem(k); if(!id){ id="DEV_"+Math.random().toString(36).slice(2,10); localStorage.setItem(k,id); } return id; }
    async function loadFirebaseConfig(){ try{ const mod = await import("./firebase-config.js"); const cfg = mod.firebaseConfig || mod.default; if(cfg) return cfg; }catch(e){} return { apiKey:"AIzaSyCCUzkxpn1quR9PPSBeZBGGl7XVh8vPzjY", authDomain:"medwell-test1.firebaseapp.com", projectId:"medwell-test1", storageBucket:"medwell-test1.appspot.com", messagingSenderId:"860851688843", appId:"1:860851688843:web:622eb8feccad45ce640b8e" }; }

    async function resolveImageUrl(storage, imageField){ if (!imageField) return ""; const looksHttp = s => /^https?:\/\//i.test(s||""); const looksAbs  = s => /^\//.test(s||""); if (looksHttp(imageField) || looksAbs(imageField)) return imageField; let path = (imageField||"").trim(); if (!path.includes("/")) path = `knowledge/${path}`; if (!path.startsWith("images/")) path = `images/${path}`; const ref = storageRef(storage, path); return await getDownloadURL(ref); }

    async function fetchFromUserDailyDraws(db, userId){ const dailyCol = collection(db, `users/${userId}/daily_draws`); const snap = await getDocs(dailyCol); const map = new Map(); snap.forEach(doc => { const x = doc.data() || {}; const arr = Array.isArray(x.history) ? x.history : []; for (const it of arr){ const key = it.cardId || it.id || it.image || it.name; if (!map.has(key)){ map.set(key, { id: key, name: it.name || "未命名", image: it.image, count: 0 }); } map.get(key).count += 1; } }); return Array.from(map.values()); }

    async function renderGallery(items, storage){ gallery.innerHTML = ""; if(!items.length){ gallery.innerHTML = '<div class="col-span-full text-center text-sm" style="color:var(--gray-deep)">尚未蒐集到任何圖片，去「前往抽卡」試試吧！</div>'; statUnique.textContent = "0"; statTotal.textContent = "0"; return; } const urls = await Promise.all(items.map(async it => { try { return await resolveImageUrl(storage, it.image); } catch (e){ return ""; } })); let total = 0; items.forEach((it, i) => { total += Number(it.count||0); const url = urls[i] || "./images/placeholder.svg"; const card = document.createElement('div'); card.className = "card"; card.innerHTML = `<img src="${url}" alt="${it.name}" referrerpolicy="no-referrer" onerror="this.src='./images/placeholder.svg'"/><div class="flex items-center justify-between mt-2"><h3 class="truncate pr-2">${it.name}</h3><span class="badge">× ${it.count || 1}</span></div>`; gallery.appendChild(card); }); statUnique.textContent = String(items.length); statTotal.textContent  = String(total); }

    (async ()=>{ try{ const firebaseConfig = await loadFirebaseConfig(); const app = initializeApp(firebaseConfig); const db  = getFirestore(app); const storage = getStorage(app); let userId; try{ await liff.init({ liffId: "2007870072-ZNeMmll2" }); if(!liff.isLoggedIn()){ liff.login(); return; } userId = (await liff.getProfile()).userId; }catch(e){ userId = mockUid(); } let items = await fetchFromUserDailyDraws(db, userId); await renderGallery(items, storage); }catch(e){ gallery.innerHTML = '<div class="col-span-full text-center text-sm text-red-600">載入圖鑑失敗：'+(e?.message||e)+'</div>'; } })();
  </script>
</body>
</html>
