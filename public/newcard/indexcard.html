<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#588157" />
  <title>Make Well 圖卡系統 · LINE 登入版</title>

  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    body { background: #efede9; color: #363636; font-family: 'Noto Sans TC', sans-serif; margin:0; overflow-x:hidden; }
    .container { max-width: 960px; margin: 0 auto; padding: 20px; }
    .logo { display:block; margin:0 auto; max-width:120px; border-radius:10px; }
    h1 { text-align:center; color:#588157; font-size:28px; }
    .checkin-card { background:#dad7cd; padding:24px; border-radius:16px; box-shadow:0 4px 12px rgba(0,0,0,.1); position:relative; }
    .month-bar { display:flex; justify-content:space-between; align-items:center; background:#fff; border-radius:10px; padding:8px 12px; margin-bottom:10px; }
    #weekdayHeader, #calendarDays { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
    .weekday { text-align:center; color:#666; font-weight:bold; }
    .day { text-align:center; padding:8px 0; background:#f3f3f1; border-radius:6px; font-weight:bold; color:#363636; transition:transform 0.1s; }
    .day.today { outline:2px dashed #588157; }
    .day.signed { border:2px solid #588157; background:url('S__106053636.jpg') center/60% no-repeat rgba(255,255,255,0.6); }
    .btn { border:none; border-radius:999px; padding:10px 16px; font-weight:bold; cursor:pointer; transition:0.2s; }
    .btn-primary { background:#588157; color:#fff; }
    .btn-ghost { background:#659963de; color:#fff; }
    .btn:hover { transform:scale(1.05); }
    .cta { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:12px; }

    @media (max-width: 680px) {
      .container { padding: 12px; }
      .logo { max-width:100px; }
      h1 { font-size:22px; line-height:1.3; }
      .checkin-card { padding:16px; border-radius:12px; }
      .month-bar { flex-direction:column; gap:8px; padding:10px; text-align:center; }
      .calendar { padding:6px; }
      #weekdayHeader, #calendarDays { grid-template-columns:repeat(7,1fr); gap:4px; }
      .day { padding:6px 0; font-size:14px; }
      .btn { width:100%; font-size:16px; padding:12px; border-radius:12px; }
      .cta { flex-direction:column; gap:8px; }
    }

    /* ✅ 簽到成功動畫（含文字提示） */
    .success-overlay {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      background:rgba(255,255,255,0.85);
      border-radius:16px;
      opacity:0; pointer-events:none; transition:opacity 0.3s ease;
      z-index:50;
    }
    .success-overlay.active { opacity:1; pointer-events:auto; animation:fadeOut 1.5s forwards; }
    @keyframes fadeOut { 0%{opacity:1} 80%{opacity:1} 100%{opacity:0} }
    .checkmark { width:80px; height:80px; border-radius:50%; background:#588157; display:flex; align-items:center; justify-content:center; animation:popIn .3s ease; }
    @keyframes popIn { from{ transform:scale(0); opacity:0 } to{ transform:scale(1); opacity:1 } }
    .checkmark::after { content:"✓"; color:#fff; font-size:48px; font-weight:700; }
    .success-text{ position:absolute; bottom:18%; left:50%; transform:translateX(-50%); font-weight:800; color:#256029; background:rgba(255,255,255,.9); padding:8px 14px; border-radius:999px; box-shadow:0 4px 12px rgba(0,0,0,.08); opacity:0; }
    .success-overlay.active .success-text{ animation:toast 1.5s ease forwards; }
    @keyframes toast{ 0%{opacity:0; transform:translate(-50%, 8px)} 20%{opacity:1; transform:translate(-50%, 0)} 80%{opacity:1; transform:translate(-50%, 0)} 100%{opacity:0; transform:translate(-50%, -6px)} }
  </style>
</head>
<body>
  <div class="container">
    <img src="S__106053636.jpg" alt="Make Well Logo" class="logo">
    <h1>Make Well 圖卡系統（LINE 登入版）</h1>

    <section class="checkin-card">
      <div class="month-bar">
        <button id="btnPrevMonth" class="btn btn-ghost">◀ 上個月</button>
        <div id="monthTitle"></div>
        <button id="btnNextMonth" class="btn btn-ghost">下個月 ▶</button>
      </div>
      <div id="checkinCount" style="text-align:center;color:#588157;font-weight:bold;margin-bottom:8px;"></div>
      <div class="calendar">
        <div id="weekdayHeader"></div>
        <div id="calendarDays"></div>
      </div>
      <div class="cta">
        <button id="btnCheckin" class="btn btn-primary">今日簽到</button>
        <a href="knowledge-draw.html"><button class="btn btn-ghost">隨機獲得圖片</button></a>
        <a href="collection.html"><button class="btn btn-ghost">查看我的圖鑑</button></a>
      </div>
      <!-- 簽到成功動畫層 -->
      <div class="success-overlay" id="successOverlay">
        <div class="checkmark" aria-hidden="true"></div>
        <div class="success-text" id="successText" aria-live="polite">簽到成功！</div>
      </div>
    </section>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCCUzkxpn1quR9PPSBeZBGGl7XVh8vPzjY",
      authDomain: "medwell-test1.firebaseapp.com",
      projectId: "medwell-test1",
      storageBucket: "medwell-test1.firebasestorage.app",
      messagingSenderId: "860851688843",
      appId: "1:860851688843:web:622eb8feccad45ce640b8e"
    };
    firebase.initializeApp(firebaseConfig);

    const WEEK_LABELS = ["日","一","二","三","四","五","六"];

    async function initApp() {
      await liff.init({ liffId: '2007870072-ZNeMmll2' });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const profile = await liff.getProfile();
      const userId = profile.userId;

      const db = firebase.firestore();
      const checkinRef = db.collection('makewell_checkin');

      function getMonthKey(d=new Date()){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
      function getTodayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

      function renderWeekHeader(){
        const header=document.getElementById('weekdayHeader');
        header.innerHTML='';
        WEEK_LABELS.forEach(day=>{
          const div=document.createElement('div'); div.className='weekday'; div.textContent=day; header.appendChild(div);
        });
      }

      async function getSignedDays(monthKey){
        const docSnap = await checkinRef.doc(`${userId}_${monthKey}`).get();
        if(docSnap.exists) return docSnap.data().days || [];
        return [];
      }

      async function saveSignedDay(monthKey, today){
        const ref = checkinRef.doc(`${userId}_${monthKey}`);
        await db.runTransaction(async (t)=>{
          const doc = await t.get(ref);
          let days = [];
          if(doc.exists) days = doc.data().days || [];
          if(!days.includes(today)) days.push(today);
          t.set(ref, { days }, { merge:true });
        });
      }

      function renderCalendar(signedDays,baseDate=new Date()){
        const daysWrap=document.getElementById('calendarDays');
        const monthTitle=document.getElementById('monthTitle');
        const checkinCount=document.getElementById('checkinCount');
        daysWrap.innerHTML='';

        const year=baseDate.getFullYear();
        const month=baseDate.getMonth();
        const firstDay=new Date(year,month,1);
        const lastDate=new Date(year,month+1,0).getDate();
        const startWeekday=firstDay.getDay();
        const todayStr=getTodayStr();

        monthTitle.textContent=`${year} 年 ${month+1} 月`;
        checkinCount.textContent=`本月已簽到 ${signedDays.length} 天`;

        for(let i=0;i<startWeekday;i++){ const gap=document.createElement('div'); daysWrap.appendChild(gap); }
        for(let d=1; d<=lastDate; d++){
          const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const cell=document.createElement('div');
          cell.className='day';
          cell.textContent=d;
          if(dateStr===todayStr) cell.classList.add('today');
          if(signedDays.includes(dateStr)) cell.classList.add('signed');
          daysWrap.appendChild(cell);
        }
      }

      function showSuccess(){
        const overlay=document.getElementById('successOverlay');
        const textEl=document.getElementById('successText');
        overlay.classList.remove('active');
        void overlay.offsetWidth;
        textEl.textContent='簽到成功！';
        overlay.classList.add('active');
        setTimeout(()=>overlay.classList.remove('active'),1500);
      }

      renderWeekHeader();
      let currentMonth=new Date(); currentMonth.setDate(1);

      const btnPrev=document.getElementById('btnPrevMonth');
      const btnNext=document.getElementById('btnNextMonth');
      const btnCheckin=document.getElementById('btnCheckin');

      async function refresh(baseDate){
        const key=getMonthKey(baseDate);
        const signed=await getSignedDays(key);
        renderCalendar(signed,baseDate);
        const isThisMonth=getMonthKey(new Date())===key;
        const today=getTodayStr();
        btnCheckin.disabled=!isThisMonth||signed.includes(today);
        btnCheckin.textContent=!isThisMonth?'僅可在本月簽到':(signed.includes(today)?'今日已簽到 ✓':'今日簽到');
      }

      btnCheckin.addEventListener('click', async ()=>{
        const key=getMonthKey(currentMonth);
        const today=getTodayStr();
        await saveSignedDay(key,today);
        await refresh(currentMonth);
        showSuccess();
      });

      btnPrev.addEventListener('click',()=>{ currentMonth.setMonth(currentMonth.getMonth()-1); refresh(currentMonth); });
      btnNext.addEventListener('click',()=>{ currentMonth.setMonth(currentMonth.getMonth()+1); refresh(currentMonth); });

      await refresh(currentMonth);
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
