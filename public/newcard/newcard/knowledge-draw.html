<!-- /public/knowledge-draw.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>知識圖片抽卡</title>

  <!-- Tailwind（CDN 版，開發用） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --green-dark:#588157;
      --green-light:#659963de;
      --gray-soft:#dad7cd;
      --gray-deep:#8e8e8cf2;
      --yellow-soft:#efede9;
      --black-soft:#363636;
    }
    body{ background:var(--yellow-soft); color:var(--black-soft); font-family:system-ui,sans-serif; }
    h1,h2{ color:var(--green-dark); }
    .btn{ display:inline-flex; align-items:center; justify-content:center; gap:.4rem; padding:.65rem 1rem; border-radius:.75rem; font-weight:600; text-decoration:none; transition:transform .06s ease, opacity .2s ease; }
    .btn:active{ transform:translateY(1px); }
    .btn-primary{ background:var(--green-dark); color:#fff; }
    .btn-primary:hover{ opacity:.9; }
    .btn-ghost{ color:var(--green-dark); background:transparent; border:1px solid var(--green-dark); }
    .btn-ghost:hover{ background:var(--gray-soft); }
    #drawBtn{ background:var(--green-dark); color:#fff; border:none; border-radius:.75rem; padding:12px 20px; font-weight:600; cursor:pointer; transition:opacity .2s ease; }
    #drawBtn:hover{ opacity:.9; }
    #drawBtn:disabled{ background:var(--gray-deep); cursor:not-allowed; }
    .info-box{ background:var(--gray-soft); color:var(--black-soft); padding:6px 12px; border-radius:.5rem; border:1px solid var(--green-light); font-weight:500; }
    #result{ background:#fff; border:1px solid var(--gray-soft); border-radius:1rem; box-shadow:0 4px 6px rgba(0,0,0,.08); padding:1rem; }
    #errorMsg{ color:#c81e1e; font-weight:600; }
    #debug{ background:var(--gray-soft); border:1px dashed var(--green-light); color:var(--black-soft); }
  </style>
</head>
<body>
  <section class="max-w-md mx-auto p-5">
    <h1 class="text-2xl font-bold mb-2">知識圖片抽卡</h1>
    <p class="text-sm mb-4" style="color:var(--gray-deep)">
      今日可抽 = 保底 1 次 + 完成度≥80% +（若當日計畫≥3 且完成率=100% 再+1）｜每日上限 3 次
    </p>

    <div class="flex items-center gap-2 mb-4">
      <a href="index.html" class="btn btn-ghost">← 返回首頁</a>
      <a href="collection.html" class="btn btn-primary">前往圖鑑</a>
    </div>

    <div class="flex items-center gap-3 mb-4">
      <span class="info-box">今日可抽：<b id="quota">—</b> 次</span>
      <span class="info-box">已抽：<b id="used">—</b> 次</span>
    </div>

    <button id="drawBtn" disabled>🎴 抽一張</button>
    <p id="errorMsg" class="mt-3 text-sm"></p>

    <div id="result" class="mt-6 hidden">
      <p class="text-sm" style="color:var(--gray-deep)">你抽到了：</p>
      <h2 id="cardName" class="text-lg font-semibold mb-3"></h2>
      <img id="cardImg" alt="知識圖片" class="w-full rounded-xl border" />
    </div>

    <div class="flex items-center gap-2 mt-6">
      <a href="index.html" class="btn btn-ghost">← 返回首頁</a>
      <a href="collection.html" class="btn btn-primary">前往圖鑑</a>
    </div>

    <pre id="debug" class="mt-6 text-xs rounded p-3 whitespace-pre-wrap"></pre>
  </section>

  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
    // ------- 元件 -------
    const $btn   = document.getElementById('drawBtn');
    const $name  = document.getElementById('cardName');
    const $img   = document.getElementById('cardImg');
    const $box   = document.getElementById('result');
    const $err   = document.getElementById('errorMsg');
    const $dbg   = document.getElementById('debug');
    const $used  = document.getElementById('used');
    const $quota = document.getElementById('quota');

    // 備援圖（用根目錄絕對路徑，避免 /newcard/ 相對路徑問題）
    $img.onerror = () => { $img.src = '/images/placeholder.svg'; };

    function dbg(...args){
      console.log(...args);
      const line = args.map(x => typeof x==='string' ? x : JSON.stringify(x,null,2)).join(' ');
      $dbg.textContent = ($dbg.textContent ? $dbg.textContent + '\n' : '') + line;
    }
    function todayKey(){
      const s = new Intl.DateTimeFormat('zh-Hant-TW',{ timeZone:'Asia/Taipei', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
      return s.replaceAll('/',''); // yyyymmdd
    }
    function getUserId(){
      const k = 'mw_userId';
      let u = localStorage.getItem(k);
      if (!u){ u = 'guest_' + Math.random().toString(36).slice(2,10); localStorage.setItem(k,u); }
      return u;
    }

    // 讀取 manifest 並用檔名建立索引
    async function loadManifest() {
      try {
        const resp = await fetch('/cards-manifest.json', { cache: 'no-store' });
        if (!resp.ok) throw new Error(resp.status + ' ' + resp.statusText);
        const arr = await resp.json(); // [{ id, name, image }]
        const byFile = new Map();
        for (const m of arr) {
          const fname = String(m.image || '').split('/').pop().toLowerCase(); // 001.png
          if (fname) byFile.set(fname, m);
        }
        dbg('[manifest] loaded', arr.length);
        return { manifest: arr, byFile };
      } catch (e) {
        dbg('[manifest] 無法讀取（可忽略）', e.message || e);
        return { manifest: null, byFile: new Map() };
      }
    }

    (async function init(){
      try{
        // ① Initialize（若已被錯誤 app 初始化，檢查 storageBucket；沒有就刪掉重建）
        const FALLBACK = {
          apiKey: "AIzaSyCCUzxkpn1quR9PPSBeZBGG17XVh8vPzjY",
          authDomain: "medwell-test1.firebaseapp.com",
          projectId: "medwell-test1",
          storageBucket: "medwell-test1.appspot.com",
          messagingSenderId: "860851688843",
          appId: "1:860851688843:web:622eb8feccad45ce640b8e",
          measurementId: "G-9FGX9SG7XB"
        };
        let app;
        if (!firebase.apps.length) {
          app = firebase.initializeApp(FALLBACK);
        } else {
          app = firebase.app();
          if (!app.options || !app.options.storageBucket) {
            await app.delete();
            app = firebase.initializeApp(FALLBACK);
          }
        }
        dbg('[cfg]', app.options);

        const db = firebase.firestore();
        const storage = firebase.storage();

        // ② Storage 抓清單
        const folderRef = storage.ref('images/knowledge'); // 不要有前導斜線
        const res = await folderRef.listAll();
        dbg('[storage items]', res.items.length);
        if (!res.items.length){ $err.textContent = 'images/knowledge 沒有檔案可抽。'; return; }

        const cards = [];
        for (const it of res.items){
          try{
            const url = await it.getDownloadURL();
            cards.push({ name: it.name, url, path: it.fullPath });
          }catch(e){ dbg('[URL err]', it.fullPath, e.message); }
        }
        if (!cards.length){ $err.textContent = '取得下載連結失敗（請檢查 Storage 規則 / App Check）。'; return; }

        // ②-2 合併 manifest（★ 新增）
        const { byFile } = await loadManifest();
        const ONLY_MANIFEST = false; // ← 若想只抽 manifest 白名單，改成 true

        let pool = cards.map(c => {
          const meta = byFile.get(c.name.toLowerCase());
          return {
            ...c,
            id: meta?.id || c.name,
            displayName: meta?.name || c.name.replace(/\.\w+$/, '')
          };
        });
        if (ONLY_MANIFEST) {
          pool = pool.filter(c => byFile.has(c.name.toLowerCase()));
        }
        dbg('[pool] size', pool.length);
        if (!pool.length){
          $err.textContent = '沒有符合條件的卡片可抽（請檢查 manifest 與 Storage）。';
          return;
        }

        // ③ 額度（每日）
        const userId = getUserId();
        const dateKey = todayKey();
        const metaRef = db.collection('draw_meta').doc(`${userId}_${dateKey}`);

        async function loadOrInitMeta(){
          const s = await metaRef.get();
          if (s.exists) return s.data();
          const initData = { userId, dateKey, quota: 3, used: 0, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
          await metaRef.set(initData);
          return initData;
        }

        let meta = await loadOrInitMeta();
        function renderMeta(){
          $quota.textContent = String(meta.quota ?? 0);
          $used.textContent  = String(meta.used  ?? 0);
          $btn.disabled = !(meta.used < meta.quota);
        }
        renderMeta();

        async function saveHistory(card){
          await db.collection('draw_history').add({
            userId, dateKey,
            cardId: card.id,
            cardName: card.name,               // 檔名（例：001.png）
            cardDisplayName: card.displayName, // 顯示名（例：健康知識 001）
            imageUrl: card.url,
            imagePath: card.path,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
        async function incUsed(){
          const newUsed = (meta.used||0)+1;
          await metaRef.update({ used: newUsed, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
          meta.used = newUsed; renderMeta();
        }

        // ④ 抽卡
        $btn.addEventListener('click', async () => {
          try{
            $err.textContent = '';
            if (!(meta.used < meta.quota)){ $err.textContent = '今日抽卡次數已用完'; return; }
            const picked = pool[Math.floor(Math.random()*pool.length)];
            $name.textContent = picked.displayName;
            $img.src = picked.url;
            $box.classList.remove('hidden');
            await saveHistory(picked);
            await incUsed();
            dbg('[draw]', { userId, picked: picked.name });
          }catch(e){
            console.error(e);
            $err.textContent = '抽卡失敗，請稍後重試';
            dbg('[draw err]', e);
          }
        });

        dbg('[ready]', { userId, dateKey });
      }catch(err){
        console.error(err);
        $err.textContent = '初始化失敗：' + (err?.message || err);
        dbg('[init err]', err);
      }
    })();
  </script>
</body>
</html>
