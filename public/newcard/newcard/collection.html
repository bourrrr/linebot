<!-- /public/collection.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>我的圖鑑</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{ --green:#588157; --soft:#efede9; --ink:#363636; --muted:#8e8e8c; }
    body{ background:var(--soft); color:var(--ink); font-family:system-ui,sans-serif; }
    .card{ background:#fff; border:1px solid #e5e7eb; border-radius:1rem; padding:.75rem; box-shadow:0 4px 6px rgba(0,0,0,.06); }
    .caption{ margin-top:.4rem; font-size:.85rem; color:var(--muted); text-align:center; }
    .btn{ display:inline-flex; align-items:center; gap:.4rem; border:1px solid var(--green); color:var(--green); padding:.5rem .8rem; border-radius:.75rem; font-weight:600; }
    .pill{ background:#e8f3ea; color:#1f6e43; border:1px solid #b5d9bf; border-radius:.5rem; padding:.2rem .5rem; font-weight:600; }
  </style>
</head>
<body>
  <section class="max-w-5xl mx-auto p-5">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-bold" style="color:var(--green)">我的圖鑑</h1>
      <div class="flex gap-2">
        <a class="btn" href="index.html">← 返回首頁</a>
        <a class="btn" href="knowledge-draw.html">🎴 前往抽卡</a>
      </div>
    </div>

    <p class="text-gray-600 mb-3">查看你收集到的知識圖片與獲得次數。</p>

    <div class="flex gap-3 mb-4">
      <span class="pill">已收集：<b id="kinds">0</b> 張</span>
      <span class="pill">總獲得：<b id="total">0</b> 次</span>
    </div>

    <p id="errorMsg" class="text-red-600 font-semibold mb-3"></p>
    <p id="emptyState" class="text-gray-600 mb-3 hidden">目前沒有抽卡紀錄，去抽一張吧！</p>
    <pre id="debug" class="mt-3 text-xs rounded p-3 whitespace-pre-wrap bg-[#efefef] border border-dashed border-[#b5d9bf]"></pre>

    <div id="collectionList" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
  </section>

  <!-- Firebase compat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>

  <script>
    const $list  = document.getElementById('collectionList');
    const $empty = document.getElementById('emptyState');
    const $err   = document.getElementById('errorMsg');
    const $dbg   = document.getElementById('debug');
    const $kinds = document.getElementById('kinds');
    const $total = document.getElementById('total');

    function dbg(...args){
      console.log(...args);
      const line = args.map(x => typeof x==='string' ? x : JSON.stringify(x,null,2)).join(' ');
      $dbg.textContent = ($dbg.textContent ? $dbg.textContent + '\n' : '') + line;
    }

    const userId = localStorage.getItem('mw_userId') || 'guest_unknown';

    function toMillis(ts){
      if (!ts) return 0;
      try { return ts.toMillis ? ts.toMillis() : (ts.seconds ? ts.seconds*1000 : 0); } catch { return 0; }
    }

    // 取最後一段檔名（或路徑）
    function baseName(p){
      if (!p) return '';
      const s = String(p);
      const seg = s.split('/').pop() || s;
      return seg.toLowerCase();
    }

    async function ensureUrl(storage, rec){
      if (rec.imageUrl) return rec.imageUrl;
      if (rec.imagePath){
        try { return await storage.ref(rec.imagePath).getDownloadURL(); }
        catch (e) { dbg('[getDownloadURL err]', rec.imagePath, e.message); }
      }
      return '';
    }

    // 讀取 manifest 並建立以檔名為 key 的索引
    async function loadManifest() {
      try {
        const resp = await fetch('/cards-manifest.json', { cache: 'no-store' });
        if (!resp.ok) throw new Error(resp.status + ' ' + resp.statusText);
        const arr = await resp.json(); // [{ id, name, image }]
        const byFile = new Map();
        for (const m of arr) {
          const fname = baseName(m.image);
          if (fname) byFile.set(fname, m);
        }
        dbg('[manifest] loaded', arr.length);
        return { manifest: arr, byFile };
      } catch (e) {
        dbg('[manifest] 無法讀取（可忽略）', e.message || e);
        return { manifest: null, byFile: new Map() };
      }
    }

    (async function init(){
      // ① Initialize（若之前被初始化成沒有 storageBucket，就刪掉重建）
      const FALLBACK = {
        apiKey: "AIzaSyCCUzxkpn1quR9PPSBeZBGG17XVh8vPzjY",
        authDomain: "medwell-test1.firebaseapp.com",
        projectId: "medwell-test1",
        storageBucket: "medwell-test1.appspot.com",
        messagingSenderId: "860851688843",
        appId: "1:860851688843:web:622eb8feccad45ce640b8e",
        measurementId: "G-9FGX9SG7XB"
      };
      let app;
      if (!firebase.apps.length) {
        app = firebase.initializeApp(FALLBACK);
      } else {
        app = firebase.app();
        if (!app.options || !app.options.storageBucket) {
          await app.delete();
          app = firebase.initializeApp(FALLBACK);
        }
      }
      dbg('[cfg]', app.options);

      const db = firebase.firestore();
      const storage = firebase.storage();

      try{
        // ② 抓我的抽卡紀錄（只 where userId，避免複合索引）
        const snap = await db.collection('draw_history').where('userId','==',userId).get();
        if (snap.empty){ $empty.classList.remove('hidden'); return; }

        // ③ 載入 manifest（補上顯示名稱）
        const { byFile } = await loadManifest();

        const rows = snap.docs.map(d => ({ id:d.id, ...d.data() }));
        rows.sort((a,b)=> toMillis(b.createdAt)-toMillis(a.createdAt));

        // ④ 統計：以 cardId 優先；其次用檔名（cardName 或 imagePath 的 basename）
        const kindsSet = new Set();
        const counter = {}; // 每種類的獲得次數
        for (const r of rows) {
          const key = r.cardId || baseName(r.cardName || r.imagePath) || r.imagePath || 'unknown';
          kindsSet.add(key);
          counter[key] = (counter[key] || 0) + 1;
        }
        $kinds.textContent = String(kindsSet.size);
        $total.textContent = String(rows.length);

        // ⑤ Render
        const frag = document.createDocumentFragment();
        for (const r of rows){
          const card = document.createElement('div'); card.className = 'card';

          const img = document.createElement('img');
          img.alt = r.cardDisplayName || r.cardName || '';
          img.loading = 'lazy';
          img.onerror = () => { img.src = '/images/placeholder.svg'; }; // 根目錄絕對路徑
          img.src = await ensureUrl(storage, r);

          // 顯示名稱：cardDisplayName > manifest.name(依檔名對) > cardName 去副檔名 > imagePath > (未命名)
          const cap = document.createElement('div'); cap.className = 'caption';
          const fname = baseName(r.cardName || r.imagePath);
          const nameFromManifest = byFile.get(fname)?.name;
          const labelRaw = r.cardDisplayName || nameFromManifest || (r.cardName || '').replace(/\.(png|jpe?g|webp|gif)$/i,'') || r.imagePath || '(未命名)';
          cap.textContent = labelRaw;

          card.appendChild(img);
          card.appendChild(cap);
          frag.appendChild(card);
        }
        $list.innerHTML = '';
        $list.appendChild(frag);

        dbg('[collection]', JSON.stringify({ count: rows.length, kinds: kindsSet.size }, null, 2));
      }catch(e){
        console.error(e);
        $err.textContent = '讀取圖鑑失敗：' + (e.message || e);
      }
    })();
  </script>
</body>
</html>
