let quizQuestions = [];

function startQuiz() {
  quizQuestions = [...questions].sort(() => 0.5 - Math.random()).slice(0, 5);
  current = 0;
  score = 0;
  document.getElementById("result").innerHTML = "";
  showQuestion();
}

function showQuestion() {
  if (current >= quizQuestions.length) {
    finishQuiz();
    return;
  }
  const q = quizQuestions[current];
  document.getElementById("quiz").innerHTML = `
    <div class="question">
      <h3>${current + 1}. ${q.q}</h3>
      ${q.a.map((opt, i) => 
        `<button onclick="window.__checkAns(${i}, ${q.correct})">${opt}</button>`
      ).join("")}
    </div>
  `;
}

window.__checkAns = (selected, correct) => {
  if (selected === correct - 1) score++;
  current++;
  showQuestion();
};

/* ==== 新增：寫入 Firestore（每日一次、≥3 題加 1 次抽卡） ==== */
async function writeQuizResultAndMaybeBonus(uid, dateKey, score, total) {
  const ref = doc(db, "users", uid, DRAWS_SUBCOL, dateKey);
  await runTransaction(db, async (tx) => {
    const snap = await tx.get(ref);
    const data = snap.exists() ? snap.data() : {};

    // 已做過測驗就不再處理
    if (data.quiz_taken === true) return;

    const base = {
      quiz_taken: true,
      quiz_score: score,
      quiz_total: total,
      quiz_updatedAt: serverTimestamp(),
    };

    if (score >= 3 && !data.quiz_bonus_applied) {
      const currentQuota = typeof data.quota === "number" ? data.quota : 1;
      const newQuota = Math.min(currentQuota + 1, 3);
      tx.set(ref, {
        ...base,
        quiz_passed: true,
        quiz_bonus_applied: true,
        quota: newQuota,
      }, { merge: true });
    } else {
      tx.set(ref, {
        ...base,
        quiz_passed: score >= 3
      }, { merge: true });
    }
  });
}

async function finishQuiz() {
  const resultEl = document.getElementById("result");
  let html = `<h2>✅ 你答對了 ${score} / ${quizQuestions.length} 題</h2>`;
  if (score >= 3) {
    html += `<p>🎉 恭喜獲得一次額外抽卡機會！</p>`;
  } else {
    html += `<p>😅 未達成條件，下次加油！</p>`;
  }
  html += `<h3>📌 正確答案</h3><ol>`;
  quizQuestions.forEach((q) => {
    const correctIndex = q.correct - 1;
    html += `<li>${q.q}<br><strong>正確答案：</strong> ${q.a[correctIndex]}</li>`;
  });
  html += `</ol>`;
  //唯一修改：修正為抽卡頁的正確路徑 ▼▼ -->
  html += `<button class="btn-home" onclick="location.href='/newcard/knowledge-draw.html'">前往隨機獲得知識圖卡</button>`;
  // 唯一修改：修正為抽卡頁的正確路徑 ▲▲ -->
  html += `<button class="btn-home" onclick="location.href='indexcard.html'">返回首頁</button>`;

  document.getElementById("quiz").innerHTML = "";
  resultEl.innerHTML = html;

  // 寫入雲端（首次當日測驗才會生效；失敗不影響畫面）
  try {
    const prof = await liff.getProfile();
    const uid  = prof.userId;
    const date = todayKey();
    await writeQuizResultAndMaybeBonus(uid, date, score, quizQuestions.length);
  } catch (e) {
    console.error("[quiz write error]", e);
  }
}

/* ==== 進頁時檢查是否已做過（今日只允許一次） ==== */
async function gateAndStart() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }

    const prof = await liff.getProfile();
    const uid  = prof.userId;
    const date = todayKey();

    const ref = doc(db, "users", uid, DRAWS_SUBCOL, date);
    const snap = await getDoc(ref);
    const data = snap.exists() ? snap.data() : null;

    if (data?.quiz_taken) {
      // 今天做過了：顯示提示
      document.getElementById("quiz").innerHTML = `
        <div class="question">
          <h3>今天的測驗已經完成囉！</h3>
          ${data.quiz_passed ? `<p>你今天已獲得 +1 抽卡（若抽卡頁未更新，請重整）。</p>` : `<p>未達成條件，明天再試一次！</p>`}
          <button class="btn-home" onclick="location.href='indexcard.html'">返回首頁</button>
        </div>
      `;
      document.getElementById("result").innerHTML = "";
    } else {
      startQuiz();
    }
  } catch (e) {
    // 若 LIFF 失敗，允許離線練習（不鎖定、不加抽）
    console.warn("[LIFF init failed, offline practice mode]", e);
    startQuiz();
  }
}

gateAndStart();
</script>
