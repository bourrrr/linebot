<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>回饋專區</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .stars {
      display: flex;
      gap: 0.5rem;
    }
    .star-label {
      font-size: 2rem;
      cursor: pointer;
      transition: transform 0.2s;
      color: #ccc;
    }
    .star-label:hover {
      transform: scale(1.2);
    }
    .star-label.checked {
      color: gold;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold text-center mb-4">📝 回饋專區</h1>

    <form id="feedbackForm" class="space-y-4">
      <div>
        <label class="block mb-1 font-medium">評分：</label>
        <div id="starContainer" class="stars">
          <input type="radio" id="star1" name="rating" value="1" required hidden>
          <label for="star1" class="star-label" data-value="1">☆</label>

          <input type="radio" id="star2" name="rating" value="2" hidden>
          <label for="star2" class="star-label" data-value="2">☆</label>

          <input type="radio" id="star3" name="rating" value="3" hidden>
          <label for="star3" class="star-label" data-value="3">☆</label>

          <input type="radio" id="star4" name="rating" value="4" hidden>
          <label for="star4" class="star-label" data-value="4">☆</label>

          <input type="radio" id="star5" name="rating" value="5" hidden>
          <label for="star5" class="star-label" data-value="5">☆</label>
        </div>
      </div>

      <div>
        <label for="comment" class="block mb-1 font-medium">您的評論：</label>
        <textarea id="comment" required class="w-full p-2 border rounded resize-none" rows="4" placeholder="請輸入您的回饋..."></textarea>
      </div>

      <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">提交回饋</button>
    </form>

    <div id="result" class="mt-4 text-center text-green-600 hidden">✅ 感謝您的回饋！</div>

    <div class="mt-6 text-center">
      <a href="home.html" class="text-blue-500 hover:underline">← 回首頁</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, collection, addDoc, Timestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { firebaseConfig } from './firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const form = document.getElementById("feedbackForm");
    const resultMsg = document.getElementById("result");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const rating = form.rating.value;
      const comment = document.getElementById("comment").value;

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          alert("⚠️ 請先登入後再提供回饋！");
          window.location.href = "login.html";
          return;
        }

        try {
          await addDoc(collection(db, "feedbacks"), {
            userId: user.uid,
            rating: parseInt(rating),
            comment,
            createdAt: Timestamp.now()
          });

          resultMsg.classList.remove("hidden");
          form.reset();
          updateStarUI(0);
        } catch (err) {
          console.error("回饋提交失敗", err);
          alert("❌ 提交失敗，請稍後再試。");
        }
      });
    });

    const starLabels = document.querySelectorAll('.star-label');
    starLabels.forEach(label => {
      label.addEventListener('click', () => {
        const val = parseInt(label.dataset.value);
        updateStarUI(val);
      });
    });

    function updateStarUI(val) {
      starLabels.forEach(label => {
        const starVal = parseInt(label.dataset.value);
        label.textContent = starVal <= val ? '★' : '☆';
        label.classList.toggle('checked', starVal <= val);
      });
    }
  </script>
</body>
</html>
