<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>台灣四大港口進口貨櫃量趨勢圖</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(120deg, #e0e7ff 0%, #f0fdf4 100%);
      min-height: 100vh;
      margin: 0;
    }
    #container {
      max-width: 900px;
      margin: 48px auto;
      background: #fff;
      padding: 38px 32px 32px 32px;
      border-radius: 28px;
      box-shadow: 0 8px 32px #a7b9e580, 0 1.5px 3px #0001;
      position: relative;
      transition: box-shadow .3s;
    }
    #container:hover {
      box-shadow: 0 12px 40px #a7b9e5cc, 0 1.5px 3px #0001;
    }
    h2 {
      font-weight: 700;
      font-size: 2.2em;
      letter-spacing: 1px;
      color: #1e293b;
      margin-bottom: 18px;
      text-shadow: 0 2px 12px #60a5fa33;
    }
    label {
      font-weight: 500;
      font-size: 1.12em;
      color: #334155;
    }
    select {
      font-size: 1.12em;
      padding: 8px 18px;
      border-radius: 16px;
      border: 1.2px solid #a5b4fc;
      margin: 0 12px 12px 0;
      background: #f1f5f9;
      box-shadow: 0 2px 8px #60a5fa13 inset;
      transition: border-color .2s;
      outline: none;
    }
    select:focus {
      border-color: #2563eb;
      background: #e0e7ff;
    }
    #chart {
      margin-top: 16px;
      background: #f8fafc;
      border-radius: 20px;
      box-shadow: 0 2px 12px #93c5fd18;
      padding: 8px 0 6px 0;
      transition: box-shadow .3s;
      animation: fadein .7s;
    }
    @keyframes fadein {
      0% { opacity: 0; transform: translateY(32px);}
      100% { opacity: 1; transform: none;}
    }
    .info-card {
      background: linear-gradient(96deg, #e0e7ff 70%, #bae6fd 100%);
      padding: 18px 24px;
      margin-bottom: 18px;
      border-radius: 18px;
      box-shadow: 0 2px 12px #a5b4fc29;
      display: flex;
      align-items: center;
      gap: 30px;
      font-size: 1.12em;
      animation: fadein .8s;
    }
    .info-card strong {
      font-size: 1.25em;
      color: #2563eb;
      font-weight: 700;
    }
   
.my-return-btn {
  display: block;
  background: linear-gradient(90deg,#2563eb 40%,#60a5fa 100%);
  color: #fff;
  padding: 10px 40px;
  border-radius: 99px;
  font-weight: 600;
  font-size: 1.1em;
  text-decoration: none;
  margin: 36px auto 0 auto;
  box-shadow: 0 2px 10px #2563eb25;
  transition: background .18s, transform .12s;
  letter-spacing: 1.5px;
  text-align: center;
}

.my-return-btn:hover {
  background: linear-gradient(90deg,#1d4ed8 40%,#38bdf8 100%);
  color: #fff;
  transform: translateY(-2px) scale(1.06);
}


centered-button {
  display: block;
  width: fit-content;           /* 自動依文字寬度調整，可改為固定寬 */
  margin: 0 auto;               /* 左右置中 */
  padding: 12px 40px;
  background: linear-gradient(90deg, #2563eb 40%, #60a5fa 100%);
  color: white;
  font-size: 1.1em;
  font-weight: 600;
  border-radius: 99px;
  text-align: center;           /* ⬅️ 文字置中 */
  text-decoration: none;
  letter-spacing: 1.5px;
  box-shadow: 0 2px 10px #2563eb25;
  transition: background 0.2s ease, transform 0.2s ease;
}

.centered-button:hover {
  background: linear-gradient(90deg, #1d4ed8 40%, #38bdf8 100%);
  transform: translateY(-2px) scale(1.04);
}

  </style>
</head>
<body>
  <div id="container">
    <h2>台灣四大港口進口貨櫃量折線圖</h2>
    <div class="info-card">
      <label for="port">選擇港口：</label>
      <select id="port"></select>
    </div>
    <canvas id="chart" width="760" height="370"></canvas>
    <a href="港.html" class="my-return-btn">← 返回港口資訊頁</a>
    
    

  </div>

   

  <script>
    // 只要這四港
    const portMap = {
      "高雄港(TWKHH)": "高雄港",
      "臺中港(TWTXG)": "台中港",
      "基隆港(TWKEL)": "基隆港",
      "臺北港(TWTPE)": "台北港"
    };

    let teuData = {};
    let chart;
    fetch('taiwan_ports_import_teu.json')
      .then(res => res.json())
      .then(data => {
        teuData = {};
        Object.keys(portMap).forEach(key => {
          if (data[key]) teuData[key] = data[key];
        });

        const portSelect = document.getElementById('port');
        portSelect.innerHTML = '';

        Object.keys(portMap).forEach(key => {
          const opt = document.createElement('option');
          opt.value = key;
          opt.textContent = portMap[key];
          portSelect.appendChild(opt);
        });

        // 取得網址參數
        const urlParams = new URLSearchParams(window.location.search);
        const urlPort = urlParams.get('port');

        // 自動選取網址傳入港口
        if (urlPort && teuData[urlPort]) {
          portSelect.value = urlPort;
        } else {
          portSelect.selectedIndex = 0;
        }

        portSelect.onchange = drawChart;
        drawChart();
      });
    function drawChart() {
      const port = document.getElementById('port').value;
      const dataObj = teuData[port];
      if (!dataObj) return;
      const labels = Object.keys(dataObj).sort();
      const values = labels.map(k => dataObj[k]);
      const ctx = document.getElementById('chart').getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: portMap[port] + ' 進口TEU',
            data: values,
            borderWidth: 3,
            borderColor: '#2563eb',
            backgroundColor: '#60a5fa',
            pointRadius: 3,
            fill: false,
            tension: 0.18
          }]
        },
        options: {
          responsive: false,
          plugins: {
            legend: { display: true }
          },
          scales: {
            x: { title: { display: true, text: '年月' } },
            y: { title: { display: true, text: 'TEU' }, beginAtZero: true }
          }
        }
      });
    }
  </script>
   <script>
    <a href="javascript:goBackOrHome()" class="my-return-btn">← 返回港口資訊頁</a>
</script>
</body>
</html>
