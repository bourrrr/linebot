<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>台灣四大港預測進口TEU折線圖</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #f3f4f9 60%, #e0f2fe 100%);
      font-family: 'Noto Sans TC', Arial, sans-serif;
    }
    .container {
      max-width: 950px;
      margin: 40px auto 30px auto;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 8px 36px #38bdf86b;
      padding: 36px 36px 24px 36px;
    }
    h2 {
      margin-bottom: 30px;
      text-align: center;
      font-size: 2.3em;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #2563eb 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .select-row {
      margin-bottom: 24px;
      text-align: center;
    }
    select {
      font-size: 1.15em;
      border-radius: 12px;
      padding: 8px 30px 8px 14px;
      border: 1.4px solid #38bdf8;
      background: #f1f5f9;
      box-shadow: 0 2px 10px #bae6fd44;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #2563eb;
    }
    .chart-wrap {
      background: #f8fafc;
      border-radius: 24px;
      padding: 30px 18px 18px 18px;
      box-shadow: 0 2px 18px #bae6fd33;
      max-width: 850px;
      margin: 0 auto;
    }
    @media (max-width: 950px) {
      .container {max-width:98vw; padding: 4vw 1vw;}
      .chart-wrap {padding: 16px 2vw 16px 2vw;}
    }
    .note {color:#64748b; font-size:1em; text-align:center; margin:18px 0 0 0;}

    .return-btn {
  display: block;
  background: linear-gradient(90deg, #38bdf8 60%, #2563eb 100%);
  color: #fff;
  padding: 12px 38px;
  border-radius: 99px;
  font-weight: 600;
  font-size: 1.12em;
  text-decoration: none;
  margin: 32px auto 0 auto;
  box-shadow: 0 2px 10px #2563eb25;
  transition: background .16s, transform .10s;
  letter-spacing: 1.3px;
  text-align: center;
  width: fit-content;
}
.return-btn:hover {
  background: linear-gradient(90deg, #2563eb 60%, #38bdf8 100%);
  color: #fff;
  transform: translateY(-2px) scale(1.04);
}
  </style>
</head>
<body>
  <div class="container">
    <h2>台灣四大港未來預測進口TEU折線圖</h2>
    <div class="select-row">
      <label for="portSel">選擇港口：</label>
      <select id="portSel">
        <option value="高雄港(TWKHH)">高雄港</option>
        <option value="基隆港(TWKEL)">基隆港</option>
        <option value="臺中港(TWTXG)">臺中港</option>
        <option value="臺北港(TWTPE)">臺北港</option>
      </select>
    </div>
    <div class="chart-wrap">
      <canvas id="mainChart" width="800" height="430"></canvas>
      <a href="港.html" class="return-btn">← 返回港口資訊頁</a>
    </div>
    
  </div>
  <script>
    let forecastData = {};
    let chart = null;

    fetch('預測進口TEU版.json')
      .then(res => res.json())
      .then(json => {
        forecastData = json;

        const portSel = document.getElementById('portSel');
        const urlParams = new URLSearchParams(window.location.search);
        const urlPort = urlParams.get('port');

        // ✅ 如果網址帶了港口且資料中有，就選它，否則選第一個
        if (urlPort && forecastData[urlPort]) {
          portSel.value = urlPort;
          drawChart(urlPort);
        } else {
          portSel.selectedIndex = 0;
          drawChart(portSel.value);
        }
      });

    function drawChart(portKey) {
      if (!forecastData[portKey]) return;
      const all = forecastData[portKey];
      const labels = Object.keys(all).sort();
      const teus = labels.map(m => all[m]);
      // 畫折線圖
      const ctx = document.getElementById('mainChart').getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: portKey + ' 預測進口TEU',
            data: teus,
            borderColor: '#2563eb',
            backgroundColor: '#38bdf8cc',
            borderWidth: 3.5,
            pointRadius: 6,
            pointBackgroundColor: '#2563eb',
            pointHoverRadius: 10,
            pointHoverBackgroundColor: '#38bdf8',
            tension: 0.18,
            fill: false
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { title: { display: true, text: '年月' }, ticks: { font: { size: 15 } } },
            y: { title: { display: true, text: '預測進口TEU' }, beginAtZero: true }
          }
        }
      });
    }

    document.getElementById('portSel').onchange = function(){
      drawChart(this.value);
    };
  </script>
</body>
</html>
