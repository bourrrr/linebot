<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>台灣四大港預測出口TEU目的港橫條圖</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background: #f0f6fc; font-family: 'Noto Sans TC', Arial, sans-serif; }
    .container { max-width: 950px; margin: 40px auto 24px auto; background: #fff; border-radius: 22px; box-shadow: 0 8px 36px #38bdf86b; padding: 36px 36px 24px 36px; }
    h2 { margin-bottom: 26px; text-align: center; font-size: 2em; letter-spacing: 2px; background: linear-gradient(90deg,#2563eb 60%,#38bdf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
    .select-row { text-align:center; margin-bottom:24px;}
    select { font-size: 1.1em; border-radius: 12px; padding: 8px 28px 8px 14px; border: 1.4px solid #38bdf8; background: #f1f5f9; font-weight:600; color:#2563eb; }
    .chart-wrap { background: #f8fafc; border-radius: 24px; padding: 30px 18px 18px 18px; box-shadow: 0 2px 18px #bae6fd33; max-width: 850px; margin: 0 auto; }
    @media (max-width:950px) {.container{max-width:97vw; padding:4vw 1vw;} .chart-wrap{padding:16px 2vw 16px 2vw;}}
  
    .return-btn {
  display: block;
  background: linear-gradient(90deg, #38bdf8 60%, #2563eb 100%);
  color: #fff;
  padding: 12px 38px;
  border-radius: 99px;
  font-weight: 600;
  font-size: 1.12em;
  text-decoration: none;
  margin: 32px auto 0 auto;
  box-shadow: 0 2px 10px #2563eb25;
  transition: background .16s, transform .10s;
  letter-spacing: 1.3px;
  text-align: center;
  width: fit-content;
}
.return-btn:hover {
  background: linear-gradient(90deg, #2563eb 60%, #38bdf8 100%);
  color: #fff;
  transform: translateY(-2px) scale(1.04);
}
  
  </style>
</head>
<body>
  <div class="container">
    <h2>台灣四大港<br>預測主要目的港的出口TEU</h2>
    <div class="select-row">
      <label for="portSel">選擇港口：</label>
      <select id="portSel">
        <option value="高雄港(TWKHH)">高雄港</option>
        <option value="基隆港(TWKEL)">基隆港</option>
        <option value="臺中港(TWTXG)">臺中港</option>
        <option value="臺北港(TWTPE)">臺北港</option>
      </select>
    </div>
    <div class="chart-wrap">
      <canvas id="mainChart" width="850" height="480"></canvas>
    </div>
    <a href="港.html" class="return-btn">← 返回港口資訊頁</a>
  </div>
  <script>
    let forecastData = {};
    let chart = null;

    fetch('預測出口TEU_所有目的港.json')
      .then(res => res.json())
      .then(json => {
        forecastData = json;

        const portSel = document.getElementById('portSel');
        const urlParams = new URLSearchParams(window.location.search);
        const urlPort = urlParams.get('port');

        // 如果網址中有港口，且該港口存在資料中，就選擇它
        if (urlPort && forecastData[urlPort]) {
          portSel.value = urlPort;
          drawChart(urlPort);
        } else {
          // 預設顯示第一個
          portSel.selectedIndex = 0;
          drawChart(portSel.value);
        }
      });
    function drawChart(portKey) {
      if (!forecastData[portKey]) return;
      const portObj = forecastData[portKey];
      // 依TEU多寡排序
      const items = Object.entries(portObj).sort((a,b)=>b[1]-a[1]);
      const labels = items.map(e => e[0]);
      const teus = items.map(e => e[1]);
      // 畫橫條圖
      const ctx = document.getElementById('mainChart').getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: portKey + ' 預測出口TEU',
            data: teus,
            backgroundColor: 'rgba(37,99,235,0.78)'
          }]
        },
        options: {
          indexAxis: 'y',
          plugins: { legend: { display: false } },
          scales: {
            x: { title: { display: true, text: '預測出口TEU' }, beginAtZero:true },
            y: { title: { display: true, text: '主要目的港' }, ticks: { font: { size: 16 } } }
          }
        }
      });
    }

    document.getElementById('portSel').onchange = function(){
      drawChart(this.value);
    };
  </script>
</body>
</html>
