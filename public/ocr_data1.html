<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MakeWell 數據紀錄</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(120deg, #e0e7ff 0%, #f8fafc 70%);
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-40px);}
      to   { opacity: 1; transform: translateY(0);}
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px);}
      to   { opacity: 1; transform: translateY(0);}
    }
    .animate-fadeInDown {
      animation: fadeInDown 0.8s cubic-bezier(0.23,1,0.32,1);
    }
    .animate-fadeInUp {
      animation: fadeInUp 0.95s 0.2s cubic-bezier(0.23,1,0.32,1) backwards;
    }
  </style>
</head>
<body class="flex flex-col items-center min-h-screen font-[Noto Sans TC,sans-serif]">
  <header class="w-full bg-gradient-to-r from-[#929fff] via-[#9de0ff] to-[#ffa897] py-14 shadow-xl flex flex-col items-center rounded-b-[2.5rem] animate-fadeInDown">
    <h1 class="text-white text-5xl md:text-6xl font-extrabold tracking-widest drop-shadow-xl mb-3">MakeWell</h1>
    <p class="text-white text-xl md:text-2xl tracking-wide font-medium drop-shadow">慢理歲月 樂活永悅</p>
  </header>

  <main class="text-[115%] w-[92vw] max-w-[840px] md:max-w-[960px] rounded-[3rem] shadow-2xl bg-white bg-opacity-95 border border-[#e5e7fa] px-10 py-12 md:px-14 md:py-14 mt-14 z-10 animate-fadeInUp relative overflow-visible">
    <div class="flex items-center mb-8 border-b border-[#d3d9fd] pb-6">
      <span class="px-5 py-1.5 rounded-xl bg-[#e3ebff] text-[#433e7c] font-semibold text-xl tracking-wider shadow-sm">
        數據紀錄
      </span>
    </div>

    <div id="record-list" class="mb-10 flex flex-col gap-5"></div>

    <!-- 分頁按鈕 -->
    <div class="flex justify-center gap-3 mt-4">
      <button id="prevPage" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-xl hover:bg-gray-300">上一頁</button>
      <button id="nextPage" class="px-4 py-2 bg-indigo-200 text-indigo-800 rounded-xl hover:bg-indigo-300">下一頁</button>
    </div>

    <div class="flex items-center justify-between mt-6">
      <button class="flex flex-col items-center text-[130%] text-[#433e7c] hover:text-[#bb60b2] transition">
        <div class="w-[90px] h-[90px] rounded-full bg-[#f0f4ff] flex items-center justify-center shadow-md hover:shadow-xl duration-200">
          <span>頭像</span>
        </div>
      </button>
      <button onclick="window.location.href='ocr_data2.html'" class="w-20 h-20 rounded-full bg-gradient-to-tr from-[#929fff] via-[#9de0ff] to-[#af87fe] flex items-center justify-center shadow-2xl text-white text-[2.8rem] font-bold hover:scale-110 hover:ring-2 hover:ring-[#bb60b2] transition">
        +
      </button>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc as docRef } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCUzxpn1quR9PPSBeZBGG17XVh8vPzjY",
      authDomain: "medwell-test1.firebaseapp.com",
      projectId: "medwell-test1",
      storageBucket: "medwell-test1.appspot.com",
      messagingSenderId: "860851688843",
      appId: "1:860851688843:web:622eb8feccad45ce640b8e",
      measurementId: "G-9FGX9SG7XB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const recordList = document.getElementById("record-list");
    const prevPageBtn = document.getElementById("prevPage");
    const nextPageBtn = document.getElementById("nextPage");

    const PAGE_SIZE = 4;
    let currentPage = 0;
    let records = [];

    // 取出資料含id
    async function loadRecords() {
      records = [];
      const q = query(collection(db, "health_records"), orderBy("timestamp", "desc"));
      const snapshot = await getDocs(q);
      snapshot.forEach(doc => {
        records.push({ ...doc.data(), _id: doc.id });
      });
    }

    function getRecordType(obj) {
      const keys = Object.keys(obj);
      if (keys.includes('血壓') || keys.includes('blood pressure')) return '血壓紀錄';
      if (keys.includes('血糖') || keys.includes('glucose')) return '血糖紀錄';
      if (keys.includes('脈搏') || keys.includes('pulse')) return '脈搏紀錄';
      if (keys.includes('體重') || keys.includes('weight')) return '體重紀錄';
      if (keys.includes('原始內容')) return '健康紀錄';
      return keys[0] ? (keys[0] + '紀錄') : '健康紀錄';
    }

    function renderPage() {
      recordList.innerHTML = "";
      const start = currentPage * PAGE_SIZE;
      const end = start + PAGE_SIZE;
      const pageRecords = records.slice(start, end);

      pageRecords.forEach((data, idx) => {
        const date = new Date(data.timestamp?.seconds * 1000);
        const month = date.getMonth() + 1;
        const day = date.getDate();
        let showObj = data.data || data;

        const html = `
          <div class="rounded-3xl bg-gradient-to-r from-indigo-50 to-white border border-indigo-100 shadow-md p-6 flex items-center transition group hover:scale-[1.015] hover:border-indigo-300 duration-200 relative overflow-visible">
            <!-- 右上角常駐編輯刪除 -->
            <div class="absolute top-2 right-2 flex gap-1 z-50">
              <button class="flex items-center px-2 py-1 rounded-md text-xs text-gray-700 bg-white hover:bg-indigo-50 shadow edit-btn" data-id="${data._id}" data-idx="${start + idx}">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16.862 4.487a2.347 2.347 0 1 1 3.321 3.321L7.547 20.444l-4.062.741.741-4.062 12.636-12.636z"></path></svg>
                編輯
              </button>
              <button class="flex items-center px-2 py-1 rounded-md text-xs text-red-600 bg-white hover:bg-red-50 shadow delete-btn" data-id="${data._id}" data-idx="${start + idx}">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"></path></svg>
                刪除
              </button>
            </div>
            <!-- 左側日期區 -->
            <div class="w-16 h-16 flex flex-col justify-center items-center rounded-2xl bg-white border border-indigo-200 shadow-sm mr-7 flex-shrink-0">
              <span class="text-2xl font-bold text-indigo-400 leading-tight">${day}</span>
              <span class="text-xs text-gray-400 -mt-1">${month}月</span>
            </div>
            <!-- 中間只留分類 badge -->
            <div class="flex-1 flex flex-col md:flex-row items-center md:items-center gap-2 min-w-0">
              <div class="px-3 py-1 rounded-full bg-[#e3ebff] text-[#433e7c] font-semibold text-base shadow-sm mb-2 md:mb-0 md:mr-3 text-center w-28">
                ${getRecordType(showObj)}
              </div>
            </div>
          </div>
        `;
        recordList.insertAdjacentHTML("beforeend", html);
      });

      // 編輯
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.onclick = e => {
          e.stopPropagation();
          const idx = +btn.getAttribute("data-idx");
          localStorage.setItem('edit_data', JSON.stringify(records[idx]));
          window.location.href = `ocr_data2.html?id=${records[idx]._id}`;
        };
      });

      // 刪除
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.onclick = async e => {
          e.stopPropagation();
          const idx = +btn.getAttribute("data-idx");
          const _id = records[idx]._id;
          if (!confirm('確定要刪除這筆紀錄嗎？')) return;
          try {
            await deleteDoc(docRef(db, "health_records", _id));
            alert('已刪除！');
            // 前端刪除
            records.splice(idx, 1);
            renderPage();
          } catch (err) {
            alert('刪除失敗，請檢查網路或帳號權限');
          }
        };
      });
    }

    prevPageBtn.addEventListener("click", () => {
      if (currentPage > 0) {
        currentPage--;
        renderPage();
      }
    });

    nextPageBtn.addEventListener("click", () => {
      if ((currentPage + 1) * PAGE_SIZE < records.length) {
        currentPage++;
        renderPage();
      }
    });

    // 初始化
    await loadRecords();
    renderPage();
  </script>
</body>
</html>
