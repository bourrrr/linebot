<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MakeWell 數據紀錄（主頁）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --mw-green:#588157;        /* 重綠 */
      --mw-green-light:#659963de;/* 淺綠(含透明) */
      --mw-warm-gray:#dad7cd;    /* 奶灰 */
      --mw-gray:#8e8e8cf2;       /* 灰 */
      --mw-cream:#efede9;        /* 小奶黃 */
      --mw-ink:#363636;          /* 不死黑 */
      --mw-border:#cfcfc9;       /* 邊框淡灰 */
    }
    html,body{ font-family:"Noto Sans TC", system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--mw-ink); }
    body{
      min-height:100vh;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(239,237,233,.8), transparent 60%),
        radial-gradient(800px 400px at 110% 10%, rgba(101,153,99,.12), transparent 55%),
        linear-gradient(180deg, rgba(218,215,205,.65), rgba(218,215,205,.65));
    }

    /* Header */
    .mw-header{
      background: linear-gradient(135deg, var(--mw-green) 0%, rgba(101,153,99,.85) 60%, rgba(101,153,99,.65) 100%);
      border-bottom:1px solid var(--mw-border);
      box-shadow: 0 10px 30px rgba(54,54,54,.15);
    }
    .mw-title{ color:#fff; letter-spacing:.5px; text-shadow:0 2px 8px rgba(0,0,0,.15); }
    .mw-sub{ color:var(--mw-cream); opacity:.95; }

    /* Cards / chips / buttons */
    .mw-card{ background:#fff; border:1px solid var(--mw-border); border-radius:22px; box-shadow:0 10px 30px rgba(0,0,0,.06); }
    .mw-chip{ display:inline-block; background:var(--mw-green-light); color:#fff; padding:.3rem .7rem; border-radius:999px; font-size:.8rem; font-weight:800; letter-spacing:.5px; }
    .mw-btn{ border-radius:14px; padding:.65rem 1rem; font-weight:800; }
    .mw-btn-primary{ background:var(--mw-green); color:#fff; }
    .mw-btn-primary:hover{ filter:brightness(.95); }
    .mw-btn-ghost{ background:#fff; color:#363636; border:1px solid var(--mw-border); }
    .mw-btn-ghost:hover{ background:var(--mw-cream); }

    /* Record item */
    .mw-item{ border:1px solid var(--mw-border); background:linear-gradient(180deg,#ffffff, #fffefb); }
    .mw-date{ background:var(--mw-cream); border:1px solid var(--mw-border); color:var(--mw-ink); }
    .mw-badge{ background:var(--mw-green-light); color:#fff; }

    /* Pager */
    .mw-pager .btn{ border:1px solid var(--mw-border); border-radius:12px; padding:.55rem .9rem; font-weight:700; }
    .mw-pager .prev{ background:#fff; color:#363636; }
    .mw-pager .prev:hover{ background:var(--mw-cream); }
    .mw-pager .next{ background:var(--mw-green); color:#fff; }
    .mw-pager .next:hover{ filter:brightness(.95); }

    /* Fab */
    .mw-fab{
      position: fixed; right: 20px; bottom: 20px;
      width:64px; height:64px; border-radius:50%;
      background: linear-gradient(135deg, var(--mw-green) 0%, rgba(101,153,99,.9) 100%);
      color:#fff; font-size:2rem; font-weight:900;
      box-shadow:0 10px 24px rgba(0,0,0,.18);
      display:flex; align-items:center; justify-content:center;
      transition:.18s ease; z-index:50;
    }
    .mw-fab:hover{ transform:scale(1.06); box-shadow:0 14px 28px rgba(0,0,0,.22); }

    /* Animations */
    @keyframes fadeInDown { from{opacity:0; transform:translateY(-24px)} to{opacity:1; transform:translateY(0)} }
    @keyframes fadeInUp { from{opacity:0; transform:translateY(24px)} to{opacity:1; transform:translateY(0)} }
    .animate-fadeInDown{ animation: fadeInDown .6s cubic-bezier(.23,1,.32,1); }
    .animate-fadeInUp{ animation: fadeInUp .7s cubic-bezier(.23,1,.32,1); animation-fill-mode: both; }

    /* Skeleton loading */
    .skel{
      position: relative; overflow: hidden; background:#fff; border:1px solid var(--mw-border);
      border-radius: 22px; min-height: 88px;
    }
    .skel::after{
      content:""; position:absolute; inset:0;
      background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.05) 50%, rgba(0,0,0,0) 100%);
      animation: skel 1.1s infinite;
    }
    @keyframes skel { from{ transform: translateX(-100%);} to{ transform: translateX(100%);} }
    .skel-body{ display:flex; align-items:center; gap:16px; padding:20px; }
    .skel-dot{ width:64px; height:64px; border-radius:22px; background: var(--mw-cream); border:1px solid var(--mw-border); flex-shrink:0; }
    .skel-pill{ width:110px; height:28px; border-radius:999px; background:#eae8df; }

    @media (prefers-reduced-motion: reduce) {
      .animate-fadeInUp, .animate-fadeInDown, .skel::after { animation: none !important; }
    }
	


@media (max-width: 767px) {

  /* 這一排改成直向排列 + 置中 */
  .section-head{
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* 「數據紀錄」改為標題樣式（不要像按鈕） */
  .section-head .mw-chip{
    background: none !important;
    color: var(--mw-green) !important;
    font-size: 1.4rem !important;
    font-weight: 900 !important;
    padding: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    display: block !important;
    margin: 0 auto 2px auto !important; /* 置中並與下方拉開一點 */
  }

  /* 「近期上傳…」換到下一行置中 */
  .section-head .intro{
    display: block !important;
    width: 100%;
    margin-top: 2px;
    text-align: center;
  }

  /* 手機：只顯示圖示（✎/🗑），隱藏文字 */
  .mw-item .action-label{ display: none !important; }

  /* 圖示按鈕尺寸更俐落 */
  .mw-item .icon-btn{
    padding: .45rem !important;
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
  }
}


  </style>
</head>
<body class="min-h-screen">

  <!-- 主頁 Header -->
  <header class="mw-header">
    <div class="mx-auto max-w-6xl px-4 py-6 md:py-8 flex items-center gap-4">
      <!-- Logo：若你把透明版放在 /images/，可改成 images/makewell-logo-transparent.png -->
      <img src="https://medwell-test1.web.app/makewell-logo.png"
           alt="MakeWell Logo"
           class="h-12 w-auto drop-shadow-md bg-white/10 rounded-lg p-1 animate-fadeInDown">
      <div class="flex-1">
        <div class="flex items-center gap-2">
          <h1 class="mw-title text-3xl md:text-4xl font-black tracking-wide animate-fadeInDown">MakeWell</h1>
          <span class="mw-chip animate-fadeInDown">主頁</span>
        </div>
        <p class="mw-sub text-sm md:text-base mt-1 animate-fadeInDown">慢理歲月，樂活永悅</p>
      </div>
    </div>
  </header>

  <!-- 內容 -->
  <main class="mx-auto max-w-4xl px-4">
    <section class="mw-card mt-6 p-5 md:p-6 animate-fadeInUp">
      <div class="flex items-center justify-between gap-3 flex-wrap section-head">
  <div class="flex items-center gap-2">
    <span class="mw-chip mw-chip-title">數據紀錄</span>
  </div>
    <div class="flex items-center gap-2">
    <span class="text-sm intro" style="color:var(--mw-gray)">近期上傳的健康紀錄（依時間新→舊）</span>
  </div>
  <div class="flex items-center gap-2">
    <button id="prevPage" class="mw-btn mw-btn-ghost">上一頁</button>
    <button id="nextPage" class="mw-btn mw-btn-primary">下一頁</button>
  </div>
</div>
      <div id="record-list" class="mt-4 flex flex-col gap-4"></div>
    </section>
  </main>

  <!-- 浮動新增鍵 -->
  <button class="mw-fab" aria-label="新增紀錄" onclick="location.href='ocr_data2.html'">＋</button>

  <!-- Firebase + 列表程式 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc as docRef } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCUzxpn1quR9PPSBeZBGG17XVh8vPzjY",
      authDomain: "medwell-test1.firebaseapp.com",
      projectId: "medwell-test1",
      storageBucket: "medwell-test1.appspot.com",
      messagingSenderId: "860851688843",
      appId: "1:860851688843:web:622eb8feccad45ce640b8e",
      measurementId: "G-9FGX9SG7XB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const recordList = document.getElementById("record-list");
    const prevPageBtn = document.getElementById("prevPage");
    const nextPageBtn = document.getElementById("nextPage");

    const PAGE_SIZE = 4;
    let currentPage = 0;
    let records = [];

    /* ---------- Skeleton：載入前顯示 ---------- */
    function showSkeleton(n = PAGE_SIZE) {
      recordList.innerHTML = "";
      for (let i = 0; i < n; i++) {
        const card = document.createElement("div");
        card.className = "skel animate-fadeInUp";
        card.style.animationDelay = `${i * 0.06}s`;
        card.innerHTML = `
          <div class="skel-body">
            <div class="skel-dot"></div>
            <div class="skel-pill"></div>
          </div>`;
        recordList.appendChild(card);
      }
    }
    function clearSkeleton() {
      recordList.innerHTML = "";
    }

    /* ---------- 取得資料 ---------- */
    async function loadRecords() {
      records = [];
      const q = query(collection(db, "health_records"), orderBy("timestamp", "desc"));
      const snapshot = await getDocs(q);
      snapshot.forEach(doc => {
        records.push({ ...doc.data(), _id: doc.id });
      });
    }

    /* ---------- 類別判斷 ---------- */
    function getRecordType(obj) {
      if (!obj || typeof obj !== 'object') return '健康紀錄';
      const keys = Object.keys(obj).map(String);
      const values = Object.values(obj).flatMap(v => (v && typeof v === 'object') ? Object.values(v) : [v]).map(v => String(v ?? ''));
      const hay = (keys.join(' ') + ' ' + values.join(' ')).toLowerCase();
      const vitalsTokens = ['血壓','收縮壓','舒張壓','脈搏','心跳','pulse','heart rate','hr','bp','sbp','dbp','血糖','glucose','hba1c','糖化','systolic','diastolic'];
      if (vitalsTokens.some(t => hay.includes(t))) return '血壓紀錄';
      const diseaseTokens = ['疾病','病名','診斷','病史','disease','diagnosis','dx'];
      const hasXxDisease = /[\u4e00-\u9fa5]{1,6}病/.test(hay);
      if (diseaseTokens.some(t => hay.includes(t)) || hasXxDisease) return '疾病紀錄';
      return '健康紀錄';
    }

    /* ---------- 渲染分頁 ---------- */
    function renderPage() {
      clearSkeleton();                       // 清骨架
      const start = currentPage * PAGE_SIZE;
      const end = start + PAGE_SIZE;
      const pageRecords = records.slice(start, end);

      pageRecords.forEach((data, idx) => {
        const ts = data.timestamp?.seconds ? new Date(data.timestamp.seconds * 1000) : new Date();
        const month = ts.getMonth() + 1;
        const day = ts.getDate();
        const showObj = data.data || data;

        const item = document.createElement('div');
        item.className = "mw-item rounded-2xl p-5 md:p-6 flex items-center gap-4 relative transition hover:scale-[1.01] hover:shadow duration-150 animate-fadeInUp";
        item.style.animationDelay = `${idx * 0.08}s`;

		const actions = document.createElement('div');
		actions.className = "absolute top-2 right-2 flex gap-1 z-10";
		actions.innerHTML = `
		  <button class="icon-btn px-2 py-1 rounded-md text-xs bg-white border border-[var(--mw-border)] hover:bg-[var(--mw-cream)] text-[var(--mw-ink)] shadow edit-btn"
				  aria-label="編輯" data-id="${data._id}" data-idx="${start + idx}">
			<span class="icon">✎</span><span class="action-label">&nbsp;編輯</span>
		  </button>
		  <button class="icon-btn px-2 py-1 rounded-md text-xs bg-white border border-[var(--mw-border)] hover:bg-red-50 text-red-600 shadow delete-btn"
				  aria-label="刪除" data-id="${data._id}" data-idx="${start + idx}">
			<span class="icon">🗑</span><span class="action-label">&nbsp;刪除</span>
		  </button>
		`;


        const dateBox = document.createElement('div');
        dateBox.className = "mw-date w-16 h-16 rounded-2xl flex flex-col justify-center items-center shadow-sm flex-shrink-0 animate-fadeInUp";
        dateBox.style.animationDelay = `${idx * 0.08 + 0.04}s`;
        dateBox.innerHTML = `
          <span class="text-2xl font-black leading-tight" style="color:var(--mw-green)">${day}</span>
          <span class="text-xs" style="color:var(--mw-gray)">${month}月</span>
        `;

        const mid = document.createElement('div');
        mid.className = "flex-1 min-w-0 animate-fadeInUp";
        mid.style.animationDelay = `${idx * 0.08 + 0.06}s`;
        mid.innerHTML = `
          <div class="mw-badge inline-flex items-center px-3 py-1 rounded-full text-sm font-extrabold tracking-wide">
            ${getRecordType(showObj)}
          </div>
        `;

        item.appendChild(actions);
        item.appendChild(dateBox);
        item.appendChild(mid);
        recordList.appendChild(item);
      });

      // 綁定編輯
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.onclick = e => {
          e.stopPropagation();
          const idx = +btn.getAttribute("data-idx");
          localStorage.setItem('edit_data', JSON.stringify(records[idx]));
          window.location.href = `ocr_data2.html?id=${records[idx]._id}`;
        };
      });

      // 綁定刪除
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.onclick = async e => {
          e.stopPropagation();
          const idx = +btn.getAttribute("data-idx");
          const _id = records[idx]._id;
          if (!confirm('確定要刪除這筆紀錄嗎？')) return;
          try {
            await deleteDoc(docRef(db, "health_records", _id));
            alert('已刪除！');
            records.splice(idx, 1);
            if (currentPage > 0 && currentPage * PAGE_SIZE >= records.length) currentPage--;
            renderPage();
          } catch (err) {
            console.error(err);
            alert('刪除失敗，請檢查網路或權限');
          }
        };
      });
    }

    /* ---------- 分頁 ---------- */
    prevPageBtn.addEventListener("click", () => {
      if (currentPage > 0) { currentPage--; showSkeleton(); renderPage(); }
    });
    nextPageBtn.addEventListener("click", () => {
      if ((currentPage + 1) * PAGE_SIZE < records.length) { currentPage++; showSkeleton(); renderPage(); }
    });

    /* ---------- 啟動 ---------- */
    showSkeleton();            // 一進頁先顯示骨架
    await loadRecords();       // 取回資料（可能 1~2 秒）
    renderPage();              // 換成真正卡片
  </script>
</body>
</html>
